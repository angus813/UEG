<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>卫戍协议 · 星河防线</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0c0f;
            color: #e0e8f0;
            font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
            padding: 12px;
        }

        /* ===== 主容器 ===== */
        .game-container {
            width: 100%;
            max-width: 1100px;
            background: linear-gradient(145deg, #13171c 0%, #0d1014 100%);
            border: 1px solid #2a3340;
            box-shadow: 0 0 40px rgba(0, 160, 255, 0.12);
            display: flex;
            flex-direction: row;
            overflow: hidden;
            border-radius: 12px;
            position: relative;
        }

        /* ===== 左侧面板（现为引导区） ===== */
        .left-panel {
            flex: 0 0 62%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1f2833;
            padding: 20px 16px;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            background: radial-gradient(circle at 30% 40%, #0f1a24, #0a0e12);
        }
        .left-panel .welcome {
            text-align: center;
            max-width: 360px;
        }
        .left-panel .welcome .big-icon {
            font-size: 4rem;
            margin-bottom: 12px;
            display: block;
        }
        .left-panel .welcome h2 {
            color: #00c8ff;
            font-size: 1.8rem;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow: 0 0 20px #00a3ff44;
        }
        .left-panel .welcome p {
            color: #8aacbe;
            font-size: 1rem;
            line-height: 1.6;
        }
        .left-panel .welcome .hint {
            margin-top: 18px;
            padding: 10px 20px;
            background: #1a2a36;
            border: 1px solid #2a4a5a;
            border-radius: 30px;
            display: inline-block;
            color: #88ccff;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* ===== 右侧面板：功能卡片 ===== */
        .right-panel {
            flex: 1;
            min-width: 180px;
            padding: 14px 14px 12px 14px;
            background: rgba(12, 16, 20, 0.7);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ===== 头部（保留但简化） ===== */
        .header {
            display: none; /* 主界面不再显示状态，因为游戏在弹窗内 */
        }

        /* ===== 右侧面板：功能卡片 ===== */
        .func-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .func-item {
            background: rgba(18, 24, 32, 0.7);
            border: 1px solid #1f2a33;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        .func-item:hover {
            border-color: #3a6a8a;
            background: rgba(24, 34, 46, 0.8);
            transform: translateX(3px);
        }
        .func-item:active {
            transform: scale(0.97);
        }
        .func-item .icon {
            font-size: 1.4rem;
            flex-shrink: 0;
            width: 30px;
            text-align: center;
        }
        .func-item .info {
            flex: 1;
            min-width: 0;
        }
        .func-item .info .name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #c8dce8;
        }
        .func-item .info .desc {
            font-size: 0.7rem;
            color: #6a8a9e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .func-item .badge {
            background: #00aaff22;
            border: 1px solid #00aaff44;
            border-radius: 12px;
            padding: 0 10px;
            font-size: 0.6rem;
            color: #88ccff;
            line-height: 1.8;
            flex-shrink: 0;
        }

        /* ===== 右下：大按钮 ===== */
        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-top: 4px;
            flex-shrink: 0;
        }
        .mode-btn {
            flex: 1;
            background: linear-gradient(145deg, #1a2633, #0f171f);
            border: 1px solid #2a3a48;
            border-radius: 10px;
            padding: 14px 6px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .mode-btn:hover {
            border-color: #4a8aaa;
            background: #1f2e3d;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 120, 255, 0.15);
        }
        .mode-btn:active {
            transform: scale(0.96);
        }
        .mode-btn .big-icon {
            font-size: 2rem;
            line-height: 1.2;
        }
        .mode-btn .label {
            font-weight: 700;
            font-size: 1rem;
            color: #d0e4f0;
            letter-spacing: 1px;
        }
        .mode-btn .sub {
            font-size: 0.6rem;
            color: #6a8a9e;
        }
        .mode-btn.primary {
            border-color: #0088cc;
            background: linear-gradient(145deg, #0a2a3a, #06141e);
        }
        .mode-btn.primary:hover {
            border-color: #00ccff;
            background: #0f3348;
        }

        /* ===== 模态弹窗（通用） ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 200;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.25s ease;
        }
        .modal.active {
            display: flex;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-content {
            background: #141c26;
            border: 1px solid #2a3a48;
            border-radius: 14px;
            padding: 20px 24px 24px 24px;
            width: 580px;
            max-width: 94%;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }
        .modal-content .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 1.6rem;
            color: #6a8a9e;
            cursor: pointer;
            transition: 0.2s;
            background: none;
            border: none;
            font-family: inherit;
            z-index: 10;
        }
        .modal-content .close-btn:hover {
            color: #ff6a4a;
            transform: rotate(90deg);
        }
        .modal-content h3 {
            color: #ff8c2e;
            font-size: 1.3rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #1f2a33;
            padding-bottom: 10px;
        }

        /* ===== 独立模拟内的游戏样式（复制自原主界面） ===== */
        #miniGameContainer {
            width: 100%;
        }
        #miniGameContainer .mini-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px 4px 8px;
            border-bottom: 1px solid #1f2833;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }
        #miniGameContainer .mini-header .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #00c8ff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00a3ff88;
        }
        #miniGameContainer .mini-stats {
            display: flex;
            gap: 14px;
            font-size: 0.9rem;
        }
        #miniGameContainer .mini-stats .stat {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.3);
            padding: 0 10px 0 6px;
            border-radius: 20px;
            border: 1px solid #1f2833;
        }
        #miniGameContainer .mini-stats .stat .stat-icon {
            font-size: 1rem;
        }
        #miniGameContainer .mini-stats .stat span:last-child {
            font-weight: 700;
            color: #ff8c2e;
            min-width: 18px;
        }

        #miniGameContainer .grid-wrap {
            padding: 4px 0;
        }
        #miniGameContainer .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 3px;
            background: #0b0f13;
            aspect-ratio: 5/6;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            border: 1px solid #1a222b;
            border-radius: 4px;
            padding: 3px;
        }
        #miniGameContainer .cell {
            background: #151d26;
            border: 1px solid #222c38;
            position: relative;
            cursor: pointer;
            transition: 0.1s;
            border-radius: 2px;
        }
        #miniGameContainer .cell:hover {
            background: #1f2b38;
        }
        #miniGameContainer .cell:active {
            transform: scale(0.96);
        }
        #miniGameContainer .tower {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(20, 50, 70, 0.5);
            border-radius: 2px;
            text-shadow: 0 0 8px #00aaff66;
        }
        #miniGameContainer .enemy {
            position: absolute;
            width: 56%;
            height: 56%;
            top: 22%;
            left: 22%;
            background: radial-gradient(circle at 30% 30%, #ff6a4a, #cc2233);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 0 12px #ff444488;
            transition: width 0.1s;
            border: 1px solid #ff886688;
        }

        #miniGameContainer .btn-start-wrap {
            text-align: center;
            padding: 6px 0 4px 0;
        }
        #miniGameContainer .btn-start {
            background: linear-gradient(135deg, #00b8ff, #0077cc);
            border: none;
            color: #fff;
            padding: 6px 28px;
            font-weight: 700;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 2px;
            border-radius: 30px;
            box-shadow: 0 0 20px #0077ff66;
            transition: 0.2s;
        }
        #miniGameContainer .btn-start:hover {
            transform: scale(1.04);
            box-shadow: 0 0 30px #0088ffaa;
        }
        #miniGameContainer .btn-start:active {
            transform: scale(0.96);
        }

        #miniGameContainer .tower-bar {
            display: flex;
            gap: 8px;
            padding: 6px 8px 2px 8px;
            background: rgba(12, 16, 20, 0.6);
            border-top: 1px solid #1a222b;
            overflow-x: auto;
            flex-wrap: nowrap;
            justify-content: space-around;
            margin-top: 4px;
        }
        #miniGameContainer .tower-card {
            flex: 1;
            min-width: 56px;
            max-width: 90px;
            background: rgba(18, 24, 32, 0.8);
            border: 1px solid #2a3a48;
            padding: 4px 2px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            border-radius: 6px;
        }
        #miniGameContainer .tower-card:hover {
            background: #1f2e3d;
            border-color: #3a5a70;
        }
        #miniGameContainer .tower-card.selected {
            border-color: #ff8c2e;
            box-shadow: 0 0 16px rgba(255, 140, 46, 0.4);
            background: #1f2a33;
        }
        #miniGameContainer .tower-card:active {
            transform: scale(0.94);
        }
        #miniGameContainer .tower-icon {
            font-size: 1.6rem;
            line-height: 1.2;
        }
        #miniGameContainer .tower-name {
            font-size: 0.6rem;
            color: #b0c7d6;
            white-space: nowrap;
        }
        #miniGameContainer .tower-cost {
            font-size: 0.55rem;
            color: #ffaa44;
        }

        /* ===== 强化弹窗（原版已存在，但为了在独立模拟中使用，保留全局） ===== */
        #upgradeModal .modal-content {
            width: 340px;
        }
        .upgrade-option {
            background: #0f1a22;
            border: 1px solid #1f2a33;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            color: #c8dce8;
            text-align: center;
        }
        .upgrade-option:hover {
            border-color: #00c8ff;
            background: #1a2a36;
            transform: scale(1.02);
        }
        .upgrade-option:active {
            transform: scale(0.97);
        }

        /* ===== 游戏结束（独立模拟内使用） ===== */
        #miniGameContainer .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.92);
            padding: 30px 40px;
            text-align: center;
            z-index: 60;
            border-radius: 14px;
            border: 1px solid #ff444466;
            box-shadow: 0 0 60px #ff000033;
            width: 80%;
            max-width: 300px;
        }
        #miniGameContainer .game-over h2 {
            color: #ff4444;
            font-size: 1.6rem;
            letter-spacing: 3px;
        }
        #miniGameContainer .game-over p {
            color: #b0c7d6;
            margin: 10px 0 16px;
        }
        #miniGameContainer .btn-restart {
            background: #00c8ff;
            border: none;
            padding: 8px 28px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
            color: #000;
            transition: 0.2s;
        }
        #miniGameContainer .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00c8ff88;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .game-container {
                flex-direction: column;
                max-width: 520px;
            }
            .left-panel {
                flex: none;
                border-right: none;
                border-bottom: 1px solid #1f2833;
                padding: 30px 16px;
                min-height: 200px;
            }
            .left-panel .welcome .big-icon {
                font-size: 3rem;
            }
            .left-panel .welcome h2 {
                font-size: 1.4rem;
            }
            .right-panel {
                flex: none;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 10px 12px;
                gap: 8px;
            }
            .func-list {
                flex-direction: row;
                flex: 1 1 100%;
                gap: 6px;
            }
            .func-item {
                flex: 1;
                padding: 8px 10px;
                min-width: 70px;
            }
            .func-item .info .desc {
                display: none;
            }
            .func-item .badge {
                display: none;
            }
            .mode-buttons {
                flex: 1 1 100%;
                gap: 8px;
            }
            .mode-btn {
                padding: 10px 4px;
            }
            .mode-btn .big-icon {
                font-size: 1.4rem;
            }
            .mode-btn .label {
                font-size: 0.85rem;
            }
            .modal-content {
                width: 96%;
                padding: 16px;
            }
            #miniGameContainer .grid {
                max-width: 100%;
            }
            #miniGameContainer .tower-card {
                min-width: 44px;
                padding: 2px 2px;
            }
            #miniGameContainer .tower-icon {
                font-size: 1.3rem;
            }
            #miniGameContainer .tower-name {
                font-size: 0.5rem;
            }
            #miniGameContainer .tower-cost {
                font-size: 0.5rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 4px;
            }
            .game-container {
                border-radius: 6px;
            }
            .left-panel .welcome .big-icon {
                font-size: 2.5rem;
            }
            .left-panel .welcome h2 {
                font-size: 1.2rem;
            }
            .left-panel .welcome p {
                font-size: 0.85rem;
            }
            .modal-content {
                padding: 12px 14px;
            }
            #miniGameContainer .cell .tower {
                font-size: 1.1rem;
            }
            #miniGameContainer .enemy {
                font-size: 0.45rem;
            }
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0c0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3a48;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a5a70;
        }
    </style>
</head>
<body>

    <div class="game-container">

        <!-- ===== 左侧面板（引导区） ===== -->
        <div class="left-panel">
            <div class="welcome">
                <span class="big-icon">🚀</span>
                <h2>卫戍协议</h2>
                <p>星河防线 · 塔防战略</p>
                <div class="hint">🛡️ 点击「独立模拟」开始作战</div>
            </div>
        </div>

        <!-- ===== 右侧面板：功能 ===== -->
        <div class="right-panel">
            <div class="func-list">
                <div class="func-item" id="btnSupply">
                    <span class="icon">📦</span>
                    <div class="info">
                        <div class="name">物资调配处</div>
                        <div class="desc">调整资源分配 · 增益</div>
                    </div>
                    <span class="badge">调配</span>
                </div>
                <div class="func-item" id="btnBlueprint">
                    <span class="icon">📐</span>
                    <div class="info">
                        <div class="name">蓝图数据库</div>
                        <div class="desc">科技研发 · 解锁</div>
                    </div>
                    <span class="badge">研究</span>
                </div>
                <div class="func-item" id="btnInvite">
                    <span class="icon">🤝</span>
                    <div class="info">
                        <div class="name">模拟邀约</div>
                        <div class="desc">外交 · 联合</div>
                    </div>
                    <span class="badge">邀约</span>
                </div>
            </div>

            <!-- 两个大按钮 -->
            <div class="mode-buttons">
                <div class="mode-btn primary" id="btnSolo">
                    <span class="big-icon">🛡️</span>
                    <span class="label">独立模拟</span>
                    <span class="sub">孤军奋战</span>
                </div>
                <div class="mode-btn" id="btnAlliance">
                    <span class="big-icon">⚔️</span>
                    <span class="label">同盟模拟</span>
                    <span class="sub">联合作战</span>
                </div>
            </div>
        </div>

        <!-- ===== 通用模态弹窗 ===== -->
        <div class="modal" id="genericModal">
            <div class="modal-content">
                <button class="close-btn" id="modalCloseBtn">✕</button>
                <h3 id="modalTitle">标题</h3>
                <div id="modalBody"></div>
            </div>
        </div>

        <!-- ===== 强化选择弹窗（全局） ===== -->
        <div class="modal" id="upgradeModal">
            <div class="modal-content">
                <h3>📡 选择强化协议</h3>
                <div id="upgradeOptions"></div>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  1. 游戏核心逻辑（完整塔防，将在独立模拟弹窗中运行）
        // ============================================================

        const GRID_COLS = 5;
        const GRID_ROWS = 6;
        let grid = [];
        let enemies = [];
        let energy = 100;
        let life = 10;
        let wave = 1;
        let gameActive = false;
        let selectedTower = null;
        let spawnInterval = null;
        let gameLoopInterval = null;
        let energyRegen = 2;
        let globalDamageBonus = 0;
        let globalAttackSpeed = 1;

        const towerStats = {
            guard: { name: '护卫舰', damage: 10, range: 1.5, fireRate: 1.0, cost: 20 },
            destroyer: { name: '驱逐舰', damage: 18, range: 2.5, fireRate: 1.2, cost: 35 },
            cruiser: { name: '巡洋舰', damage: 30, range: 3.0, fireRate: 0.8, cost: 50 },
            battleship: { name: '战列舰', damage: 55, range: 4.0, fireRate: 0.5, cost: 80 }
        };

        function createEnemy(waveNum) {
            let baseHp = 50 + waveNum * 20;
            let speed = 0.6 + waveNum * 0.05;
            let armor = Math.floor(waveNum / 3) * 2;
            return {
                hp: baseHp,
                maxHp: baseHp,
                speed: speed,
                armor: armor,
                row: Math.floor(Math.random() * GRID_ROWS),
                col: -0.5,
                reward: 15 + waveNum * 2
            };
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            if (!gridEl) return;
            gridEl.innerHTML = '';
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', () => placeTower(r, c));
                    if (grid[r][c]) {
                        const iconMap = { guard: '⚓', destroyer: '🚢', cruiser: '🛳️', battleship: '🚢✨' };
                        cell.innerHTML = '<div class="tower">' + (iconMap[grid[r][c].type] || '⚙️') + '</div>';
                    }
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderEnemies() {
            const container = document.getElementById('grid');
            if (!container) return;
            container.querySelectorAll('.enemy').forEach(el => el.remove());
            const cells = container.querySelectorAll('.cell');
            enemies.forEach(enemy => {
                const row = Math.floor(enemy.row);
                const col = Math.floor(enemy.col);
                if (row >= 0 && row < GRID_ROWS && col >= 0 && col < GRID_COLS) {
                    const index = row * GRID_COLS + col;
                    if (cells[index]) {
                        const enemyEl = document.createElement('div');
                        enemyEl.className = 'enemy';
                        const pct = Math.max(18, (enemy.hp / enemy.maxHp) * 90);
                        enemyEl.style.width = pct + '%';
                        enemyEl.style.height = pct + '%';
                        enemyEl.innerHTML = Math.ceil(enemy.hp);
                        cells[index].appendChild(enemyEl);
                    }
                }
            });
        }

        function placeTower(row, col) {
            if (!gameActive || !selectedTower) return;
            if (grid[row][col]) return;
            const stats = towerStats[selectedTower];
            if (energy < stats.cost) return;
            energy -= stats.cost;
            grid[row][col] = {
                type: selectedTower,
                lastFireTime: 0,
                damage: stats.damage + globalDamageBonus,
                fireRate: stats.fireRate * globalAttackSpeed,
                range: stats.range
            };
            updateEnergy();
            renderGrid();
        }

        function updateEnergy() {
            const el = document.getElementById('energyDisplay');
            if (el) el.textContent = Math.floor(energy);
        }

        function updateLife() {
            const el = document.getElementById('lifeDisplay');
            if (el) el.textContent = life;
        }

        function updateWave() {
            const el = document.getElementById('waveDisplay');
            if (el) el.textContent = wave;
        }

        function towersAttack(now) {
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const tower = grid[r][c];
                    if (!tower) continue;
                    if (now - tower.lastFireTime < 1000 / tower.fireRate) continue;
                    let target = null;
                    for (let enemy of enemies) {
                        if (enemy.col > GRID_COLS) continue;
                        const dist = Math.sqrt(Math.pow(enemy.row - r, 2) + Math.pow(enemy.col - c, 2));
                        if (dist <= tower.range) {
                            if (!target || enemy.col > target.col) target = enemy;
                        }
                    }
                    if (target) {
                        tower.lastFireTime = now;
                        let dmg = tower.damage - target.armor;
                        if (dmg < 1) dmg = 1;
                        target.hp -= dmg;
                        if (target.hp <= 0) {
                            const idx = enemies.indexOf(target);
                            if (idx > -1) {
                                enemies.splice(idx, 1);
                                energy += target.reward;
                                updateEnergy();
                            }
                        }
                    }
                }
            }
        }

        function moveEnemies() {
            for (let enemy of enemies) {
                enemy.col += enemy.speed * 0.016;
            }
            enemies = enemies.filter(enemy => {
                if (enemy.col >= GRID_COLS) {
                    life--;
                    updateLife();
                    if (life <= 0) gameOver();
                    return false;
                }
                return true;
            });
        }

        function gameLoop() {
            if (!gameActive) return;
            const now = Date.now();
            towersAttack(now);
            moveEnemies();
            renderEnemies();
            energy = Math.min(energy + energyRegen * 0.05, 200);
            updateEnergy();
        }

        function spawnEnemy() {
            if (!gameActive) return;
            const enemy = createEnemy(wave);
            enemies.push(enemy);
        }

        function startWave() {
            const startBtn = document.getElementById('startBtn');
            if (startBtn) startBtn.style.display = 'none';
            gameActive = true;
            const enemyCount = 3 + wave * 2;
            let spawned = 0;
            if (spawnInterval) clearInterval(spawnInterval);
            spawnInterval = setInterval(() => {
                if (spawned < enemyCount) {
                    spawnEnemy();
                    spawned++;
                } else {
                    clearInterval(spawnInterval);
                    spawnInterval = null;
                    checkWaveEnd();
                }
            }, 800);
        }

        function checkWaveEnd() {
            const checker = setInterval(() => {
                if (!gameActive) { clearInterval(checker); return; }
                if (enemies.length === 0 && !spawnInterval) {
                    clearInterval(checker);
                    gameActive = false;
                    showUpgrade();
                }
            }, 500);
        }

        function showUpgrade() {
            const upgrades = [
                { name: '⚡ 能量回复 +1', effect: () => { energyRegen += 1; } },
                { name: '🔫 全体攻击 +5', effect: () => { globalDamageBonus += 5; } },
                { name: '💨 攻速 +20%', effect: () => { globalAttackSpeed *= 1.2; } },
                { name: '❤️ 生命 +2', effect: () => { life = Math.min(life + 2, 20);
                        updateLife(); } },
                { name: '⚡ 立即 +80 能量', effect: () => { energy = Math.min(energy + 80, 200);
                        updateEnergy(); } },
            ];
            const shuffled = [...upgrades].sort(() => Math.random() - 0.5);
            const options = shuffled.slice(0, 3);
            const container = document.getElementById('upgradeOptions');
            if (!container) return;
            container.innerHTML = options.map((opt, i) =>
                `<div class="upgrade-option" onclick="selectUpgrade(${i})">${opt.name}</div>`
            ).join('');
            document.getElementById('upgradeModal').style.display = 'flex';
            window.tempUpgrades = options;
        }

        window.selectUpgrade = function(index) {
            if (window.tempUpgrades && window.tempUpgrades[index]) {
                window.tempUpgrades[index].effect();
            }
            document.getElementById('upgradeModal').style.display = 'none';
            wave++;
            updateWave();
            const startBtn = document.getElementById('startBtn');
            if (startBtn) startBtn.style.display = 'block';
        };

        function gameOver() {
            gameActive = false;
            if (spawnInterval) clearInterval(spawnInterval);
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            const finalWaves = document.getElementById('finalWaves');
            if (finalWaves) finalWaves.textContent = wave;
            const over = document.getElementById('gameOver');
            if (over) over.style.display = 'block';
        }

        function restartGame() {
            grid = Array(GRID_ROWS).fill().map(() => Array(GRID_COLS).fill(null));
            enemies = [];
            energy = 100;
            life = 10;
            wave = 1;
            energyRegen = 2;
            globalDamageBonus = 0;
            globalAttackSpeed = 1;
            gameActive = false;
            selectedTower = null;
            if (spawnInterval) clearInterval(spawnInterval);
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            spawnInterval = null;
            gameLoopInterval = null;
            const over = document.getElementById('gameOver');
            if (over) over.style.display = 'none';
            const startBtn = document.getElementById('startBtn');
            if (startBtn) startBtn.style.display = 'block';
            updateEnergy();
            updateLife();
            updateWave();
            renderGrid();
            renderEnemies();
            // 重新绑定塔选择
            bindTowerCards();
        }

        // 塔选择绑定（用于独立模拟内）
        function bindTowerCards() {
            document.querySelectorAll('#miniGameContainer .tower-card').forEach(card => {
                card.removeEventListener('click', towerCardClick);
                card.addEventListener('click', towerCardClick);
            });
        }

        function towerCardClick(e) {
            const card = e.currentTarget;
            document.querySelectorAll('#miniGameContainer .tower-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedTower = card.dataset.type;
        }

        // ============================================================
        //  2. 独立模拟弹窗 — 加载完整游戏
        // ============================================================

        const modal = document.getElementById('genericModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalClose = document.getElementById('modalCloseBtn');

        function openModal(title, html) {
            modalTitle.textContent = title;
            modalBody.innerHTML = html;
            modal.classList.add('active');
        }

        modalClose.addEventListener('click', () => {
            modal.classList.remove('active');
            // 关闭时清理游戏循环
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            if (spawnInterval) clearInterval(spawnInterval);
            gameLoopInterval = null;
            spawnInterval = null;
            gameActive = false;
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
                if (gameLoopInterval) clearInterval(gameLoopInterval);
                if (spawnInterval) clearInterval(spawnInterval);
                gameLoopInterval = null;
                spawnInterval = null;
                gameActive = false;
            }
        });

        // 构建独立模拟内容
        function buildSoloGame() {
            // 重置游戏状态
            grid = Array(GRID_ROWS).fill().map(() => Array(GRID_COLS).fill(null));
            enemies = [];
            energy = 100;
            life = 10;
            wave = 1;
            energyRegen = 2;
            globalDamageBonus = 0;
            globalAttackSpeed = 1;
            gameActive = false;
            selectedTower = null;
            if (spawnInterval) clearInterval(spawnInterval);
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            spawnInterval = null;
            gameLoopInterval = null;

            const html = `
                <div id="miniGameContainer">
                    <div class="mini-header">
                        <div class="title">🛡️ 卫戍协议 · 独立模拟</div>
                        <div class="mini-stats">
                            <div class="stat"><span class="stat-icon">⚡</span><span id="energyDisplay">100</span></div>
                            <div class="stat"><span class="stat-icon">❤️</span><span id="lifeDisplay">10</span></div>
                            <div class="stat"><span class="stat-icon">🌊</span><span id="waveDisplay">1</span></div>
                        </div>
                    </div>
                    <div class="grid-wrap">
                        <div class="grid" id="grid"></div>
                    </div>
                    <div class="btn-start-wrap">
                        <button class="btn-start" id="startBtn">⚔ 开始作战</button>
                    </div>
                    <div class="tower-bar" id="towerBar">
                        <div class="tower-card" data-type="guard" data-cost="20">
                            <div class="tower-icon">⚓</div>
                            <div class="tower-name">护卫舰</div>
                            <div class="tower-cost">20⚡</div>
                        </div>
                        <div class="tower-card" data-type="destroyer" data-cost="35">
                            <div class="tower-icon">🚢</div>
                            <div class="tower-name">驱逐舰</div>
                            <div class="tower-cost">35⚡</div>
                        </div>
                        <div class="tower-card" data-type="cruiser" data-cost="50">
                            <div class="tower-icon">🛳️</div>
                            <div class="tower-name">巡洋舰</div>
                            <div class="tower-cost">50⚡</div>
                        </div>
                        <div class="tower-card" data-type="battleship" data-cost="80">
                            <div class="tower-icon">🚢✨</div>
                            <div class="tower-name">战列舰</div>
                            <div class="tower-cost">80⚡</div>
                        </div>
                    </div>
                    <div class="game-over" id="gameOver">
                        <h2>💀 防线失守</h2>
                        <p>你坚持了 <span id="finalWaves">0</span> 波</p>
                        <button class="btn-restart" onclick="restartGame()">🔄 重新部署</button>
                    </div>
                </div>
            `;

            openModal('🛡️ 独立模拟', html);

            // 初始化游戏
            renderGrid();
            updateEnergy();
            updateLife();
            updateWave();
            bindTowerCards();

            // 绑定开始按钮
            const startBtn = document.getElementById('startBtn');
            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    if (gameActive) return;
                    startWave();
                    if (gameLoopInterval) clearInterval(gameLoopInterval);
                    gameLoopInterval = setInterval(gameLoop, 50);
                });
            }

            // 绑定塔选择（再次确保）
            bindTowerCards();

            // 将 restartGame 暴露到全局（已定义）
        }

        // 独立模拟按钮
        document.getElementById('btnSolo').addEventListener('click', buildSoloGame);

        // ============================================================
        //  3. 其他右侧功能（物资调配、蓝图、邀约）
        //     —— 这些功能作用于独立模拟内的游戏（全局变量）
        // ============================================================

        // ---- 物资调配处 ----
        document.getElementById('btnSupply').addEventListener('click', () => {
            const alloc = { attack: 0, defense: 0, speed: 0 };
            const renderSupply = () => {
                const html = `
                    <p style="margin-bottom:6px;">当前能量：<strong style="color:#ff8c2e;">${Math.floor(energy)}</strong> ⚡</p>
                    <p style="font-size:0.85rem;color:#6a8a9e;margin-bottom:12px;">调配资源获得临时增益（持续本波）</p>
                    <div class="item-list">
                        <div class="item-row">
                            <span class="left"><span class="ico">⚔️</span> 攻击强化</span>
                            <span><button class="action-btn" onclick="allocSupply('attack',10)">+10 ⚡</button></span>
                        </div>
                        <div class="item-row">
                            <span class="left"><span class="ico">🛡️</span> 防御强化</span>
                            <span><button class="action-btn" onclick="allocSupply('defense',10)">+10 ⚡</button></span>
                        </div>
                        <div class="item-row">
                            <span class="left"><span class="ico">💨</span> 移速强化</span>
                            <span><button class="action-btn" onclick="allocSupply('speed',10)">+10 ⚡</button></span>
                        </div>
                    </div>
                    <div style="font-size:0.75rem;color:#4a6a7e;margin-top:8px;border-top:1px solid #1a222b;padding-top:10px;">
                        ⚡ 当前调配：攻击 +${alloc.attack} ｜ 防御 +${alloc.defense} ｜ 速度 +${alloc.speed}
                    </div>
                `;
                openModal('📦 物资调配处', html);
                window._allocData = alloc;
            };
            window.allocSupply = function(type, cost) {
                if (energy < cost) { alert('⚡ 能量不足！'); return; }
                energy -= cost;
                updateEnergy();
                const data = window._allocData || { attack: 0, defense: 0, speed: 0 };
                data[type] += 1;
                window._allocData = data;
                if (type === 'attack') globalDamageBonus += 2;
                else if (type === 'defense') { life = Math.min(life + 1, 20);
                    updateLife(); } else if (type === 'speed') globalAttackSpeed *= 1.05;
                renderSupply();
            };
            renderSupply();
        });

        // ---- 蓝图数据库 ----
        document.getElementById('btnBlueprint').addEventListener('click', () => {
            const blueprints = [
                { name: '⚓ 护卫舰 Mk.II', desc: '攻击 +4, 射速 +10%', unlocked: true },
                { name: '🚢 驱逐舰 Mk.II', desc: '射程 +0.5, 攻击 +6', unlocked: true },
                { name: '🛳️ 巡洋舰 Mk.II', desc: '攻击 +10, 造价 -10', unlocked: false },
                { name: '🚢✨ 战列舰 Mk.II', desc: '攻击 +15, 射速 +15%', unlocked: false },
                { name: '🔬 能量核心', desc: '能量回复 +2', unlocked: false },
            ];
            let html =
                `<p style="font-size:0.85rem;color:#6a8a9e;">已解锁蓝图可研发升级</p><div class="item-list">`;
            blueprints.forEach((bp, i) => {
                const status = bp.unlocked ?
                    '<span style="color:#44cc88;">● 已解锁</span>' :
                    '<span style="color:#ff8844;">🔒 未解锁</span>';
                const btn = bp.unlocked ?
                    `<button class="action-btn" onclick="researchBlueprint(${i})">研究</button>` :
                    `<button class="action-btn secondary" disabled>🔒</button>`;
                html += `
                    <div class="item-row">
                        <span class="left"><span class="ico">${bp.name.split(' ')[0]}</span> ${bp.name}</span>
                        <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            <span style="font-size:0.7rem;color:#6a8a9e;">${bp.desc}</span>
                            ${btn}
                        </span>
                    </div>
                `;
            });
            html +=
                `</div><div style="font-size:0.7rem;color:#4a6a7e;margin-top:6px;">💡 研究消耗 30⚡，可提升塔性能</div>`;
            openModal('📐 蓝图数据库', html);

            window.researchBlueprint = function(idx) {
                if (energy < 30) { alert('⚡ 需要 30 能量'); return; }
                energy -= 30;
                updateEnergy();
                const effects = [
                    () => { globalDamageBonus += 4;
                        alert('✅ 护卫舰 Mk.II 研发完成！全体攻击 +4'); },
                    () => { globalDamageBonus += 6;
                        alert('✅ 驱逐舰 Mk.II 研发完成！全体攻击 +6'); },
                    () => { alert('🔬 巡洋舰 Mk.II 需要先解锁前置科技'); },
                    () => { alert('🔬 战列舰 Mk.II 需要先解锁前置科技'); },
                    () => { energyRegen += 2;
                        alert('✅ 能量核心研发完成！能量回复 +2'); },
                ];
                if (effects[idx]) effects[idx]();
                document.getElementById('btnBlueprint').click();
            };
        });

        // ---- 模拟邀约 ----
        document.getElementById('btnInvite').addEventListener('click', () => {
            const factions = [
                { name: '⚔️ 铁血同盟', desc: '军事支援 · 攻击 +8', available: true },
                { name: '🛸 星云联邦', desc: '科技支援 · 能量 +50', available: true },
                { name: '🌌 暗影议会', desc: '情报支援 · 攻速 +15%', available: false },
                { name: '🔱 深海帝国', desc: '后勤支援 · 生命 +3', available: true },
            ];
            let html = `<p style="font-size:0.85rem;color:#6a8a9e;">向星系势力发出邀约，获得支援</p><div class="item-list">`;
            factions.forEach((f, i) => {
                const status = f.available ?
                    `<button class="action-btn" onclick="inviteFaction(${i})">邀约</button>` :
                    `<span style="color:#6a4a4a;">⏳ 冷却中</span>`;
                html += `
                    <div class="item-row">
                        <span class="left"><span class="ico">${f.name.split(' ')[0]}</span> ${f.name}</span>
                        <span style="display:flex;align-items:center;gap:8px;">
                            <span style="font-size:0.7rem;color:#6a8a9e;">${f.desc}</span>
                            ${status}
                        </span>
                    </div>
                `;
            });
            html += `</div><div style="font-size:0.7rem;color:#4a6a7e;margin-top:6px;">🤝 邀约成功可立即获得增益</div>`;
            openModal('🤝 模拟邀约', html);

            window.inviteFaction = function(idx) {
                const rewards = [
                    () => { globalDamageBonus += 8;
                        alert('⚔️ 铁血同盟响应！攻击 +8'); },
                    () => { energy = Math.min(energy + 50, 200);
                        updateEnergy();
                        alert('🛸 星云联邦支援！能量 +50'); },
                    () => { alert('🌌 暗影议会暂未回应...'); },
                    () => { life = Math.min(life + 3, 20);
                        updateLife();
                        alert('🔱 深海帝国支援！生命 +3'); },
                ];
                if (rewards[idx]) rewards[idx];
                document.getElementById('btnInvite').click();
            };
        });

        // ---- 同盟模拟（信息展示） ----
        document.getElementById('btnAlliance').addEventListener('click', () => {
            const allies = [
                { name: '⚔️ 铁血同盟', status: '已结盟', bonus: '攻击 +6' },
                { name: '🛸 星云联邦', status: '已结盟', bonus: '能量 +30' },
                { name: '🌌 暗影议会', status: '待邀请', bonus: '攻速 +10%' },
            ];
            let html = `
                <p style="font-size:0.9rem;color:#b0c7d6;">⚔️ <strong>同盟模拟</strong> — 联合作战</p>
                <div style="background:#0f171f;border-radius:8px;padding:12px;margin:10px 0;border:1px solid #1a222b;">
                    <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:#4a6a7e;padding-bottom:6px;border-bottom:1px solid #1a222b;">
                        <span>同盟势力</span><span>状态</span><span>增益</span>
                    </div>
            `;
            allies.forEach(a => {
                const statusColor = a.status === '已结盟' ? '#44cc88' : '#ff8844';
                html += `
                    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #0d141c;font-size:0.85rem;">
                        <span>${a.name}</span>
                        <span style="color:${statusColor};">${a.status}</span>
                        <span style="color:#88ccff;">${a.bonus}</span>
                    </div>
                `;
            });
            html += `
                </div>
                <p style="font-size:0.8rem;color:#4a6a7e;">🤝 同盟状态下，共享部分增益效果。</p>
                <div style="display:flex;gap:8px;margin-top:10px;">
                    <button class="action-btn" style="flex:1;padding:8px;" onclick="alert('🌌 向暗影议会发出同盟邀请...')">邀请暗影议会</button>
                    <button class="action-btn secondary" style="flex:1;padding:8px;" onclick="document.getElementById('genericModal').classList.remove('active')">关闭</button>
                </div>
            `;
            openModal('⚔️ 同盟模拟', html);
        });

        // ============================================================
        //  4. 初始化（无主游戏，只显示引导）
        // ============================================================

        console.log('🚀 卫戍协议 · 星河防线 已加载（独立模拟模式）');
        console.log('🛡️ 点击「独立模拟」开始游戏');

        // 暴露 restartGame 用于按钮
        window.restartGame = restartGame;
    </script>
</body>
</html>
