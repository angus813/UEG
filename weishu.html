<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>卫戍协议 · 星河防线</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0c0f;
            color: #e0e8f0;
            font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
            padding: 12px;
        }

        /* ===== 主容器 ===== */
        .game-container {
            width: 100%;
            max-width: 1100px;
            background: linear-gradient(145deg, #13171c 0%, #0d1014 100%);
            border: 1px solid #2a3340;
            box-shadow: 0 0 40px rgba(0, 160, 255, 0.12);
            display: flex;
            flex-direction: row;
            overflow: hidden;
            border-radius: 12px;
            position: relative;
        }

        /* ===== 左侧：游戏主体 ===== */
        .left-panel {
            flex: 0 0 62%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1f2833;
            padding-bottom: 8px;
        }

        /* ===== 右侧：功能面板 ===== */
        .right-panel {
            flex: 1;
            min-width: 180px;
            padding: 14px 14px 12px 14px;
            background: rgba(12, 16, 20, 0.7);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ===== 头部（左侧） ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px 8px 16px;
            border-bottom: 1px solid #1f2833;
            background: rgba(16, 20, 26, 0.6);
            flex-wrap: wrap;
            gap: 6px;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #00c8ff;
            text-shadow: 0 0 12px #00a3ff88;
        }
        .title small {
            font-size: 0.7rem;
            font-weight: 400;
            color: #6a8a9e;
            letter-spacing: 1px;
            margin-left: 6px;
        }
        .stats {
            display: flex;
            gap: 16px;
            font-size: 0.95rem;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 10px 2px 6px;
            border-radius: 20px;
            border: 1px solid #1f2833;
        }
        .stat-icon {
            font-size: 1.1rem;
        }
        #energyDisplay,
        #lifeDisplay,
        #waveDisplay {
            font-weight: 700;
            color: #ff8c2e;
            min-width: 20px;
        }

        /* ===== 网格 ===== */
        .grid-wrap {
            padding: 10px 12px 6px 12px;
            flex-shrink: 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 3px;
            background: #0b0f13;
            aspect-ratio: 5/6;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            border: 1px solid #1a222b;
            border-radius: 4px;
            padding: 3px;
        }
        .cell {
            background: #151d26;
            border: 1px solid #222c38;
            position: relative;
            cursor: pointer;
            transition: 0.1s;
            border-radius: 2px;
        }
        .cell:hover {
            background: #1f2b38;
        }
        .cell:active {
            transform: scale(0.96);
        }

        .tower {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: rgba(20, 50, 70, 0.5);
            border-radius: 2px;
            text-shadow: 0 0 8px #00aaff66;
        }

        .enemy {
            position: absolute;
            width: 56%;
            height: 56%;
            top: 22%;
            left: 22%;
            background: radial-gradient(circle at 30% 30%, #ff6a4a, #cc2233);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 0 12px #ff444488;
            transition: width 0.1s;
            border: 1px solid #ff886688;
        }

        /* ===== 开始按钮 ===== */
        .btn-start-wrap {
            text-align: center;
            padding: 2px 0 6px 0;
        }
        .btn-start {
            background: linear-gradient(135deg, #00b8ff, #0077cc);
            border: none;
            color: #fff;
            padding: 8px 32px;
            font-weight: 700;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 3px;
            border-radius: 30px;
            box-shadow: 0 0 20px #0077ff66;
            transition: 0.2s;
        }
        .btn-start:hover {
            transform: scale(1.04);
            box-shadow: 0 0 30px #0088ffaa;
        }
        .btn-start:active {
            transform: scale(0.96);
        }

        /* ===== 塔选择栏 ===== */
        .tower-bar {
            display: flex;
            gap: 8px;
            padding: 6px 12px 4px 12px;
            background: rgba(12, 16, 20, 0.6);
            border-top: 1px solid #1a222b;
            overflow-x: auto;
            flex-wrap: nowrap;
            justify-content: space-around;
        }
        .tower-card {
            flex: 1;
            min-width: 56px;
            max-width: 90px;
            background: rgba(18, 24, 32, 0.8);
            border: 1px solid #2a3a48;
            padding: 6px 4px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            border-radius: 6px;
        }
        .tower-card:hover {
            background: #1f2e3d;
            border-color: #3a5a70;
        }
        .tower-card.selected {
            border-color: #ff8c2e;
            box-shadow: 0 0 16px rgba(255, 140, 46, 0.4);
            background: #1f2a33;
        }
        .tower-card:active {
            transform: scale(0.94);
        }
        .tower-icon {
            font-size: 1.8rem;
            line-height: 1.2;
        }
        .tower-name {
            font-size: 0.65rem;
            color: #b0c7d6;
            white-space: nowrap;
        }
        .tower-cost {
            font-size: 0.6rem;
            color: #ffaa44;
        }

        /* ===== 右侧面板：功能卡片 ===== */
        .func-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .func-item {
            background: rgba(18, 24, 32, 0.7);
            border: 1px solid #1f2a33;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        .func-item:hover {
            border-color: #3a6a8a;
            background: rgba(24, 34, 46, 0.8);
            transform: translateX(3px);
        }
        .func-item:active {
            transform: scale(0.97);
        }
        .func-item .icon {
            font-size: 1.4rem;
            flex-shrink: 0;
            width: 30px;
            text-align: center;
        }
        .func-item .info {
            flex: 1;
            min-width: 0;
        }
        .func-item .info .name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #c8dce8;
        }
        .func-item .info .desc {
            font-size: 0.7rem;
            color: #6a8a9e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .func-item .badge {
            background: #00aaff22;
            border: 1px solid #00aaff44;
            border-radius: 12px;
            padding: 0 10px;
            font-size: 0.6rem;
            color: #88ccff;
            line-height: 1.8;
            flex-shrink: 0;
        }

        /* ===== 右下：大按钮 ===== */
        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-top: 4px;
            flex-shrink: 0;
        }
        .mode-btn {
            flex: 1;
            background: linear-gradient(145deg, #1a2633, #0f171f);
            border: 1px solid #2a3a48;
            border-radius: 10px;
            padding: 14px 6px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .mode-btn:hover {
            border-color: #4a8aaa;
            background: #1f2e3d;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 120, 255, 0.15);
        }
        .mode-btn:active {
            transform: scale(0.96);
        }
        .mode-btn .big-icon {
            font-size: 2rem;
            line-height: 1.2;
        }
        .mode-btn .label {
            font-weight: 700;
            font-size: 1rem;
            color: #d0e4f0;
            letter-spacing: 1px;
        }
        .mode-btn .sub {
            font-size: 0.6rem;
            color: #6a8a9e;
        }
        .mode-btn.primary {
            border-color: #0088cc;
            background: linear-gradient(145deg, #0a2a3a, #06141e);
        }
        .mode-btn.primary:hover {
            border-color: #00ccff;
            background: #0f3348;
        }

        /* ===== 模态弹窗（通用） ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            justify-content: center;
            align-items: center;
            z-index: 200;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease;
        }
        .modal.active {
            display: flex;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-content {
            background: #141c26;
            border: 1px solid #2a3a48;
            border-radius: 14px;
            padding: 22px 26px 26px 26px;
            width: 400px;
            max-width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        .modal-content h3 {
            color: #ff8c2e;
            font-size: 1.3rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #1f2a33;
            padding-bottom: 10px;
        }
        .modal-content .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 1.6rem;
            color: #6a8a9e;
            cursor: pointer;
            transition: 0.2s;
            background: none;
            border: none;
            font-family: inherit;
        }
        .modal-content .close-btn:hover {
            color: #ff6a4a;
            transform: rotate(90deg);
        }
        .modal-content p {
            color: #b0c7d6;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .modal-content .item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
        }
        .modal-content .item-row {
            background: #0f171f;
            border: 1px solid #1f2a33;
            border-radius: 6px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.15s;
            cursor: default;
        }
        .modal-content .item-row:hover {
            border-color: #3a5a70;
        }
        .modal-content .item-row .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-content .item-row .left .ico {
            font-size: 1.3rem;
        }
        .modal-content .item-row .right {
            color: #88ccff;
            font-size: 0.8rem;
        }
        .modal-content .action-btn {
            background: #0088cc;
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .modal-content .action-btn:hover {
            background: #00aaff;
            box-shadow: 0 0 20px #0088ff66;
        }
        .modal-content .action-btn.secondary {
            background: #2a3a48;
        }
        .modal-content .action-btn.secondary:hover {
            background: #3a5a70;
        }
        .modal-content .mt-2 {
            margin-top: 12px;
        }

        /* ===== 游戏结束 ===== */
        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.92);
            padding: 36px 44px;
            text-align: center;
            z-index: 60;
            border-radius: 14px;
            border: 1px solid #ff444466;
            box-shadow: 0 0 60px #ff000033;
        }
        .game-over h2 {
            color: #ff4444;
            font-size: 2rem;
            letter-spacing: 4px;
        }
        .game-over p {
            color: #b0c7d6;
            margin: 12px 0 18px;
        }
        .btn-restart {
            background: #00c8ff;
            border: none;
            padding: 10px 32px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            color: #000;
            transition: 0.2s;
        }
        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00c8ff88;
        }

        /* ===== 强化弹窗（覆盖原样式） ===== */
        #upgradeModal .modal-content {
            width: 340px;
        }
        .upgrade-option {
            background: #0f1a22;
            border: 1px solid #1f2a33;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            color: #c8dce8;
            text-align: center;
        }
        .upgrade-option:hover {
            border-color: #00c8ff;
            background: #1a2a36;
            transform: scale(1.02);
        }
        .upgrade-option:active {
            transform: scale(0.97);
        }

        /* ===== 独立模拟迷你游戏样式 ===== */
        .mini-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 3px;
            background: #0b0f13;
            aspect-ratio: 1/1;
            width: 100%;
            max-width: 280px;
            margin: 6px auto;
            border: 1px solid #1a222b;
            border-radius: 4px;
            padding: 3px;
        }
        .mini-cell {
            background: #151d26;
            border: 1px solid #222c38;
            position: relative;
            cursor: pointer;
            border-radius: 2px;
            transition: 0.1s;
        }
        .mini-cell:hover {
            background: #1f2b38;
        }
        .mini-cell .tower {
            font-size: 1.2rem;
        }
        .mini-cell .enemy {
            width: 50%;
            height: 50%;
            top: 25%;
            left: 25%;
            font-size: 0.5rem;
        }
        .mini-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.9rem;
            margin: 6px 0 10px 0;
        }
        .mini-stats span {
            background: #0f171f;
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid #1a222b;
        }
        .mini-tower-bar {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .mini-tower-card {
            background: rgba(18, 24, 32, 0.8);
            border: 1px solid #2a3a48;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
            user-select: none;
            text-align: center;
        }
        .mini-tower-card.selected {
            border-color: #ff8c2e;
            box-shadow: 0 0 10px rgba(255, 140, 46, 0.3);
        }
        .mini-tower-card:hover {
            background: #1f2e3d;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .game-container {
                flex-direction: column;
                max-width: 520px;
            }
            .left-panel {
                flex: none;
                border-right: none;
                border-bottom: 1px solid #1f2833;
            }
            .right-panel {
                flex: none;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 10px 12px;
                gap: 8px;
            }
            .func-list {
                flex-direction: row;
                flex: 1 1 100%;
                gap: 6px;
            }
            .func-item {
                flex: 1;
                padding: 8px 10px;
                min-width: 70px;
            }
            .func-item .info .desc {
                display: none;
            }
            .func-item .badge {
                display: none;
            }
            .mode-buttons {
                flex: 1 1 100%;
                gap: 8px;
            }
            .mode-btn {
                padding: 10px 4px;
            }
            .mode-btn .big-icon {
                font-size: 1.4rem;
            }
            .mode-btn .label {
                font-size: 0.85rem;
            }
            .grid {
                max-width: 100%;
            }
            .header .title {
                font-size: 1.2rem;
            }
            .header .title small {
                display: none;
            }
            .stats {
                gap: 8px;
                font-size: 0.8rem;
            }
            .stat {
                padding: 0 8px 0 4px;
            }
            .tower-card {
                min-width: 44px;
                padding: 4px 2px;
            }
            .tower-icon {
                font-size: 1.3rem;
            }
            .tower-name {
                font-size: 0.55rem;
            }
            .tower-cost {
                font-size: 0.5rem;
            }
            .mini-grid {
                max-width: 200px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 4px;
            }
            .game-container {
                border-radius: 6px;
            }
            .header {
                padding: 6px 10px;
            }
            .grid-wrap {
                padding: 6px 6px 2px 6px;
            }
            .grid {
                gap: 2px;
                padding: 2px;
            }
            .tower {
                font-size: 1.2rem;
            }
            .enemy {
                font-size: 0.5rem;
            }
            .func-item .info .name {
                font-size: 0.8rem;
            }
            .modal-content {
                padding: 16px 18px;
            }
            .mini-grid {
                max-width: 160px;
            }
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0c0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3a48;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a5a70;
        }
    </style>
</head>
<body>

    <div class="game-container">

        <!-- ===== 左侧：游戏 ===== -->
        <div class="left-panel">
            <!-- 头部 -->
            <div class="header">
                <div class="title">卫戍协议 <small>· 星河防线</small></div>
                <div class="stats">
                    <div class="stat"><span class="stat-icon">⚡</span><span id="energyDisplay">100</span></div>
                    <div class="stat"><span class="stat-icon">❤️</span><span id="lifeDisplay">10</span></div>
                    <div class="stat"><span class="stat-icon">🌊</span><span id="waveDisplay">1</span></div>
                </div>
            </div>

            <!-- 网格 -->
            <div class="grid-wrap">
                <div class="grid" id="grid"></div>
            </div>

            <!-- 开始按钮 -->
            <div class="btn-start-wrap">
                <button class="btn-start" id="startBtn">⚔ 开始作战</button>
            </div>

            <!-- 塔选择栏 -->
            <div class="tower-bar" id="towerBar">
                <div class="tower-card" data-type="guard" data-cost="20">
                    <div class="tower-icon">⚓</div>
                    <div class="tower-name">护卫舰</div>
                    <div class="tower-cost">20⚡</div>
                </div>
                <div class="tower-card" data-type="destroyer" data-cost="35">
                    <div class="tower-icon">🚢</div>
                    <div class="tower-name">驱逐舰</div>
                    <div class="tower-cost">35⚡</div>
                </div>
                <div class="tower-card" data-type="cruiser" data-cost="50">
                    <div class="tower-icon">🛳️</div>
                    <div class="tower-name">巡洋舰</div>
                    <div class="tower-cost">50⚡</div>
                </div>
                <div class="tower-card" data-type="battleship" data-cost="80">
                    <div class="tower-icon">🚢✨</div>
                    <div class="tower-name">战列舰</div>
                    <div class="tower-cost">80⚡</div>
                </div>
            </div>
        </div>

        <!-- ===== 右侧：功能面板 ===== -->
        <div class="right-panel">
            <!-- 三个小功能 -->
            <div class="func-list">
                <div class="func-item" id="btnSupply">
                    <span class="icon">📦</span>
                    <div class="info">
                        <div class="name">物资调配处</div>
                        <div class="desc">调整资源分配 · 增益</div>
                    </div>
                    <span class="badge">调配</span>
                </div>
                <div class="func-item" id="btnBlueprint">
                    <span class="icon">📐</span>
                    <div class="info">
                        <div class="name">蓝图数据库</div>
                        <div class="desc">科技研发 · 解锁</div>
                    </div>
                    <span class="badge">研究</span>
                </div>
                <div class="func-item" id="btnInvite">
                    <span class="icon">🤝</span>
                    <div class="info">
                        <div class="name">模拟邀约</div>
                        <div class="desc">外交 · 联合</div>
                    </div>
                    <span class="badge">邀约</span>
                </div>
            </div>

            <!-- 两个大按钮 -->
            <div class="mode-buttons">
                <div class="mode-btn primary" id="btnSolo">
                    <span class="big-icon">🛡️</span>
                    <span class="label">独立模拟</span>
                    <span class="sub">孤军奋战</span>
                </div>
                <div class="mode-btn" id="btnAlliance">
                    <span class="big-icon">⚔️</span>
                    <span class="label">同盟模拟</span>
                    <span class="sub">联合作战</span>
                </div>
            </div>
        </div>

        <!-- ===== 游戏结束 ===== -->
        <div class="game-over" id="gameOver">
            <h2>💀 防线失守</h2>
            <p>你坚持了 <span id="finalWaves">0</span> 波</p>
            <button class="btn-restart" onclick="restartGame()">🔄 重新部署</button>
        </div>
    </div>

    <!-- ===== 通用模态弹窗 ===== -->
    <div class="modal" id="genericModal">
        <div class="modal-content">
            <button class="close-btn" id="modalCloseBtn">✕</button>
            <h3 id="modalTitle">标题</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- ===== 强化选择弹窗 ===== -->
    <div class="modal" id="upgradeModal">
        <div class="modal-content">
            <h3>📡 选择强化协议</h3>
            <div id="upgradeOptions"></div>
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 游戏核心逻辑（主游戏）
        // ============================================================

        const GRID_COLS = 5;
        const GRID_ROWS = 6;
        let grid = Array(GRID_ROWS).fill().map(() => Array(GRID_COLS).fill(null));
        let enemies = [];
        let energy = 100;
        let life = 10;
        let wave = 1;
        let gameActive = false;
        let selectedTower = null;
        let spawnInterval = null;
        let gameLoopInterval = null;
        let energyRegen = 2;
        let globalDamageBonus = 0;
        let globalAttackSpeed = 1;

        const towerStats = {
            guard: { name: '护卫舰', damage: 10, range: 1.5, fireRate: 1.0, cost: 20 },
            destroyer: { name: '驱逐舰', damage: 18, range: 2.5, fireRate: 1.2, cost: 35 },
            cruiser: { name: '巡洋舰', damage: 30, range: 3.0, fireRate: 0.8, cost: 50 },
            battleship: { name: '战列舰', damage: 55, range: 4.0, fireRate: 0.5, cost: 80 }
        };

        function createEnemy(waveNum) {
            let baseHp = 50 + waveNum * 20;
            let speed = 0.6 + waveNum * 0.05;
            let armor = Math.floor(waveNum / 3) * 2;
            return {
                hp: baseHp,
                maxHp: baseHp,
                speed: speed,
                armor: armor,
                row: Math.floor(Math.random() * GRID_ROWS),
                col: -0.5,
                reward: 15 + waveNum * 2
            };
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', () => placeTower(r, c));
                    if (grid[r][c]) {
                        const iconMap = { guard: '⚓', destroyer: '🚢', cruiser: '🛳️', battleship: '🚢✨' };
                        cell.innerHTML = '<div class="tower">' + (iconMap[grid[r][c].type] || '⚙️') + '</div>';
                    }
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderEnemies() {
            document.querySelectorAll('.enemy').forEach(el => el.remove());
            const cells = document.querySelectorAll('.cell');
            enemies.forEach(enemy => {
                const row = Math.floor(enemy.row);
                const col = Math.floor(enemy.col);
                if (row >= 0 && row < GRID_ROWS && col >= 0 && col < GRID_COLS) {
                    const index = row * GRID_COLS + col;
                    if (cells[index]) {
                        const enemyEl = document.createElement('div');
                        enemyEl.className = 'enemy';
                        const pct = Math.max(18, (enemy.hp / enemy.maxHp) * 90);
                        enemyEl.style.width = pct + '%';
                        enemyEl.style.height = pct + '%';
                        enemyEl.innerHTML = Math.ceil(enemy.hp);
                        cells[index].appendChild(enemyEl);
                    }
                }
            });
        }

        function placeTower(row, col) {
            if (!gameActive || !selectedTower) return;
            if (grid[row][col]) return;
            const stats = towerStats[selectedTower];
            if (energy < stats.cost) return;
            energy -= stats.cost;
            grid[row][col] = {
                type: selectedTower,
                lastFireTime: 0,
                damage: stats.damage + globalDamageBonus,
                fireRate: stats.fireRate * globalAttackSpeed,
                range: stats.range
            };
            updateEnergy();
            renderGrid();
        }

        function updateEnergy() {
            document.getElementById('energyDisplay').textContent = Math.floor(energy);
        }

        function updateLife() {
            document.getElementById('lifeDisplay').textContent = life;
        }

        function updateWave() {
            document.getElementById('waveDisplay').textContent = wave;
        }

        function towersAttack(now) {
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const tower = grid[r][c];
                    if (!tower) continue;
                    if (now - tower.lastFireTime < 1000 / tower.fireRate) continue;
                    let target = null;
                    for (let enemy of enemies) {
                        if (enemy.col > GRID_COLS) continue;
                        const dist = Math.sqrt(Math.pow(enemy.row - r, 2) + Math.pow(enemy.col - c, 2));
                        if (dist <= tower.range) {
                            if (!target || enemy.col > target.col) target = enemy;
                        }
                    }
                    if (target) {
                        tower.lastFireTime = now;
                        let dmg = tower.damage - target.armor;
                        if (dmg < 1) dmg = 1;
                        target.hp -= dmg;
                        if (target.hp <= 0) {
                            const idx = enemies.indexOf(target);
                            if (idx > -1) {
                                enemies.splice(idx, 1);
                                energy += target.reward;
                                updateEnergy();
                            }
                        }
                    }
                }
            }
        }

        function moveEnemies() {
            for (let enemy of enemies) {
                enemy.col += enemy.speed * 0.016;
            }
            enemies = enemies.filter(enemy => {
                if (enemy.col >= GRID_COLS) {
                    life--;
                    updateLife();
                    if (life <= 0) gameOver();
                    return false;
                }
                return true;
            });
        }

        function gameLoop() {
            const now = Date.now();
            towersAttack(now);
            moveEnemies();
            renderEnemies();
            energy = Math.min(energy + energyRegen * 0.05, 200);
            updateEnergy();
        }

        function spawnEnemy() {
            if (!gameActive) return;
            const enemy = createEnemy(wave);
            enemies.push(enemy);
        }

        function startWave() {
            document.getElementById('startBtn').style.display = 'none';
            gameActive = true;
            const enemyCount = 3 + wave * 2;
            let spawned = 0;
            spawnInterval = setInterval(() => {
                if (spawned < enemyCount) {
                    spawnEnemy();
                    spawned++;
                } else {
                    clearInterval(spawnInterval);
                    checkWaveEnd();
                }
            }, 800);
        }

        function checkWaveEnd() {
            const checker = setInterval(() => {
                if (!gameActive) { clearInterval(checker); return; }
                if (enemies.length === 0 && !spawnInterval) {
                    clearInterval(checker);
                    gameActive = false;
                    showUpgrade();
                }
            }, 500);
        }

        function showUpgrade() {
            const upgrades = [
                { name: '⚡ 能量回复 +1', effect: () => { energyRegen += 1; } },
                { name: '🔫 全体攻击 +5', effect: () => { globalDamageBonus += 5; } },
                { name: '💨 攻速 +20%', effect: () => { globalAttackSpeed *= 1.2; } },
                { name: '❤️ 生命 +2', effect: () => { life = Math.min(life + 2, 20);
                        updateLife(); } },
                { name: '⚡ 立即 +80 能量', effect: () => { energy = Math.min(energy + 80, 200);
                        updateEnergy(); } },
            ];
            const shuffled = [...upgrades].sort(() => Math.random() - 0.5);
            const options = shuffled.slice(0, 3);
            const container = document.getElementById('upgradeOptions');
            container.innerHTML = options.map((opt, i) =>
                `<div class="upgrade-option" onclick="selectUpgrade(${i})">${opt.name}</div>`
            ).join('');
            document.getElementById('upgradeModal').style.display = 'flex';
            window.tempUpgrades = options;
        }

        window.selectUpgrade = function(index) {
            if (window.tempUpgrades && window.tempUpgrades[index]) {
                window.tempUpgrades[index].effect();
            }
            document.getElementById('upgradeModal').style.display = 'none';
            wave++;
            updateWave();
            document.getElementById('startBtn').style.display = 'block';
        };

        function gameOver() {
            gameActive = false;
            clearInterval(spawnInterval);
            clearInterval(gameLoopInterval);
            document.getElementById('finalWaves').textContent = wave;
            document.getElementById('gameOver').style.display = 'block';
        }

        window.restartGame = function() {
            grid = Array(GRID_ROWS).fill().map(() => Array(GRID_COLS).fill(null));
            enemies = [];
            energy = 100;
            life = 10;
            wave = 1;
            energyRegen = 2;
            globalDamageBonus = 0;
            globalAttackSpeed = 1;
            gameActive = false;
            selectedTower = null;
            clearInterval(spawnInterval);
            clearInterval(gameLoopInterval);
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('startBtn').style.display = 'block';
            updateEnergy();
            updateLife();
            updateWave();
            renderGrid();
            renderEnemies();
        };

        // 塔选择
        document.querySelectorAll('.tower-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.tower-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedTower = card.dataset.type;
            });
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            if (gameActive) return;
            startWave();
            gameLoopInterval = setInterval(gameLoop, 50);
        });

        // ============================================================
        //  2. 新增：右侧面板功能（模态弹窗）
        // ============================================================

        const modal = document.getElementById('genericModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalClose = document.getElementById('modalCloseBtn');

        function openModal(title, html) {
            modalTitle.textContent = title;
            modalBody.innerHTML = html;
            modal.classList.add('active');
        }

        modalClose.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

        // ---- 物资调配处 ----
        document.getElementById('btnSupply').addEventListener('click', () => {
            const alloc = { attack: 0, defense: 0, speed: 0 };
            const renderSupply = () => {
                const html = `
                    <p style="margin-bottom:6px;">当前能量：<strong style="color:#ff8c2e;">${Math.floor(energy)}</strong> ⚡</p>
                    <p style="font-size:0.85rem;color:#6a8a9e;margin-bottom:12px;">调配资源获得临时增益（持续本波）</p>
                    <div class="item-list">
                        <div class="item-row">
                            <span class="left"><span class="ico">⚔️</span> 攻击强化</span>
                            <span><button class="action-btn" onclick="allocSupply('attack',10)">+10 ⚡</button></span>
                        </div>
                        <div class="item-row">
                            <span class="left"><span class="ico">🛡️</span> 防御强化</span>
                            <span><button class="action-btn" onclick="allocSupply('defense',10)">+10 ⚡</button></span>
                        </div>
                        <div class="item-row">
                            <span class="left"><span class="ico">💨</span> 移速强化</span>
                            <span><button class="action-btn" onclick="allocSupply('speed',10)">+10 ⚡</button></span>
                        </div>
                    </div>
                    <div style="font-size:0.75rem;color:#4a6a7e;margin-top:8px;border-top:1px solid #1a222b;padding-top:10px;">
                        ⚡ 当前调配：攻击 +${alloc.attack} ｜ 防御 +${alloc.defense} ｜ 速度 +${alloc.speed}
                    </div>
                `;
                openModal('📦 物资调配处', html);
                window._allocData = alloc;
            };
            window.allocSupply = function(type, cost) {
                if (energy < cost) { alert('⚡ 能量不足！'); return; }
                energy -= cost;
                updateEnergy();
                const data = window._allocData || { attack: 0, defense: 0, speed: 0 };
                data[type] += 1;
                window._allocData = data;
                if (type === 'attack') globalDamageBonus += 2;
                else if (type === 'defense') { life = Math.min(life + 1, 20);
                    updateLife(); } else if (type === 'speed') globalAttackSpeed *= 1.05;
                renderSupply();
            };
            renderSupply();
        });

        // ---- 蓝图数据库 ----
        document.getElementById('btnBlueprint').addEventListener('click', () => {
            const blueprints = [
                { name: '⚓ 护卫舰 Mk.II', desc: '攻击 +4, 射速 +10%', unlocked: true },
                { name: '🚢 驱逐舰 Mk.II', desc: '射程 +0.5, 攻击 +6', unlocked: true },
                { name: '🛳️ 巡洋舰 Mk.II', desc: '攻击 +10, 造价 -10', unlocked: false },
                { name: '🚢✨ 战列舰 Mk.II', desc: '攻击 +15, 射速 +15%', unlocked: false },
                { name: '🔬 能量核心', desc: '能量回复 +2', unlocked: false },
            ];
            let html =
                `<p style="font-size:0.85rem;color:#6a8a9e;">已解锁蓝图可研发升级</p><div class="item-list">`;
            blueprints.forEach((bp, i) => {
                const status = bp.unlocked ?
                    '<span style="color:#44cc88;">● 已解锁</span>' :
                    '<span style="color:#ff8844;">🔒 未解锁</span>';
                const btn = bp.unlocked ?
                    `<button class="action-btn" onclick="researchBlueprint(${i})">研究</button>` :
                    `<button class="action-btn secondary" disabled>🔒</button>`;
                html += `
                    <div class="item-row">
                        <span class="left"><span class="ico">${bp.name.split(' ')[0]}</span> ${bp.name}</span>
                        <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            <span style="font-size:0.7rem;color:#6a8a9e;">${bp.desc}</span>
                            ${btn}
                        </span>
                    </div>
                `;
            });
            html +=
                `</div><div style="font-size:0.7rem;color:#4a6a7e;margin-top:6px;">💡 研究消耗 30⚡，可提升塔性能</div>`;
            openModal('📐 蓝图数据库', html);

            window.researchBlueprint = function(idx) {
                if (energy < 30) { alert('⚡ 需要 30 能量'); return; }
                energy -= 30;
                updateEnergy();
                const effects = [
                    () => { globalDamageBonus += 4;
                        alert('✅ 护卫舰 Mk.II 研发完成！全体攻击 +4'); },
                    () => { globalDamageBonus += 6;
                        alert('✅ 驱逐舰 Mk.II 研发完成！全体攻击 +6'); },
                    () => { alert('🔬 巡洋舰 Mk.II 需要先解锁前置科技'); },
                    () => { alert('🔬 战列舰 Mk.II 需要先解锁前置科技'); },
                    () => { energyRegen += 2;
                        alert('✅ 能量核心研发完成！能量回复 +2'); },
                ];
                if (effects[idx]) effects[idx]();
                document.getElementById('btnBlueprint').click();
            };
        });

        // ---- 模拟邀约 ----
        document.getElementById('btnInvite').addEventListener('click', () => {
            const factions = [
                { name: '⚔️ 铁血同盟', desc: '军事支援 · 攻击 +8', available: true },
                { name: '🛸 星云联邦', desc: '科技支援 · 能量 +50', available: true },
                { name: '🌌 暗影议会', desc: '情报支援 · 攻速 +15%', available: false },
                { name: '🔱 深海帝国', desc: '后勤支援 · 生命 +3', available: true },
            ];
            let html = `<p style="font-size:0.85rem;color:#6a8a9e;">向星系势力发出邀约，获得支援</p><div class="item-list">`;
            factions.forEach((f, i) => {
                const status = f.available ?
                    `<button class="action-btn" onclick="inviteFaction(${i})">邀约</button>` :
                    `<span style="color:#6a4a4a;">⏳ 冷却中</span>`;
                html += `
                    <div class="item-row">
                        <span class="left"><span class="ico">${f.name.split(' ')[0]}</span> ${f.name}</span>
                        <span style="display:flex;align-items:center;gap:8px;">
                            <span style="font-size:0.7rem;color:#6a8a9e;">${f.desc}</span>
                            ${status}
                        </span>
                    </div>
                `;
            });
            html += `</div><div style="font-size:0.7rem;color:#4a6a7e;margin-top:6px;">🤝 邀约成功可立即获得增益</div>`;
            openModal('🤝 模拟邀约', html);

            window.inviteFaction = function(idx) {
                const rewards = [
                    () => { globalDamageBonus += 8;
                        alert('⚔️ 铁血同盟响应！攻击 +8'); },
                    () => { energy = Math.min(energy + 50, 200);
                        updateEnergy();
                        alert('🛸 星云联邦支援！能量 +50'); },
                    () => { alert('🌌 暗影议会暂未回应...'); },
                    () => { life = Math.min(life + 3, 20);
                        updateLife();
                        alert('🔱 深海帝国支援！生命 +3'); },
                ];
                if (rewards[idx]) rewards[idx];
                document.getElementById('btnInvite').click();
            };
        });

        // ============================================================
        //  3. 独立模拟 — 内置迷你塔防游戏
        // ============================================================

        document.getElementById('btnSolo').addEventListener('click', () => {
            // 构建迷你游戏HTML
            const miniHtml = `
                <div style="text-align:center; margin-bottom:4px;">
                    <span style="color:#88ccff;">⚡ 独立模拟 · 孤军奋战</span>
                </div>
                <div class="mini-stats">
                    <span>⚡ <span id="miniEnergy">60</span></span>
                    <span>❤️ <span id="miniLife">5</span></span>
                    <span>🌊 <span id="miniWave">1</span></span>
                </div>
                <div class="mini-grid" id="miniGrid"></div>
                <div class="mini-tower-bar" id="miniTowerBar">
                    <div class="mini-tower-card" data-type="guard" data-cost="15">⚓ 护卫 15⚡</div>
                    <div class="mini-tower-card" data-type="destroyer" data-cost="25">🚢 驱逐 25⚡</div>
                    <div class="mini-tower-card" data-type="cruiser" data-cost="35">🛳️ 巡洋 35⚡</div>
                </div>
                <div style="display:flex; justify-content:center; gap:12px; margin-top:6px;">
                    <button class="action-btn" id="miniStartBtn">⚔ 开始波次</button>
                    <button class="action-btn secondary" onclick="document.getElementById('genericModal').classList.remove('active')">关闭</button>
                </div>
                <div id="miniGameOver" style="display:none; margin-top:8px; padding:10px; background:#1a0a0a; border:1px solid #ff444466; border-radius:6px; text-align:center; color:#ff6a4a;">
                    💀 防线失守！坚持了 <span id="miniFinalWave">0</span> 波
                    <br><button class="action-btn" style="margin-top:6px;" onclick="miniRestart()">🔄 重来</button>
                </div>
            `;
            openModal('🛡️ 独立模拟', miniHtml);

            // ---- 迷你游戏逻辑 ----
            const MINI_COLS = 4;
            const MINI_ROWS = 4;
            let miniGrid = Array(MINI_ROWS).fill().map(() => Array(MINI_COLS).fill(null));
            let miniEnemies = [];
            let miniEnergy = 60;
            let miniLife = 5;
            let miniWave = 1;
            let miniGameActive = false;
            let miniSelected = null;
            let miniSpawnInterval = null;
            let miniLoopInterval = null;
            let miniEnemyCount = 0;
            let miniSpawned = 0;
            let miniWaveActive = false;

            const miniTowerStats = {
                guard: { damage: 8, range: 1.2, fireRate: 0.9, cost: 15 },
                destroyer: { damage: 14, range: 2.0, fireRate: 1.0, cost: 25 },
                cruiser: { damage: 22, range: 2.8, fireRate: 0.7, cost: 35 }
            };

            function miniCreateEnemy(w) {
                let baseHp = 30 + w * 15;
                return {
                    hp: baseHp,
                    maxHp: baseHp,
                    speed: 0.5 + w * 0.04,
                    armor: Math.floor(w / 2),
                    row: Math.floor(Math.random() * MINI_ROWS),
                    col: -0.5,
                    reward: 10 + w * 2
                };
            }

            function miniRenderGrid() {
                const gridEl = document.getElementById('miniGrid');
                if (!gridEl) return;
                gridEl.innerHTML = '';
                for (let r = 0; r < MINI_ROWS; r++) {
                    for (let c = 0; c < MINI_COLS; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'mini-cell';
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.addEventListener('click', () => miniPlaceTower(r, c));
                        if (miniGrid[r][c]) {
                            const iconMap = { guard: '⚓', destroyer: '🚢', cruiser: '🛳️' };
                            cell.innerHTML = '<div class="tower">' + (iconMap[miniGrid[r][c].type] || '⚙️') +
                            '</div>';
                        }
                        gridEl.appendChild(cell);
                    }
                }
                // 渲染敌人
                document.querySelectorAll('#miniGrid .enemy').forEach(el => el.remove());
                const cells = document.querySelectorAll('#miniGrid .mini-cell');
                miniEnemies.forEach(enemy => {
                    const row = Math.floor(enemy.row);
                    const col = Math.floor(enemy.col);
                    if (row >= 0 && row < MINI_ROWS && col >= 0 && col < MINI_COLS) {
                        const idx = row * MINI_COLS + col;
                        if (cells[idx]) {
                            const enemyEl = document.createElement('div');
                            enemyEl.className = 'enemy';
                            const pct = Math.max(18, (enemy.hp / enemy.maxHp) * 90);
                            enemyEl.style.width = pct + '%';
                            enemyEl.style.height = pct + '%';
                            enemyEl.innerHTML = Math.ceil(enemy.hp);
                            cells[idx].appendChild(enemyEl);
                        }
                    }
                });
            }

            function miniPlaceTower(row, col) {
                if (!miniGameActive || !miniSelected) return;
                if (miniGrid[row][col]) return;
                const stats = miniTowerStats[miniSelected];
                if (miniEnergy < stats.cost) return;
                miniEnergy -= stats.cost;
                miniGrid[row][col] = {
                    type: miniSelected,
                    lastFireTime: 0,
                    damage: stats.damage,
                    fireRate: stats.fireRate,
                    range: stats.range
                };
                miniUpdateUI();
                miniRenderGrid();
            }

            function miniUpdateUI() {
                const e = document.getElementById('miniEnergy');
                const l = document.getElementById('miniLife');
                const w = document.getElementById('miniWave');
                if (e) e.textContent = Math.floor(miniEnergy);
                if (l) l.textContent = miniLife;
                if (w) w.textContent = miniWave;
            }

            function miniTowersAttack(now) {
                for (let r = 0; r < MINI_ROWS; r++) {
                    for (let c = 0; c < MINI_COLS; c++) {
                        const tower = miniGrid[r][c];
                        if (!tower) continue;
                        if (now - tower.lastFireTime < 1000 / tower.fireRate) continue;
                        let target = null;
                        for (let enemy of miniEnemies) {
                            if (enemy.col > MINI_COLS) continue;
                            const dist = Math.sqrt(Math.pow(enemy.row - r, 2) + Math.pow(enemy.col - c, 2));
                            if (dist <= tower.range) {
                                if (!target || enemy.col > target.col) target = enemy;
                            }
                        }
                        if (target) {
                            tower.lastFireTime = now;
                            let dmg = tower.damage - target.armor;
                            if (dmg < 1) dmg = 1;
                            target.hp -= dmg;
                            if (target.hp <= 0) {
                                const idx = miniEnemies.indexOf(target);
                                if (idx > -1) {
                                    miniEnemies.splice(idx, 1);
                                    miniEnergy += target.reward;
                                    miniUpdateUI();
                                }
                            }
                        }
                    }
                }
            }

            function miniMoveEnemies() {
                for (let enemy of miniEnemies) {
                    enemy.col += enemy.speed * 0.016;
                }
                miniEnemies = miniEnemies.filter(enemy => {
                    if (enemy.col >= MINI_COLS) {
                        miniLife--;
                        miniUpdateUI();
                        if (miniLife <= 0) {
                            miniGameOver();
                            return false;
                        }
                        return false;
                    }
                    return true;
                });
            }

            function miniGameLoop() {
                if (!miniGameActive) return;
                const now = Date.now();
                miniTowersAttack(now);
                miniMoveEnemies();
                miniRenderGrid();
                // 能量回复
                miniEnergy = Math.min(miniEnergy + 0.5, 120);
                miniUpdateUI();
            }

            function miniSpawnEnemy() {
                if (!miniGameActive) return;
                if (miniSpawned < miniEnemyCount) {
                    const enemy = miniCreateEnemy(miniWave);
                    miniEnemies.push(enemy);
                    miniSpawned++;
                } else {
                    clearInterval(miniSpawnInterval);
                    miniSpawnInterval = null;
                    // 等待清空
                    miniCheckWaveEnd();
                }
            }

            function miniCheckWaveEnd() {
                const checker = setInterval(() => {
                    if (!miniGameActive) { clearInterval(checker); return; }
                    if (miniEnemies.length === 0 && !miniSpawnInterval) {
                        clearInterval(checker);
                        miniWaveActive = false;
                        miniWave++;
                        miniUpdateUI();
                        // 奖励
                        miniEnergy = Math.min(miniEnergy + 20, 120);
                        miniUpdateUI();
                        document.getElementById('miniStartBtn').disabled = false;
                        document.getElementById('miniStartBtn').textContent = '⚔ 下一波';
                        // 检查是否游戏结束
                        if (miniLife <= 0) miniGameOver();
                    }
                }, 300);
            }

            function miniStartWave() {
                if (miniWaveActive) return;
                if (miniLife <= 0) { miniGameOver(); return; }
                miniGameActive = true;
                miniWaveActive = true;
                miniEnemyCount = 2 + miniWave * 2;
                miniSpawned = 0;
                document.getElementById('miniStartBtn').disabled = true;
                document.getElementById('miniStartBtn').textContent = '⚔ 战斗中...';
                if (miniSpawnInterval) clearInterval(miniSpawnInterval);
                miniSpawnInterval = setInterval(miniSpawnEnemy, 700);
            }

            function miniGameOver() {
                miniGameActive = false;
                miniWaveActive = false;
                if (miniSpawnInterval) clearInterval(miniSpawnInterval);
                if (miniLoopInterval) clearInterval(miniLoopInterval);
                document.getElementById('miniStartBtn').disabled = true;
                document.getElementById('miniStartBtn').textContent = '💀 失守';
                document.getElementById('miniGameOver').style.display = 'block';
                document.getElementById('miniFinalWave').textContent = miniWave;
            }

            window.miniRestart = function() {
                miniGrid = Array(MINI_ROWS).fill().map(() => Array(MINI_COLS).fill(null));
                miniEnemies = [];
                miniEnergy = 60;
                miniLife = 5;
                miniWave = 1;
                miniGameActive = false;
                miniSelected = null;
                miniWaveActive = false;
                miniEnemyCount = 0;
                miniSpawned = 0;
                if (miniSpawnInterval) clearInterval(miniSpawnInterval);
                if (miniLoopInterval) clearInterval(miniLoopInterval);
                document.getElementById('miniGameOver').style.display = 'none';
                document.getElementById('miniStartBtn').disabled = false;
                document.getElementById('miniStartBtn').textContent = '⚔ 开始波次';
                miniUpdateUI();
                miniRenderGrid();
            };

            // 绑定迷你塔选择
            document.querySelectorAll('#miniTowerBar .mini-tower-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('#miniTowerBar .mini-tower-card').forEach(c => c.classList.remove(
                        'selected'));
                    card.classList.add('selected');
                    miniSelected = card.dataset.type;
                });
            });

            // 开始按钮
            const miniStartBtn = document.getElementById('miniStartBtn');
            if (miniStartBtn) {
                miniStartBtn.addEventListener('click', miniStartWave);
            }

            // 启动循环
            miniLoopInterval = setInterval(miniGameLoop, 50);
            // 初始渲染
            miniRenderGrid();
            miniUpdateUI();
            // 关闭弹窗时清理循环
            const origClose = modalClose.click;
            modalClose.addEventListener('click', () => {
                if (miniLoopInterval) clearInterval(miniLoopInterval);
                if (miniSpawnInterval) clearInterval(miniSpawnInterval);
            });
            // 点击外部关闭也清理
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    if (miniLoopInterval) clearInterval(miniLoopInterval);
                    if (miniSpawnInterval) clearInterval(miniSpawnInterval);
                }
            });
        });

        // ---- 同盟模拟（保留原信息展示） ----
        document.getElementById('btnAlliance').addEventListener('click', () => {
            const allies = [
                { name: '⚔️ 铁血同盟', status: '已结盟', bonus: '攻击 +6' },
                { name: '🛸 星云联邦', status: '已结盟', bonus: '能量 +30' },
                { name: '🌌 暗影议会', status: '待邀请', bonus: '攻速 +10%' },
            ];
            let html = `
                <p style="font-size:0.9rem;color:#b0c7d6;">⚔️ <strong>同盟模拟</strong> — 联合作战</p>
                <div style="background:#0f171f;border-radius:8px;padding:12px;margin:10px 0;border:1px solid #1a222b;">
                    <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:#4a6a7e;padding-bottom:6px;border-bottom:1px solid #1a222b;">
                        <span>同盟势力</span><span>状态</span><span>增益</span>
                    </div>
            `;
            allies.forEach(a => {
                const statusColor = a.status === '已结盟' ? '#44cc88' : '#ff8844';
                html += `
                    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #0d141c;font-size:0.85rem;">
                        <span>${a.name}</span>
                        <span style="color:${statusColor};">${a.status}</span>
                        <span style="color:#88ccff;">${a.bonus}</span>
                    </div>
                `;
            });
            html += `
                </div>
                <p style="font-size:0.8rem;color:#4a6a7e;">🤝 同盟状态下，共享部分增益效果。</p>
                <div style="display:flex;gap:8px;margin-top:10px;">
                    <button class="action-btn" style="flex:1;padding:8px;" onclick="alert('🌌 向暗影议会发出同盟邀请...')">邀请暗影议会</button>
                    <button class="action-btn secondary" style="flex:1;padding:8px;" onclick="document.getElementById('genericModal').classList.remove('active')">关闭</button>
                </div>
            `;
            openModal('⚔️ 同盟模拟', html);
        });

        // ============================================================
        //  4. 初始化
        // ============================================================

        renderGrid();
        updateEnergy();
        updateLife();
        updateWave();

        // 点击空白处取消塔选择
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.tower-card') && !e.target.closest('.grid')) {
                document.querySelectorAll('.tower-card').forEach(c => c.classList.remove('selected'));
                selectedTower = null;
            }
        });

        console.log('🚀 卫戍协议 · 星河防线 已加载');
        console.log('📦 右侧面板：物资调配 · 蓝图 · 邀约 ｜ 独立模拟（内置塔防小游戏）· 同盟模拟');
    </script>
</body>
</html>
