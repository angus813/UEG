<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号设置 - UEG小网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; color: #e0e8f0;
      font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%; max-width: 520px;
      background: rgba(19,23,28,0.66); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid #2a3340; box-shadow: 0 0 30px rgba(0,160,255,0.1);
      padding: 30px 26px; position: relative; overflow: hidden;
    }
    .card::before { content:''; position:absolute; top:0; left:0; width:50px; height:50px; border-top:2px solid #00c8ff; border-left:2px solid #00c8ff; }
    .card::after { content:''; position:absolute; bottom:0; right:0; width:50px; height:50px; border-bottom:2px solid #00c8ff; border-right:2px solid #00c8ff; }
    h2 { color: #fff; letter-spacing: 3px; font-size: 1.3rem; margin-bottom: 18px; text-shadow: 0 0 12px #00a3ff; }
    label { display: block; color: #7a8b9a; font-size: 0.85rem; margin: 14px 0 5px; }
    input, textarea {
      width: 100%; background: #1a1e24; border: 1px solid #3a5060;
      color: #fff; padding: 10px; font-family: inherit; font-size: 0.9rem;
    }
    textarea { height: 70px; resize: vertical; font-family: monospace; font-size: 0.75rem; }
    .row { display: flex; gap: 10px; margin-top: 18px; }
    .btn {
      flex: 1; padding: 11px; border: none; cursor: pointer; font-weight: 700;
      font-family: inherit; letter-spacing: 1px; transition: 0.2s; font-size: 0.9rem;
    }
    .btn.primary { background: #00c8ff; color: #000; }
    .btn.primary:hover { background: #00a3ff; box-shadow: 0 0 12px rgba(0,200,255,0.4); }
    .btn.ghost { background: transparent; border: 1px solid #3a5060; color: #b0c7d6; }
    .btn.ghost:hover { border-color: #00c8ff; color: #fff; }
    .btn.danger { background: transparent; border: 1px solid #5a3a2a; color: #ff8844; }
    .btn.danger:hover { border-color: #ff8844; }
    .check { display: flex; align-items: center; gap: 6px; margin-top: 12px; color: #8aacbe; font-size: 0.8rem; }
    .check input { width: auto; }
    .status {
      margin-top: 16px; padding: 10px 12px; min-height: 38px;
      background: rgba(0,200,255,0.04); border: 1px solid #1f2a33;
      color: #ffaa44; font-size: 0.82rem; white-space: pre-wrap; line-height: 1.6;
    }
    .status.ok { color: #44cc88; }
    .status.err { color: #ff6a6a; }
    .info { margin-top: 14px; font-size: 0.75rem; color: #5e7a8c; line-height: 1.9; word-break: break-all; }
    .link-back { display: inline-block; margin-top: 14px; color: #00c8ff; text-decoration: none; font-size: 0.85rem; border: 1px solid #00c8ff; padding: 6px 14px; }
    .link-back:hover { background: rgba(0,200,255,0.1); }
    .hint { color: #7a8b9a; font-size: 0.78rem; margin-top: 6px; }
  </style>
<script src="public/dyson-bg.js"></script>
</head>
<body>
  <div class="card">
    <h2>🔑 账号设置</h2>

    <label>用户名</label>
    <input type="text" id="userInput" placeholder="2-20 位中文/字母/数字/下划线">
    <label>密码</label>
    <input type="password" id="pwInput" placeholder="至少 6 位">
    <div class="hint">密码以 bcrypt 哈希存储在后端，不再明文保存；GitHub Token 由后端统一保管。</div>

    <div class="row">
      <button class="btn primary" onclick="doLogin()">登录</button>
      <button class="btn ghost" onclick="doRegister()">注册</button>
    </div>
    <div class="row">
      <button class="btn ghost" onclick="doTest()">连接测试</button>
      <button class="btn danger" onclick="doLogout()">退出登录</button>
    </div>

    <div class="status" id="status">就绪</div>

    <div class="info" id="cfgInfo"></div>

    <a class="link-back" href="index.html">← 返回主页</a>
  </div>

  <script src="config.js"></script>
  <script src="github-db.js"></script>
  <script>
    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status' + (cls ? ' ' + cls : '');
    }

    function getCurrentUser() {
      const cu = localStorage.getItem('ueg_current_user');
      return cu ? JSON.parse(cu) : null;
    }
    function setCurrentUser(user) {
      if (user) localStorage.setItem('ueg_current_user', JSON.stringify(user));
      else localStorage.removeItem('ueg_current_user');
    }

    async function doLogin() {
      const username = document.getElementById('userInput').value.trim();
      const password = document.getElementById('pwInput').value;
      if (!username || !password) { setStatus('❌ 请输入用户名和密码', 'err'); return; }
      setStatus('⏳ 登录中...');
      const r = await DB.login(username, password);
      if (r.code === 200) {
        setCurrentUser(r.data);
        setStatus('✅ 登录成功：' + r.data.username + (r.data.is_admin ? '（管理员）' : ''), 'ok');
        document.getElementById('pwInput').value = '';
      } else {
        setStatus('❌ ' + r.msg, 'err');
      }
    }

    async function doRegister() {
      const username = document.getElementById('userInput').value.trim();
      const password = document.getElementById('pwInput').value;
      if (!username || !password) { setStatus('❌ 请输入用户名和密码', 'err'); return; }
      setStatus('⏳ 注册中...');
      const r = await DB.register(username, password);
      if (r.code === 200) {
        setStatus('✅ 注册成功，请使用新账号登录', 'ok');
        document.getElementById('pwInput').value = '';
      } else {
        setStatus('❌ ' + r.msg, 'err');
      }
    }

    async function doTest() {
      setStatus('⏳ 正在测试连接...');
      const r = await DB.testConnection();
      if (r.ok) setStatus('✅ ' + (r.note || '连接正常'), 'ok');
      else setStatus('❌ ' + (r.error || '连接失败'), 'err');
    }

    function doLogout() {
      DB.logout();
      setCurrentUser(null);
      setStatus('🔒 已退出登录（会话已清除）', 'ok');
    }

    // 初始化：显示配置与登录状态
    (function init() {
      const apiCfg = window.UEG_CONFIG && window.UEG_CONFIG.api;
      const info = document.getElementById('cfgInfo');
      info.innerHTML =
        '后端地址：' + (apiCfg ? apiCfg.url : '未配置') + '<br>' +
        'PUBLISHABLE_KEY：' + (apiCfg ? apiCfg.publishableKey : '') + '<br>' +
        'JWKS_URL：' + (apiCfg ? apiCfg.jwksUrl : '') + '<br>' +
        'SECRET_KEY / GITHUB_TOKEN：仅存在于后端 .env';

      const u = getCurrentUser();
      if (u) setStatus('✅ 当前已登录：' + u.username + (u.is_admin ? '（管理员）' : ''), 'ok');
      else if (DB.hasToken()) setStatus('ℹ️ 存在会话，但本地用户信息缺失（可重新登录）', '');
      else setStatus('ℹ️ 尚未登录', '');
    })();
  </script>
</body>
</html>
