<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据导入工具 - UEG小网站</title>
  <link rel="stylesheet" href="public/rhine.css"> <!-- 莱茵生命（Rhine Lab）设计系统 -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #ffffff; color: #3c3a37;
      font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      padding: 30px;
    }
    /* 隐藏动态宇宙背景画布，保持莱茵纯白暖灰背景 */
    #dyson-bg, canvas.dyson, .dyson-bg { display: none !important; }
    .card {
      max-width: 720px; margin: 0 auto;
      background: #ffffff; border: 1px solid #e5e1dc; border-top: 3px solid #ffd700;
      padding: 30px; position: relative; border-radius: 2px; box-shadow: none;
    }
    h2 {
      display: inline-block; color: #1a1a1a; letter-spacing: 0.06em; margin-bottom: 8px;
      font-weight: 800; text-transform: uppercase; padding-bottom: 5px; border-bottom: 3px solid #ffd700;
      font-family: 'Novecento Wide', 'Oswald', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    }
    .sub { color: #8a857e; font-size: 0.85rem; margin-bottom: 20px; line-height: 1.7; }
    .lock-box {
      background: #faf8f6; border: 1px solid #e5e1dc; border-left: 3px solid #ffd700; padding: 14px 16px; margin-bottom: 20px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .lock-box .state { color: #3c3a37; font-size: 0.85rem; }
    .lock-box input { background: #ffffff; border: 1px solid #c9c4bc; color: #1a1a1a; padding: 8px; width: 200px; border-radius: 0; }
    .lock-box input:focus { border-color: #ffd700; outline: none; }
    .btn { background: #ffffff; border: 1px solid #1a1a1a; color: #1a1a1a; padding: 8px 16px; cursor: pointer; font-weight: 700; font-family: inherit; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 0; }
    .btn:hover { background: #ffd700; border-color: #ffd700; color: #000000; }
    .btn.ghost { background: #ffffff; border: 1px solid #c9c4bc; color: #3c3a37; }
    .btn.ghost:hover { border-color: #ffd700; background: #ffd700; color: #000000; }
    h3 {
      color: #1a1a1a; margin-top: 20px; margin-bottom: 8px; font-size: 0.95rem; letter-spacing: 0.06em;
      text-transform: uppercase; font-weight: 800;
      font-family: 'Novecento Wide', 'Oswald', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    }
    textarea { width: 100%; height: 120px; background: #ffffff; color: #1a1a1a; border: 1px solid #c9c4bc; padding: 10px; font-family: monospace; font-size: 0.75rem; margin-bottom: 8px; border-radius: 0; }
    textarea:focus { border-color: #ffd700; outline: none; }
    .status { margin-top: 16px; padding: 10px; border: 1px solid #e5e1dc; border-left: 3px solid #ffd700; background: #faf8f6; color: #1a1a1a; white-space: pre-wrap; }
    .link-back { display: inline-block; margin-top: 16px; color: #1a1a1a; text-decoration: none; border: 1px solid #1a1a1a; padding: 6px 14px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 0; }
    .link-back:hover { background: #ffd700; border-color: #ffd700; color: #000000; }
  </style>
<script src="public/dyson-bg.js"></script>
</head>
<body>
  <div class="card">
    <h2><span class="rhine-mark"><span class="pm">±</span><span class="inf">∞</span></span>📥 数据导入工具</h2>
    <div class="sub">将备份数据导入主数据源（默认 Supabase 云端）。GitHub 数据仓库 ueg-data 的同步由后端脚本独立执行 —— GitHub Token 由后端保管，前端无需也不可持有</div>

    <div class="lock-box">
      <span class="state" id="lockState">检测中...</span>
      <input type="text" id="userInput" placeholder="管理员用户名" style="width:140px">
      <input type="password" id="pwInput" placeholder="密码">
      <button class="btn" onclick="doLogin()">登录</button>
      <button class="btn ghost" onclick="doLogout()">退出</button>
    </div>

    <h3>📄 ships_data.js（舰船数据）</h3>
    <textarea id="shipsInput" placeholder="粘贴 ships_data.js 内容（window.SHIPS_DATA = {...}）"></textarea>
    <button class="btn" onclick="importShips()">导入舰船数据</button>

    <h3>👥 users.json</h3>
    <textarea id="usersInput" placeholder='粘贴 users.json 内容'></textarea>
    <button class="btn" onclick="importUsers()">导入用户数据</button>

    <h3>🗺️ guild_maps.json</h3>
    <textarea id="mapsInput" placeholder='粘贴 guild_maps.json 内容'></textarea>
    <button class="btn" onclick="importMaps()">导入地图数据</button>

    <div class="status" id="status">就绪</div>
    <a class="link-back" href="index.html">← 返回主页</a>
  </div>

  <script src="config.js"></script>
  <script src="github-db.js"></script>
  <script>
    function setStatus(msg) { document.getElementById('status').textContent = msg; }
    function getCurrentUser() {
      try {
        const cu = localStorage.getItem('ueg_current_user');
        return cu ? JSON.parse(cu) : null;
      } catch (e) {
        localStorage.removeItem('ueg_current_user');
        return null;
      }
    }
    function setCurrentUser(user) {
      if (user) localStorage.setItem('ueg_current_user', JSON.stringify(user));
      else localStorage.removeItem('ueg_current_user');
    }
    function refreshState() {
      const el = document.getElementById('lockState');
      const u = getCurrentUser();
      if (u) el.textContent = '✅ 已登录：' + u.username + (u.is_admin ? '（管理员）' : '（⚠️ 导入需要管理员）');
      else el.textContent = '🔒 未登录（导入需管理员账号）';
    }
    async function doLogin() {
      const username = document.getElementById('userInput').value.trim();
      const pw = document.getElementById('pwInput').value;
      if (!username || !pw) { setStatus('❌ 请输入用户名和密码'); return; }
      setStatus('⏳ 登录中...');
      const r = await DB.login(username, pw);
      if (r.code === 200) {
        setCurrentUser(r.data);
        setStatus('✅ 登录成功' + (r.data.is_admin ? '（管理员）' : '，但导入需要管理员权限'));
        refreshState();
      } else {
        setStatus('❌ ' + r.msg);
      }
    }
    function doLogout() {
      DB.logout();
      setCurrentUser(null);
      setStatus('🔒 已退出');
      refreshState();
    }
    async function importShips() {
      const c = document.getElementById('shipsInput').value.trim();
      if (!c) { setStatus('❌ 请先粘贴内容'); return; }
      setStatus('⏳ 导入中...');
      const r = await DB.importShipsFromJs(c);
      setStatus(r.ok ? '✅ 成功（' + r.count + ' 艘）' : '❌ ' + r.msg);
    }
    async function importUsers() {
      const c = document.getElementById('usersInput').value.trim();
      if (!c) { setStatus('❌ 请先粘贴内容'); return; }
      setStatus('⏳ 导入中...');
      const r = await DB.importUsersJson(c);
      setStatus(r.ok ? '✅ 成功（' + r.count + ' 人）' : '❌ ' + r.msg);
    }
    async function importMaps() {
      const c = document.getElementById('mapsInput').value.trim();
      if (!c) { setStatus('❌ 请先粘贴内容'); return; }
      setStatus('⏳ 导入中...');
      const r = await DB.importMapsJson(c);
      setStatus(r.ok ? '✅ 成功（' + r.count + ' 张）' : '❌ ' + r.msg);
    }
    refreshState();
  </script>
</body>
</html>
