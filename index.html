<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UEG小网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c0f;
      color: #e0e8f0;
      font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 1100px; max-width: 95%;
      background: linear-gradient(135deg, #13171c 0%, #0d1014 100%);
      border: 1px solid #2a3340;
      box-shadow: 0 0 30px rgba(0,160,255,0.1);
      position: relative;
      overflow: hidden;
      min-height: 600px;
      margin: 20px auto;
    }
    .container::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 60px; height: 60px;
      border-top: 2px solid #00c8ff; border-left: 2px solid #00c8ff;
    }
    .container::after {
      content: ''; position: absolute; bottom: 0; right: 0;
      width: 60px; height: 60px;
      border-bottom: 2px solid #00c8ff; border-right: 2px solid #00c8ff;
    }
    /* 用户状态栏 */
    .user-bar {
      display: flex; justify-content: flex-end; align-items: center;
      padding: 10px 30px; border-bottom: 1px solid #2a3340;
      background: rgba(20,25,30,0.8);
    }
    .user-info { margin-right: 15px; color: #b0c7d6; }
    .user-info strong { color: #00c8ff; }
    .btn-user {
      background: transparent; border: 1px solid #3a5060;
      color: #b0c7d6; padding: 5px 15px;
      font-family: inherit; font-size: 0.9rem; letter-spacing: 1px;
      cursor: pointer; transition: all 0.2s; margin-left: 10px;
    }
    .btn-user:hover { border-color: #00c8ff; color: #fff; }
    /* 管理员面板 */
    .admin-panel {
      padding: 15px 30px;
      border-bottom: 1px solid #2a3340;
      background: rgba(10,14,19,0.8);
      display: none;
    }
    .admin-panel h3 {
      color: #ff6a00; margin-bottom: 10px; letter-spacing: 2px;
    }
    .user-table {
      width: 100%; border-collapse: collapse; color: #d0dae4;
    }
    .user-table th, .user-table td {
      padding: 8px; border-bottom: 1px solid #1f2a33; text-align: left;
    }
    .btn-small {
      background: transparent; border: 1px solid #3a5060; color: #b0c7d6;
      padding: 4px 10px; cursor: pointer; transition: 0.2s;
      font-family: inherit; font-size: 0.8rem;
    }
    .btn-small:hover { border-color: #00c8ff; color: #fff; }
    .record-input {
      background: #1a1e24; border: 1px solid #3a5060; color: #fff;
      padding: 4px; width: 80px; font-family: inherit;
    }
    /* 主菜单内容 */
    .menu-view {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 450px; padding: 40px 20px;
    }
    .menu-title {
      font-size: 3rem; font-weight: 700; letter-spacing: 12px;
      color: #fff; text-shadow: 0 0 20px #00a3ff;
      text-transform: uppercase; margin-bottom: 10px; text-align: center;
    }
    .menu-subtitle {
      font-size: 1rem; letter-spacing: 4px; color: #5e7a8c; margin-bottom: 50px; text-align: center;
    }
    .menu-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      justify-items: center;
    }
    .menu-card {
      width: 200px; height: 200px;
      background: rgba(20,26,33,0.9); border: 1px solid #2e3b47;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; cursor: pointer;
      transition: all 0.3s ease; position: relative;
      text-decoration: none; color: inherit;
    }
    .menu-card::before {
      content: ''; position: absolute; top: -1px; left: -1px;
      width: 15px; height: 15px;
      border-top: 2px solid #3a4a5a; border-left: 2px solid #3a4a5a;
    }
    .menu-card:hover {
      border-color: #00c8ff; box-shadow: 0 0 25px rgba(0,200,255,0.4);
      background: rgba(30,40,50,0.9); transform: translateY(-5px);
    }
    .menu-card-icon { font-size: 3rem; margin-bottom: 20px; color: #00c8ff; }
    .menu-card-text { font-size: 1.8rem; font-weight: 600; letter-spacing: 4px; color: #f0f4f8; }
    .menu-card-desc { font-size: 0.8rem; color: #7a8b9a; margin-top: 8px; text-align: center; }

    /* 模态框 */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: #13171c; border: 1px solid #2a3340; padding: 30px;
      width: 350px; max-width: 90%;
      box-shadow: 0 0 30px rgba(0,160,255,0.3);
    }
    .modal-content h3 { margin-bottom: 20px; color: #00c8ff; letter-spacing: 2px; }
    .modal-input {
      width: 100%; background: #1a1e24; border: 1px solid #3a5060;
      color: #fff; padding: 10px; margin-bottom: 15px; font-family: inherit;
    }
    .modal-btn {
      background: #00c8ff; border: none; color: #000; padding: 10px 20px;
      cursor: pointer; font-weight: bold; margin-right: 10px; font-family: inherit;
    }
    .modal-btn:hover { background: #00a3ff; }

    /* 移动端适配 */
    @media (max-width: 600px) {
      .container { max-width: 100%; margin: 10px; min-height: auto; }
      .user-bar { padding: 10px 15px; }
      .menu-title { font-size: 2rem; letter-spacing: 6px; }
      .menu-subtitle { font-size: 0.8rem; margin-bottom: 40px; }
      .menu-options { grid-template-columns: 1fr; gap: 20px; }
      .menu-card { width: 150px; height: 150px; }
      .menu-card-icon { font-size: 2.5rem; margin-bottom: 12px; }
      .menu-card-text { font-size: 1.4rem; }
      .menu-card-desc { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 用户状态栏 -->
    <div class="user-bar" id="userBar">
      <span class="user-info" id="userInfo">未登录</span>
      <button class="btn-user" id="btnLogin">登录</button>
      <button class="btn-user" id="btnRegister">注册</button>
      <button class="btn-user" id="btnLogout" style="display:none;">注销</button>
    </div>

    <!-- 管理员面板 -->
    <div class="admin-panel" id="adminPanel">
      <h3>用户总览 - 管理员界面</h3>
      <table class="user-table">
        <thead><tr><th>用户名</th><th>管理员</th><th>最高记录</th><th>操作</th></tr></thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>

    <!-- 主菜单 -->
    <div class="menu-view">
      <div class="menu-title">UEG小网站</div>
      <div class="menu-subtitle">UNITED EARTH GOVNMENT 3 YEARS</div>
      <div class="menu-options">
        <a href="xinghebei.html" class="menu-card">
          <div class="menu-card-icon">⚔️</div>
          <div class="menu-card-text">星河杯</div>
          <div class="menu-card-desc">舰队指标选择器</div>
        </a>
        <div class="menu-card" onclick="alert('交易所即将上线')">
          <div class="menu-card-icon">📊</div>
          <div class="menu-card-text">交易所</div>
          <div class="menu-card-desc">资源交易系统</div>
        </div>
        <a href="games.html" class="menu-card">
          <div class="menu-card-icon">🎮</div>
          <div class="menu-card-text">小游戏</div>
          <div class="menu-card-desc">娱乐模块</div>
        </a>
        <div class="menu-card" onclick="alert('纪念堂建设中')">
          <div class="menu-card-icon">🏛️</div>
          <div class="menu-card-text">纪念堂</div>
          <div class="menu-card-desc">历史记录与成就</div>
        </div>
      </div>
    </div>

    <!-- 注册/登录模态框 -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <h3 id="modalTitle">登录</h3>
        <input type="text" id="usernameInput" class="modal-input" placeholder="用户名">
        <input type="password" id="passwordInput" class="modal-input" placeholder="密码">
        <div>
          <button class="modal-btn" id="modalConfirm">确定</button>
          <button class="modal-btn" onclick="closeModal()" style="background:#3a5060; color:#fff;">取消</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 用户数据管理
    const USERS_KEY = 'ueg_users';
    const CURRENT_USER_KEY = 'ueg_current_user';

    function getUsers() {
      return JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
    }
    function saveUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }
    function getCurrentUser() {
      const cu = localStorage.getItem(CURRENT_USER_KEY);
      return cu ? JSON.parse(cu) : null;
    }
    function setCurrentUser(user) {
      if (user) localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
      else localStorage.removeItem(CURRENT_USER_KEY);
    }

    // 界面元素
    const userInfo = document.getElementById('userInfo');
    const btnLogin = document.getElementById('btnLogin');
    const btnRegister = document.getElementById('btnRegister');
    const btnLogout = document.getElementById('btnLogout');
    const adminPanel = document.getElementById('adminPanel');
    const userTableBody = document.getElementById('userTableBody');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const modalConfirm = document.getElementById('modalConfirm');

    let modalMode = 'login'; // 'login' or 'register'

    function updateUI() {
      const currentUser = getCurrentUser();
      if (currentUser) {
        userInfo.innerHTML = `欢迎，<strong>${currentUser.username}</strong>`;
        btnLogin.style.display = 'none';
        btnRegister.style.display = 'none';
        btnLogout.style.display = 'inline-block';
        if (currentUser.isAdmin) {
          adminPanel.style.display = 'block';
          renderAdminTable();
        } else {
          adminPanel.style.display = 'none';
        }
      } else {
        userInfo.textContent = '未登录';
        btnLogin.style.display = 'inline-block';
        btnRegister.style.display = 'inline-block';
        btnLogout.style.display = 'none';
        adminPanel.style.display = 'none';
      }
    }

    function renderAdminTable() {
      const users = getUsers();
      let html = '';
      users.forEach(u => {
        html += `<tr>
          <td>${u.username}</td>
          <td>${u.isAdmin ? '是' : '否'}</td>
          <td>${u.highestRecord || 0}</td>
          <td>
            <button class="btn-small" onclick="toggleAdmin('${u.username}')">${u.isAdmin ? '取消管理员' : '设为管理员'}</button>
            <input type="number" class="record-input" id="record-${u.username}" placeholder="等级">
            <button class="btn-small" onclick="setRecord('${u.username}')">设置记录</button>
          </td>
        </tr>`;
      });
      userTableBody.innerHTML = html;
    }

    window.toggleAdmin = function(username) {
      const users = getUsers();
      const user = users.find(u => u.username === username);
      if (user) {
        user.isAdmin = !user.isAdmin;
        saveUsers(users);
        updateUI();
        // 如果当前登录用户被修改了权限，刷新currentUser
        const cu = getCurrentUser();
        if (cu && cu.username === username) {
          cu.isAdmin = user.isAdmin;
          setCurrentUser(cu);
        }
      }
    };

    window.setRecord = function(username) {
      const input = document.getElementById(`record-${username}`);
      const record = parseInt(input.value);
      if (isNaN(record) || record < 0) {
        alert('请输入有效的数字');
        return;
      }
      const users = getUsers();
      const user = users.find(u => u.username === username);
      if (user) {
        user.highestRecord = record;
        saveUsers(users);
        renderAdminTable();
        // 如果当前用户记录被修改，更新localStorage最高记录显示（星河杯会用到）
        const cu = getCurrentUser();
        if (cu && cu.username === username) {
          cu.highestRecord = record;
          setCurrentUser(cu);
        }
      }
    };

    function openModal(mode) {
      modalMode = mode;
      modalTitle.textContent = mode === 'login' ? '登录' : '注册';
      usernameInput.value = '';
      passwordInput.value = '';
      modal.style.display = 'flex';
    }

    window.closeModal = function() {
      modal.style.display = 'none';
    };

    modalConfirm.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      if (!username || !password) {
        alert('用户名和密码不能为空');
        return;
      }
      const users = getUsers();
      if (modalMode === 'register') {
        if (users.find(u => u.username === username)) {
          alert('用户名已存在');
          return;
        }
        users.push({ username, password, isAdmin: false, highestRecord: 0 });
        saveUsers(users);
        alert('注册成功，请登录');
        closeModal();
      } else {
        const user = users.find(u => u.username === username && u.password === password);
        if (!user) {
          alert('用户名或密码错误');
          return;
        }
        setCurrentUser(user);
        updateUI();
        closeModal();
      }
    });

    btnLogin.addEventListener('click', () => openModal('login'));
    btnRegister.addEventListener('click', () => openModal('register'));
    btnLogout.addEventListener('click', () => {
      setCurrentUser(null);
      updateUI();
    });

    // 页面加载时更新UI
    updateUI();
  </script>
</body>
</html>
