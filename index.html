<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拉格朗日UEG公会官网</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c0f;
      color: #e0e8f0;
      font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 1100px; max-width: 95%;
      background: linear-gradient(135deg, #13171c 0%, #0d1014 100%);
      border: 1px solid #2a3340;
      box-shadow: 0 0 30px rgba(0,160,255,0.1);
      position: relative;
      overflow: hidden;
      min-height: 600px;
      margin: 20px auto;
    }
    .container::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 60px; height: 60px;
      border-top: 2px solid #00c8ff; border-left: 2px solid #00c8ff;
    }
    .container::after {
      content: ''; position: absolute; bottom: 0; right: 0;
      width: 60px; height: 60px;
      border-bottom: 2px solid #00c8ff; border-right: 2px solid #00c8ff;
    }

    .menu-view {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 450px; padding: 40px 20px;
    }
    .menu-title {
      font-size: 3rem; font-weight: 700; letter-spacing: 12px;
      color: #fff; text-shadow: 0 0 20px #00a3ff;
      text-transform: uppercase; margin-bottom: 10px; text-align: center;
    }
    .menu-subtitle {
      font-size: 1rem; letter-spacing: 4px; color: #5e7a8c; margin-bottom: 50px; text-align: center;
    }
    .menu-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 800px;
    }
    .menu-card {
      width: 200px; height: 200px;
      background: rgba(20,26,33,0.9); border: 1px solid #2e3b47;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; cursor: pointer;
      transition: all 0.3s ease; position: relative;
      text-decoration: none; color: inherit;
    }
    .menu-card::before {
      content: ''; position: absolute; top: -1px; left: -1px;
      width: 15px; height: 15px;
      border-top: 2px solid #3a4a5a; border-left: 2px solid #3a4a5a;
    }
    .menu-card:hover {
      border-color: #00c8ff; box-shadow: 0 0 25px rgba(0,200,255,0.4);
      background: rgba(30,40,50,0.9); transform: translateY(-5px);
    }
    .menu-card-icon { font-size: 3rem; margin-bottom: 20px; color: #00c8ff; }
    .menu-card-text { font-size: 1.8rem; font-weight: 600; letter-spacing: 4px; color: #f0f4f8; }
    .menu-card-desc { font-size: 0.8rem; color: #7a8b9a; margin-top: 8px; text-align: center; }

    /* ========== 模态框（左右两栏） ========== */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: #13171c; border: 1px solid #2a3340;
      width: 700px; max-width: 94%; max-height: 90vh;
      box-shadow: 0 0 40px rgba(0,160,255,0.3);
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }
    .modal-left {
      flex: 1;
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #0d1116;
    }
    .modal-left h3 {
      margin-bottom: 20px;
      color: #00c8ff;
      letter-spacing: 2px;
      text-align: center;
    }
    .modal-input {
      width: 100%; background: #1a1e24; border: 1px solid #3a5060;
      color: #fff; padding: 10px; margin-bottom: 15px; font-family: inherit;
      border-radius: 4px;
    }
    .modal-input:focus {
      outline: none;
      border-color: #00c8ff;
      box-shadow: 0 0 10px rgba(0,200,255,0.2);
    }
    .modal-btn {
      background: #00c8ff; border: none; color: #000; padding: 10px 20px;
      cursor: pointer; font-weight: bold; font-family: inherit;
      transition: 0.2s; border-radius: 4px;
    }
    .modal-btn:hover { background: #00a3ff; }
    .modal-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .modal-btn.toggle {
      background: #3a5060; color: #fff;
    }
    .modal-btn.toggle:hover { background: #5a7080; }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 5px;
      flex-wrap: wrap;
    }
    .btn-row .modal-btn { flex: 1; text-align: center; }

    .modal-right {
      flex: 1;
      padding: 30px 25px;
      background: linear-gradient(135deg, #0f1a24, #0a0e12);
      border-left: 1px solid #1f2833;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .modal-right h2 {
      color: #ff6a00;
      font-size: 1.8rem;
      letter-spacing: 3px;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(255,106,0,0.3);
    }
    .modal-right .intro-text {
      color: #b0c7d6;
      line-height: 1.8;
      font-size: 0.95rem;
    }
    .modal-right .intro-text strong {
      color: #ffaa00;
    }
    .modal-right .intro-text .highlight {
      color: #ff6a00;
      font-weight: 700;
    }
    .modal-right .tagline {
      margin-top: 20px;
      color: #5e7a8c;
      font-style: italic;
      font-size: 0.9rem;
      border-top: 1px solid #1f2833;
      padding-top: 15px;
    }

    /* 移动端适配 */
    @media (max-width: 700px) {
      .modal-content {
        flex-direction: column;
        width: 95%;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-right {
        border-left: none;
        border-top: 1px solid #1f2833;
        padding: 20px;
      }
      .modal-left {
        padding: 20px;
      }
    }

    @media (max-width: 600px) {
      .container { max-width: 100%; margin: 10px; min-height: auto; }
      .menu-title { font-size: 2rem; letter-spacing: 6px; }
      .menu-subtitle { font-size: 0.8rem; margin-bottom: 40px; }
      .menu-card { width: 150px; height: 150px; }
      .menu-card-icon { font-size: 2.5rem; margin-bottom: 12px; }
      .menu-card-text { font-size: 1.4rem; }
      .menu-card-desc { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="user-bar" id="userBar">
      <span class="user-info" id="userInfo">未登录</span>
      <button class="btn-user" id="btnProfile" style="display:none;">个人中心</button>
      <button class="btn-user" id="btnLogout" style="display:none;">注销</button>
    </div>

    <div class="menu-view">
      <div class="menu-title">拉格朗日UEG公会官网</div>
      <div class="menu-subtitle">UNITED EARTH GOVNMENT 3 YEARS</div>
      <div class="menu-options">
        <a href="xinghebei.html" class="menu-card">
          <div class="menu-card-icon">⚔️</div>
          <div class="menu-card-text">星河杯</div>
          <div class="menu-card-desc">舰队指标选择器</div>
        </a>
        <div class="menu-card" onclick="alert('交易所即将上线')">
          <div class="menu-card-icon">📊</div>
          <div class="menu-card-text">交易所</div>
          <div class="menu-card-desc">资源交易系统</div>
        </div>
        <a href="games.html" class="menu-card">
          <div class="menu-card-icon">🎮</div>
          <div class="menu-card-text">小游戏</div>
          <div class="menu-card-desc">娱乐模块</div>
        </a>
        <div class="menu-card" onclick="alert('纪念堂建设中')">
          <div class="menu-card-icon">🏛️</div>
          <div class="menu-card-text">纪念堂</div>
          <div class="menu-card-desc">历史记录与成就</div>
        </div>
        <a href="guild.html" class="menu-card">
          <div class="menu-card-icon">🏰</div>
          <div class="menu-card-text">公会</div>
          <div class="menu-card-desc">组织与协作</div>
        </a>
      </div>
    </div>

    <!-- 登录/注册模态框 -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <div class="modal-left">
          <h3 id="modalTitle">登录</h3>
          <input type="text" id="usernameInput" class="modal-input" placeholder="用户名" autocomplete="username">
          <input type="password" id="passwordInput" class="modal-input" placeholder="密码" autocomplete="current-password">
          <div class="btn-row">
            <button class="modal-btn" id="modalConfirm">确定</button>
            <button class="modal-btn toggle" id="modalToggle">切换至注册</button>
          </div>
          <div id="errorMessage" style="color:#ff6666; font-size:0.9rem; margin-top:10px; text-align:center; min-height:24px;"></div>
        </div>
        <div class="modal-right">
          <h2>拉格朗日UEG公会</h2>
          <div class="intro-text">
            <p>为公会<strong>三周年</strong>钜献，本网站由会长历时一个赛季倾心搭建。</p>
            <p style="margin-top: 8px;">目前功能尚不完善，<span class="highlight">非本公会人禁止登录</span>。</p>
            <p style="margin-top: 8px;">每赛季查人，若发现不在公会中则直接强制注销账号并拉黑。</p>
          </div>
          <div class="tagline">—— 荣耀属于UEG ——</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 引入 Supabase 客户端 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <script>
    // ==================== 用户操作 ====================
    function getCurrentUser() {
      const cu = localStorage.getItem('ueg_current_user');
      return cu ? JSON.parse(cu) : null;
    }
    function setCurrentUser(user) {
      if (user) localStorage.setItem('ueg_current_user', JSON.stringify(user));
      else localStorage.removeItem('ueg_current_user');
    }

    // 显示错误信息（带自动清除）
    function showError(msg, duration = 3000) {
      const el = document.getElementById('errorMessage');
      el.textContent = msg;
      if (duration > 0) {
        clearTimeout(el._timer);
        el._timer = setTimeout(() => { el.textContent = ''; }, duration);
      }
    }

    async function loginUser(username, password) {
      const { data, error } = await supabase
        .from('users')
        .select('username, password, is_admin, highest_record')
        .eq('username', username)
        .maybeSingle();

      if (error) {
        console.error('登录查询失败:', error);
        showError('登录失败，请稍后再试');
        return false;
      }
      if (!data) {
        showError('用户名不存在');
        return false;
      }
      if (data.password !== password) {
        showError('密码错误');
        return false;
      }

      setCurrentUser({
        username: data.username,
        isAdmin: data.is_admin || false,
        highestRecord: data.highest_record || 0,
        password: data.password
      });
      return true;
    }

    async function registerUser(username, password) {
      // 密码长度校验
      if (password.length < 6) {
        showError('密码长度至少6位');
        return false;
      }

      const { data: existing, error: checkError } = await supabase
        .from('users')
        .select('username')
        .eq('username', username)
        .maybeSingle();

      if (checkError) {
        showError('注册失败，请稍后再试');
        return false;
      }
      if (existing) {
        showError('用户名已存在');
        return false;
      }

      const isAdmin = (username === 'angus');
      const { error: insertError } = await supabase
        .from('users')
        .insert([{
          username,
          password,
          is_admin: isAdmin,
          highest_record: 0
        }]);

      if (insertError) {
        showError('注册失败: ' + insertError.message);
        return false;
      }
      return true;
    }

    // ==================== UI 控制 ====================
    const userInfo = document.getElementById('userInfo');
    const btnLogout = document.getElementById('btnLogout');
    const btnProfile = document.getElementById('btnProfile');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const modalConfirm = document.getElementById('modalConfirm');
    const modalToggle = document.getElementById('modalToggle');
    const errorMessage = document.getElementById('errorMessage');
    const menuCards = document.querySelectorAll('.menu-card');

    let modalMode = 'login'; // 'login' | 'register'
    let isProcessing = false;

    function updateUI() {
      const user = getCurrentUser();
      if (user) {
        userInfo.innerHTML = `欢迎，<strong>${user.username}</strong>`;
        btnLogout.style.display = 'inline-block';
        btnProfile.style.display = 'inline-block';
        menuCards.forEach(c => {
          c.style.pointerEvents = 'auto';
          c.style.opacity = '1';
        });
        if (modal.style.display === 'flex') modal.style.display = 'none';
      } else {
        userInfo.textContent = '未登录';
        btnLogout.style.display = 'none';
        btnProfile.style.display = 'none';
        menuCards.forEach(c => {
          c.style.pointerEvents = 'none';
          c.style.opacity = '0.6';
        });
        if (modal.style.display !== 'flex') {
          openModal('login');
        }
      }
    }

    function openModal(mode) {
      modalMode = mode;
      if (mode === 'login') {
        modalTitle.textContent = '登录';
        modalToggle.textContent = '切换至注册';
        modalConfirm.textContent = '登录';
      } else {
        modalTitle.textContent = '注册';
        modalToggle.textContent = '切换至登录';
        modalConfirm.textContent = '注册';
      }
      usernameInput.value = '';
      passwordInput.value = '';
      errorMessage.textContent = '';
      modal.style.display = 'flex';
      // 自动聚焦第一个输入框
      setTimeout(() => usernameInput.focus(), 100);
    }

    // 切换模式
    modalToggle.addEventListener('click', () => {
      if (modalMode === 'login') openModal('register');
      else openModal('login');
    });

    // 确定按钮
    modalConfirm.addEventListener('click', async () => {
      if (isProcessing) return;
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      if (!username || !password) {
        showError('用户名和密码不能为空');
        return;
      }

      isProcessing = true;
      modalConfirm.disabled = true;
      modalConfirm.textContent = modalMode === 'login' ? '登录中...' : '注册中...';

      try {
        if (modalMode === 'register') {
          const ok = await registerUser(username, password);
          if (ok) {
            showError('注册成功，请登录', 2000);
            setTimeout(() => openModal('login'), 500);
          }
        } else {
          const ok = await loginUser(username, password);
          if (ok) {
            updateUI();
          }
        }
      } catch (err) {
        showError('操作失败，请重试');
        console.error(err);
      } finally {
        isProcessing = false;
        modalConfirm.disabled = false;
        modalConfirm.textContent = modalMode === 'login' ? '登录' : '注册';
      }
    });

    // 回车键提交
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') modalConfirm.click();
    });
    usernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') passwordInput.focus();
    });

    // 点击背景不能关闭（未登录时）
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        if (!getCurrentUser()) {
          showError('请先登录或注册', 2000);
        } else {
          modal.style.display = 'none';
        }
      }
    });

    // ESC 键处理
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.style.display === 'flex') {
        if (!getCurrentUser()) {
          showError('请先登录或注册', 2000);
        } else {
          modal.style.display = 'none';
        }
      }
    });

    // 菜单拦截
    document.querySelector('.menu-options').addEventListener('click', (e) => {
      const card = e.target.closest('.menu-card');
      if (!card) return;
      if (!getCurrentUser()) {
        e.preventDefault();
        e.stopPropagation();
        showError('请先登录', 2000);
        if (modal.style.display !== 'flex') openModal('login');
      }
    });

    // 个人中心 / 注销
    btnProfile.addEventListener('click', () => {
      if (!getCurrentUser()) {
        showError('请先登录', 2000);
        return;
      }
      window.location.href = 'profile.html';
    });
    btnLogout.addEventListener('click', () => {
      setCurrentUser(null);
      updateUI();
    });

    // ==================== 初始化 ====================
    updateUI();
  </script>
</body>
</html>
