<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UEG小网站</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c0f;
      color: #e0e8f0;
      font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 1100px; max-width: 95%;
      background: linear-gradient(135deg, #13171c 0%, #0d1014 100%);
      border: 1px solid #2a3340;
      box-shadow: 0 0 30px rgba(0,160,255,0.1);
      position: relative;
      overflow: hidden;
      min-height: 600px;
      margin: 20px auto;
    }
    .container::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 60px; height: 60px;
      border-top: 2px solid #00c8ff; border-left: 2px solid #00c8ff;
    }
    .container::after {
      content: ''; position: absolute; bottom: 0; right: 0;
      width: 60px; height: 60px;
      border-bottom: 2px solid #00c8ff; border-right: 2px solid #00c8ff;
    }

    .menu-view {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 450px; padding: 40px 20px;
    }
    .menu-title {
      font-size: 3rem; font-weight: 700; letter-spacing: 12px;
      color: #fff; text-shadow: 0 0 20px #00a3ff;
      text-transform: uppercase; margin-bottom: 10px; text-align: center;
    }
    .menu-subtitle {
      font-size: 1rem; letter-spacing: 4px; color: #5e7a8c; margin-bottom: 50px; text-align: center;
    }
    .menu-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 800px;
    }
    .menu-card {
      width: 200px; height: 200px;
      background: rgba(20,26,33,0.9); border: 1px solid #2e3b47;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; cursor: pointer;
      transition: all 0.3s ease; position: relative;
      text-decoration: none; color: inherit;
    }
    .menu-card::before {
      content: ''; position: absolute; top: -1px; left: -1px;
      width: 15px; height: 15px;
      border-top: 2px solid #3a4a5a; border-left: 2px solid #3a4a5a;
    }
    .menu-card:hover {
      border-color: #00c8ff; box-shadow: 0 0 25px rgba(0,200,255,0.4);
      background: rgba(30,40,50,0.9); transform: translateY(-5px);
    }
    .menu-card-icon { font-size: 3rem; margin-bottom: 20px; color: #00c8ff; }
    .menu-card-text { font-size: 1.8rem; font-weight: 600; letter-spacing: 4px; color: #f0f4f8; }
    .menu-card-desc { font-size: 0.8rem; color: #7a8b9a; margin-top: 8px; text-align: center; }

    /* 登录/注册模态框 */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: #13171c; border: 1px solid #2a3340; padding: 30px;
      width: 350px; max-width: 90%;
      box-shadow: 0 0 30px rgba(0,160,255,0.3);
    }
    .modal-content h3 { margin-bottom: 20px; color: #00c8ff; letter-spacing: 2px; }
    .modal-input {
      width: 100%; background: #1a1e24; border: 1px solid #3a5060;
      color: #fff; padding: 10px; margin-bottom: 15px; font-family: inherit;
    }
    .modal-btn {
      background: #00c8ff; border: none; color: #000; padding: 10px 20px;
      cursor: pointer; font-weight: bold; margin-right: 10px; font-family: inherit;
    }
    .modal-btn:hover { background: #00a3ff; }

    @media (max-width: 600px) {
      .container { max-width: 100%; margin: 10px; min-height: auto; }
      .menu-title { font-size: 2rem; letter-spacing: 6px; }
      .menu-subtitle { font-size: 0.8rem; margin-bottom: 40px; }
      .menu-card { width: 150px; height: 150px; }
      .menu-card-icon { font-size: 2.5rem; margin-bottom: 12px; }
      .menu-card-text { font-size: 1.4rem; }
      .menu-card-desc { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="user-bar" id="userBar">
      <span class="user-info" id="userInfo">未登录</span>
      <button class="btn-user" id="btnProfile" style="display:none;">个人中心</button>
      <button class="btn-user" id="btnLogin">登录</button>
      <button class="btn-user" id="btnRegister">注册</button>
      <button class="btn-user" id="btnLogout" style="display:none;">注销</button>
    </div>

    <div class="menu-view">
      <div class="menu-title">UEG小网站</div>
      <div class="menu-subtitle">UNITED EARTH GOVNMENT 3 YEARS</div>
      <div class="menu-options">
        <a href="xinghebei.html" class="menu-card">
          <div class="menu-card-icon">⚔️</div>
          <div class="menu-card-text">星河杯</div>
          <div class="menu-card-desc">舰队指标选择器</div>
        </a>
        <div class="menu-card" onclick="alert('交易所即将上线')">
          <div class="menu-card-icon">📊</div>
          <div class="menu-card-text">交易所</div>
          <div class="menu-card-desc">资源交易系统</div>
        </div>
        <a href="games.html" class="menu-card">
          <div class="menu-card-icon">🎮</div>
          <div class="menu-card-text">小游戏</div>
          <div class="menu-card-desc">娱乐模块</div>
        </a>
        <div class="menu-card" onclick="alert('纪念堂建设中')">
          <div class="menu-card-icon">🏛️</div>
          <div class="menu-card-text">纪念堂</div>
          <div class="menu-card-desc">历史记录与成就</div>
        </div>
        <a href="guild.html" class="menu-card">
          <div class="menu-card-icon">🏰</div>
          <div class="menu-card-text">公会</div>
          <div class="menu-card-desc">组织与协作</div>
        </a>
      </div>
    </div>

    <!-- 登录/注册模态框 -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <h3 id="modalTitle">登录</h3>
        <input type="text" id="usernameInput" class="modal-input" placeholder="用户名">
        <input type="password" id="passwordInput" class="modal-input" placeholder="密码">
        <div>
          <button class="modal-btn" id="modalConfirm">确定</button>
          <button class="modal-btn" onclick="closeModal()" style="background:#3a5060; color:#fff;">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 引入 Supabase 客户端 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <script>
    // ==================== Supabase 用户操作 ====================

    // 获取当前登录用户（从 localStorage 读取会话）
    function getCurrentUser() {
      const cu = localStorage.getItem('ueg_current_user');
      return cu ? JSON.parse(cu) : null;
    }

    // 设置当前用户（存入 localStorage）
    function setCurrentUser(user) {
      if (user) {
        localStorage.setItem('ueg_current_user', JSON.stringify(user));
      } else {
        localStorage.removeItem('ueg_current_user');
      }
    }

    // ==================== 登录 ====================
    async function loginUser(username, password) {
      // 查询 users 表，匹配用户名和密码
      const { data, error } = await supabase
        .from('users')
        .select('username, password, is_admin, highest_record')
        .eq('username', username)
        .maybeSingle();

      if (error) {
        console.error('登录查询失败:', error);
        alert('登录失败，请稍后再试');
        return false;
      }

      if (!data) {
        alert('用户名不存在');
        return false;
      }

      if (data.password !== password) {
        alert('密码错误');
        return false;
      }

      // 登录成功，保存会话（将 is_admin 字段映射为 isAdmin）
      const userInfo = {
        username: data.username,
        isAdmin: data.is_admin || false,
        highestRecord: data.highest_record || 0,
        // 为了兼容其他页面，也存储 password 但通常不推荐明文存储，但这里用于 profile 等页面
        password: data.password
      };
      setCurrentUser(userInfo);
      return true;
    }

    // ==================== 注册 ====================
    async function registerUser(username, password) {
      // 检查用户名是否已存在
      const { data: existing, error: checkError } = await supabase
        .from('users')
        .select('username')
        .eq('username', username)
        .maybeSingle();

      if (checkError) {
        console.error('检查用户名失败:', checkError);
        alert('注册失败，请稍后再试');
        return false;
      }

      if (existing) {
        alert('用户名已存在');
        return false;
      }

      // 如果是 angus，自动设为管理员
      const isAdmin = (username === 'angus');

      // 插入新用户
      const { error: insertError } = await supabase
        .from('users')
        .insert([{
          username: username,
          password: password,
          is_admin: isAdmin,
          highest_record: 0
        }]);

      if (insertError) {
        console.error('注册插入失败:', insertError);
        alert('注册失败: ' + insertError.message);
        return false;
      }

      alert('注册成功，请登录');
      return true;
    }

    // ==================== UI 更新 ====================
    const userInfo = document.getElementById('userInfo');
    const btnLogin = document.getElementById('btnLogin');
    const btnRegister = document.getElementById('btnRegister');
    const btnLogout = document.getElementById('btnLogout');
    const btnProfile = document.getElementById('btnProfile');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const modalConfirm = document.getElementById('modalConfirm');

    let modalMode = 'login';

    function updateUI() {
      const currentUser = getCurrentUser();
      if (currentUser) {
        userInfo.innerHTML = `欢迎，<strong>${currentUser.username}</strong>`;
        btnLogin.style.display = 'none';
        btnRegister.style.display = 'none';
        btnLogout.style.display = 'inline-block';
        btnProfile.style.display = 'inline-block';
      } else {
        userInfo.textContent = '未登录';
        btnLogin.style.display = 'inline-block';
        btnRegister.style.display = 'inline-block';
        btnLogout.style.display = 'none';
        btnProfile.style.display = 'none';
      }
    }

    // 个人中心跳转
    btnProfile.addEventListener('click', () => {
      window.location.href = 'profile.html';
    });

    // 登录/注册模态框
    function openModal(mode) {
      modalMode = mode;
      modalTitle.textContent = mode === 'login' ? '登录' : '注册';
      usernameInput.value = '';
      passwordInput.value = '';
      modal.style.display = 'flex';
    }

    window.closeModal = function() {
      modal.style.display = 'none';
    };

    modalConfirm.addEventListener('click', async () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      if (!username || !password) {
        alert('用户名和密码不能为空');
        return;
      }

      if (modalMode === 'register') {
        const success = await registerUser(username, password);
        if (success) {
          closeModal();
        }
      } else {
        // login
        const success = await loginUser(username, password);
        if (success) {
          updateUI();
          closeModal();
        }
      }
    });

    // 按钮事件
    btnLogin.addEventListener('click', () => openModal('login'));
    btnRegister.addEventListener('click', () => openModal('register'));
    btnLogout.addEventListener('click', () => {
      setCurrentUser(null);
      updateUI();
    });

    // ==================== 初始化 ====================
    updateUI();
  </script>
</body>
</html>
