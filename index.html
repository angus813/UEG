  <script>
    // ==================== 用户状态管理 ====================
    function getCurrentUser() {
      try {
        const cu = localStorage.getItem('ueg_current_user');
        return cu ? JSON.parse(cu) : null;
      } catch (e) {
        localStorage.removeItem('ueg_current_user');
        return null;
      }
    }
    function setCurrentUser(user) {
      if (user) localStorage.setItem('ueg_current_user', JSON.stringify(user));
      else localStorage.removeItem('ueg_current_user');
    }

    // 显示错误
    function showError(msg, duration = 3000) {
      const el = document.getElementById('errorMessage');
      el.textContent = msg;
      if (duration > 0) {
        clearTimeout(el._timer);
        el._timer = setTimeout(() => { el.textContent = ''; }, duration);
      }
    }

    // ==================== 记住密码 ====================
    // 勾选「记住密码」时，把账号密码存到 localStorage；下次打开登录框自动回填并自动登录。
    const REMEMBER_KEY = 'ueg_remembered_login';
    function saveRemembered(username, password) {
      try { localStorage.setItem(REMEMBER_KEY, JSON.stringify({ u: username, p: password })); }
      catch (e) { /* 隐私模式/存储满时忽略 */ }
    }
    function loadRemembered() {
      try { return JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null'); } catch (e) { return null; }
    }
    function clearRemembered() {
      try { localStorage.removeItem(REMEMBER_KEY); } catch (e) {}
    }
    // 尝试用记住的密码自动登录（会话恢复失败后的兜底）
    async function autoLoginWithRemembered() {
      const r = loadRemembered();
      if (!r || !r.u || !r.p) return false;
      if (getCurrentUser()) return true;           // 已有登录态
      const ok = await loginUser(r.u, r.p);
      if (ok) { updateUI(); return true; }
      return false;                                  // 密码已改/账号被删等，保留记录供用户改
    }

    // ==================== 登录 / 注册（GitHub 数据库版） ====================
    async function loginUser(username, password) {
      const result = await DB.login(username, password);
      if (result.code === 200) {
        setCurrentUser(result.data);
        return true;
      } else {
        showError(result.msg);
        return false;
      }
    }

    async function registerUser(username, password) {
      if (password.length < 6) {
        showError('密码长度至少6位');
        return false;
      }
      const result = await DB.register(username, password);
      if (result.code === 200) {
        // 注册返回带 session（signup 开启自动确认）时已自动登录
        if (DB.hasToken && DB.hasToken()) {
          setCurrentUser(result.data);
          updateUI();
          showError('注册成功，已自动登录', 2000);
          return true;
        }
        showError('注册成功，请登录', 2000);
        // 引导回登录模式，但保留刚注册的用户名、密码留空，
        // 不回填「记住密码」里的旧账号（否则像把注册换成了登录）。
        setTimeout(() => openModal('login', username), 500);
        return true;
      } else {
        showError(result.msg);
        return false;
      }
    }

    // ==================== UI 控制 ====================
    const userInfo = document.getElementById('userInfo');
    const btnLogout = document.getElementById('btnLogout');
    const btnProfile = document.getElementById('btnProfile');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const modalConfirm = document.getElementById('modalConfirm');
    const modalToggle = document.getElementById('modalToggle');
    const rememberMe = document.getElementById('rememberMe');
    const menuCards = document.querySelectorAll('.menu-card');

    let modalMode = 'login';
    let isProcessing = false;

    function updateUI() {
      const user = getCurrentUser();
      if (user) {
        userInfo.textContent = '';
        const strong = document.createElement('strong');
        strong.textContent = user.username;
        userInfo.appendChild(document.createTextNode('欢迎，'));
        userInfo.appendChild(strong);
        btnLogout.style.display = 'inline-block';
        btnProfile.style.display = 'inline-block';
        menuCards.forEach(c => { c.style.pointerEvents = 'auto'; c.style.opacity = '1'; });
        // 登录后先恢复可见，是否真有权限由 gateXinghebei 异步判定。
        // 它定义在后面的 script 里，首次 updateUI() 执行时还没定义 —— typeof 兜底，
        // 由后面的 IIFE 负责首次判定。
        const xcCard = document.getElementById('cardXinghebei');
        if (xcCard) xcCard.style.display = '';
        if (typeof window.gateXinghebei === 'function') window.gateXinghebei();
        // 公告区的「发布公告」按钮同理，定义在后面的 IIFE 里
        if (typeof window.refreshAnnStaff === 'function') window.refreshAnnStaff();
        if (modal.style.display === 'flex') modal.style.display = 'none';
      } else {
        userInfo.textContent = '未登录';
        btnLogout.style.display = 'none';
        btnProfile.style.display = 'none';
        menuCards.forEach(c => { c.style.pointerEvents = 'none'; c.style.opacity = '0.6'; });
        // 星河杯入口未登录直接藏：gateXinghebei 只在页面加载时跑一次，
        // 而 DB.checkSession 失效是异步的（会把登录态清掉并弹登录框），
        // 两者之间有窗口期会让「登录框弹着、卡片还挂着」。
        const xcCard = document.getElementById('cardXinghebei');
        if (xcCard) xcCard.style.display = 'none';
        if (typeof window.refreshAnnStaff === 'function') window.refreshAnnStaff();
        if (modal.style.display !== 'flex') openModal('login');
      }
    }

    function openModal(mode, prefillUser) {
      modalMode = mode;
      if (mode === 'login') {
        modalTitle.textContent = '登录';
        modalToggle.textContent = '切换至注册';
        modalConfirm.textContent = '登录';
      } else {
        modalTitle.textContent = '注册';
        modalToggle.textContent = '切换至登录';
        modalConfirm.textContent = '注册';
      }
      // 勾选了「记住密码」就回填账号密码，方便直接点登录；否则留空。
      // 显式传入 prefillUser 时（如注册成功后引导去登录）只带用户名，
      // 不回填密码、不勾记忆 —— 否则会把记忆里的旧账号密码填进来，
      // 看起来就像「正在注册却被换成登录」。
      let fillUser = '', fillPass = '', wasChecked = false;
      if (prefillUser !== undefined && prefillUser !== null) {
        fillUser = prefillUser;
      } else {
        const remembered = mode === 'login' ? loadRemembered() : null;
        fillUser = remembered ? remembered.u : '';
        fillPass = remembered ? remembered.p : '';
        wasChecked = !!remembered;
      }
      usernameInput.value = fillUser;
      passwordInput.value = fillPass;
      if (rememberMe) rememberMe.checked = wasChecked;
      document.getElementById('errorMessage').textContent = '';
      modal.style.display = 'flex';
      setTimeout(() => usernameInput.focus(), 100);
    }

    // 切换登录/注册
    modalToggle.addEventListener('click', () => {
      if (modalMode === 'login') openModal('register');
      else openModal('login');
    });

    // 确认按钮
    modalConfirm.addEventListener('click', async () => {
      if (isProcessing) return;
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      if (!username || !password) {
        showError('用户名和密码不能为空');
        return;
      }
      isProcessing = true;
      modalConfirm.disabled = true;
      modalConfirm.textContent = modalMode === 'login' ? '登录中...' : '注册中...';
      try {
        if (modalMode === 'register') {
          await registerUser(username, password);
        } else {
          const ok = await loginUser(username, password);
          if (ok) {
            // 只有勾选「记住密码」才落盘；取消勾选则清掉已存的密码
            if (rememberMe && rememberMe.checked) saveRemembered(username, password);
            else clearRemembered();
            updateUI();
          }
        }
      } catch (err) {
        console.error(err);
        showError('操作失败，请重试');
      } finally {
        isProcessing = false;
        modalConfirm.disabled = false;
        modalConfirm.textContent = modalMode === 'login' ? '登录' : '注册';
      }
    });

    // 回车提交
    passwordInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') modalConfirm.click();
    });
    usernameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') passwordInput.focus();
    });

    // 点击背景不关闭
    modal.addEventListener('click', e => {
      if (e.target === modal) {
        if (!getCurrentUser()) showError('请先登录或注册', 2000);
        else modal.style.display = 'none';
      }
    });

    // ESC 键
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && modal.style.display === 'flex') {
        if (!getCurrentUser()) showError('请先登录或注册', 2000);
        else modal.style.display = 'none';
      }
    });

    // 未登录拦截菜单点击
    document.querySelector('.menu-options').addEventListener('click', e => {
      const card = e.target.closest('.menu-card');
      if (!card) return;
      if (!getCurrentUser()) {
        e.preventDefault();
        e.stopPropagation();
        showError('请先登录', 2000);
        if (modal.style.display !== 'flex') openModal('login');
      }
    });

    // 个人中心 / 注销
    btnProfile.addEventListener('click', () => {
      if (!getCurrentUser()) { showError('请先登录', 2000); return; }
      window.location.href = 'public/profile.html';
    });
    btnLogout.addEventListener('click', () => {
      if (window.DB && DB.logout) DB.logout(); // 清除 Token 内存/会话缓存
      setCurrentUser(null);
      // 同时清掉记住的密码：否则下次打开会自动重新登录，等于注销无效
      clearRemembered();
      updateUI();
    });

    // ==================== 初始化 ====================
    // 自动登录：github-db.js 加载时会自动 restoreSession()（access token 过期则用
    // refresh token 续期），结果挂在 window.UEG_SESSION_READY 上。
    // 之前只在 gateXinghebei 里 await 了它，恢复成功后没人调 updateUI()，
    // 于是「自动登录其实成功了，但页面还显示未登录 / 弹登录框」。
    (function bootstrap() {
      const done = function (r) {
        if (r && r.code === 200) { updateUI(); return; }
        // 用户已经在登录/注册框里动手输入了（如正在注册），
        // 就不要用「记住的密码」自动登录去覆盖他的输入。
        const typing = (usernameInput.value || passwordInput.value);
        if (typing) return;
        // 会话恢复失败：再试一次「记住的密码」自动登录，仍失败才让用户手动登录
        autoLoginWithRemembered().then(function (ok) {
          if (!ok) updateUI();
        });
      };
      if (window.UEG_SESSION_READY && typeof window.UEG_SESSION_READY.then === 'function') {
        updateUI();                                  // 先渲染，避免白屏
        window.UEG_SESSION_READY.then(done).catch(function () { done({ code: 401 }); });
      } else {
        done(null);
      }
    })();
  </script>
  <script>
    // 星河杯入口仅管理员/官员可见。
    // updateUI() 会在登录态每次变化时重调它（登录、注销、checkSession 失效）。
    window.gateXinghebei = async function gateXinghebei() {
      try {
        var card = document.getElementById('cardXinghebei');
        if (!card) return;
        var ready = window.UEG_SESSION_READY;
        if (ready) { try { await ready; } catch (e) {} }
        // 与 updateUI 同源取登录态：checkSession 判定失效时会把它清掉，
        // 这里读到 null 就藏，不再用页面加载瞬间的旧快照兜底。
        var cu = getCurrentUser();
        if (!cu) { card.style.display = 'none'; return; }
        var ok = false;
        try {
          var r = await DB.myProfile();
          if (r && r.code === 200 && r.data) {
            ok = !!(r.data.is_admin || r.data.is_owner || r.data.is_official);
          }
        } catch (e) {}
        if (!ok) ok = !!(cu.is_admin || cu.is_owner || cu.is_official);
        card.style.display = ok ? '' : 'none';
      } catch (e) {}
    };
    window.gateXinghebei();
  </script>

  <script>
    // ==================== 更新公告 ====================
    // 权限口径与星河杯门禁一致：is_admin / is_owner / is_official。
    // 前端判断只管 UI，真正闸门是 announcements 表上的 RLS（public.is_staff()）。
    (function () {
      var list = document.getElementById('annList');
      var form = document.getElementById('annForm');
      var btnCompose = document.getElementById('btnAnnCompose');
      var titleEl = document.getElementById('annTitle');
      var bodyEl = document.getElementById('annBody');
      var pinnedEl = document.getElementById('annPinned');
      var importantEl = document.getElementById('annImportant');
      var msgEl = document.getElementById('annFormMsg');
      var submitEl = document.getElementById('annSubmit');
      if (!list || !form) return;

      var items = [];
      var staff = false;
      var editingId = null;
      var loadErr = '';

      // 公告内容是数据库里的文本，一律按不可信处理：拼进 HTML 前转义
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function fmtDate(iso) {
        var dt = new Date(iso);
        return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' +
               String(dt.getDate()).padStart(2, '0');
      }

      function ago(iso) {
        var t = Date.parse(iso);
        if (isNaN(t)) return '';
        var d = (Date.now() - t) / 1000;
        // 时钟不同步（客户端时间偏后、或补录了未来的公告）会算出负值，
        // 直接返回日期而不是「刚刚」——「刚刚」会被误读成刚发布。
        if (d < 0) return fmtDate(iso);
        if (d < 60) return '刚刚';
        if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
        if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
        if (d < 86400 * 7) return Math.floor(d / 86400) + ' 天前';
        return fmtDate(iso);
      }

      function showFormMsg(text) {
        msgEl.textContent = text || '';
        msgEl.classList.toggle('is-error', !!text);
      }

      function render() {
        if (loadErr) {
          // 读失败要显式说出来，不能落到下面的空态 ——
          // 「读失败」和「还没发过公告」在界面上长得一样，管理员会以为表没建。
          list.innerHTML = '<div class="ann-empty is-error">' + loadErr + '</div>';
          return;
        }
        if (!items.length) {
          list.innerHTML = '<div class="ann-empty">暂无公告</div>';
          return;
        }
        var html = '';
        for (var i = 0; i < items.length; i++) {
          var a = items[i];
          var cls = 'ann-item' + (a.important ? ' is-important' : '');
          html += '<article class="' + cls + '" data-id="' + esc(a.id) + '">';
          html += '<div class="ann-item-head">';
          if (a.pinned) html += '<span class="ann-tag ann-tag-pin">置顶</span>';
          if (a.important) html += '<span class="ann-tag ann-tag-danger">重要</span>';
          html += '<h3 class="ann-item-title">' + esc(a.title) + '</h3>';
          html += '</div>';
          if (a.body) {
            // 正文按行断行：白空格处理防止连续空行撑出大间距
            var lines = String(a.body).split(/\r?\n/).filter(function (l) { return l.trim(); });
            html += '<div class="ann-item-body">' +
              lines.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') + '</div>';
          }
          html += '<div class="ann-item-foot"><span>' + esc(a.author || '管理员') + '</span>' +
                  '<span>' + esc(ago(a.created_at)) +
                  (a.updated_at && Date.parse(a.updated_at) - Date.parse(a.created_at) > 60000 ? ' · 已编辑' : '') +
                  '</span></div>';
          if (staff) {
            html += '<div class="ann-item-ops">' +
              '<button type="button" data-ann-act="edit" data-id="' + esc(a.id) + '">编辑</button>' +
              '<button type="button" data-ann-act="pin" data-id="' + esc(a.id) + '">' +
                (a.pinned ? '取消置顶' : '置顶') + '</button>' +
              '<button type="button" data-ann-act="del" data-id="' + esc(a.id) + '">删除</button>' +
              '</div>';
          }
          html += '</article>';
        }
        list.innerHTML = html;
      }

      async function load() {
        loadErr = '';
        try {
          var r = await DB.getAnnouncements();
          if (r && r.code === 200) {
            items = r.data || [];
            list.classList.remove('is-error');
          } else {
            items = [];
            loadErr = '公告读取失败' + (r && r.msg ? '：' + esc(r.msg) : '') +
                      '<br><span class="ann-hint">首次使用请先在 Supabase 建 announcements 表（ops/supabase_announcements.sql）</span>';
          }
        } catch (e) {
          items = [];
          loadErr = '公告读取失败，请检查网络';
        }
        render();
      }

      function openForm(item) {
        editingId = item ? item.id : null;
        titleEl.value = item ? item.title : '';
        bodyEl.value = item ? item.body : '';
        pinnedEl.checked = item ? !!item.pinned : false;
        importantEl.checked = item ? !!item.important : false;
        submitEl.textContent = item ? '保存' : '发布';
        showFormMsg('');
        form.style.display = '';
        titleEl.focus();
      }

      function closeForm() {
        editingId = null;
        form.style.display = 'none';
        titleEl.value = '';
        bodyEl.value = '';
        pinnedEl.checked = false;
        importantEl.checked = false;
        // 成功提交后 closeForm 先跑、失败分支的重置文案在其后，
        // 不在这里清掉会把「保存中…」留在按钮上
        submitEl.textContent = '发布';
        submitEl.disabled = false;
        showFormMsg('');
      }

      // 登录态或权限变化时由 updateUI 调过来：决定「发布公告」按钮是否出现
      window.refreshAnnStaff = async function refreshAnnStaff() {
        staff = false;
        if (!getCurrentUser()) {
          btnCompose.style.display = 'none';
          closeForm();
          render();
          return;
        }
        var ready = window.UEG_SESSION_READY;
        if (ready) { try { await ready; } catch (e) {} }
        try { staff = await DB.isStaff(); } catch (e) { staff = false; }
        btnCompose.style.display = staff ? '' : 'none';
        if (!staff) closeForm();
        render();
      };

      btnCompose.addEventListener('click', function () {
        if (!staff) { showError('仅管理员可发布公告', 2000); return; }
        closeForm();
        openForm(null);
      });
      document.getElementById('btnAnnRefresh').addEventListener('click', function () {
        load();
      });
      document.getElementById('annCancel').addEventListener('click', closeForm);

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!staff) { showFormMsg('仅管理员可发布公告'); return; }
        if (submitEl.disabled) return;
        submitEl.disabled = true;
        submitEl.textContent = editingId ? '保存中…' : '发布中…';
        var payload = {
          title: titleEl.value,
          body: bodyEl.value,
          pinned: pinnedEl.checked,
          important: importantEl.checked
        };
        var r = editingId
          ? await DB.updateAnnouncement(editingId, payload)
          : await DB.createAnnouncement(payload);
        submitEl.disabled = false;
        if (r && r.code === 200) {
          closeForm();
          await load();
        } else {
          submitEl.textContent = editingId ? '保存' : '发布';
          showFormMsg((r && r.msg) || '操作失败');
        }
      });

      list.addEventListener('click', async function (e) {
        var btn = e.target.closest('[data-ann-act]');
        if (!btn || !staff) return;
        var id = btn.getAttribute('data-id');
        var act = btn.getAttribute('data-ann-act');
        var idx = items.findIndex(function (a) { return a.id === id; });
        if (idx < 0) return;
        var target = items[idx];

        if (act === 'edit') {
          openForm({ id: target.id, title: target.title, body: target.body,
                     pinned: target.pinned, important: target.important });
          form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          return;
        }
        if (act === 'pin') {
          btn.disabled = true;
          var rp = await DB.updateAnnouncement(id, { pinned: !target.pinned });
          btn.disabled = false;
          if (rp && rp.code === 200) await load();
          else showError(rp.msg || '操作失败', 2000);
          return;
        }
        if (act === 'del') {
          if (!confirm('确定删除公告「' + target.title + '」？该操作不可撤销。')) return;
          btn.disabled = true;
          var rd = await DB.deleteAnnouncement(id);
          btn.disabled = false;
          if (rd && rd.code === 200) {
            if (editingId === id) closeForm();
            await load();
          } else {
            showError(rd.msg || '操作失败', 2000);
          }
        }
      });

      // 首屏：公告公开可读，不用等登录态；权限判定要等会话恢复完成
      load();
      window.refreshAnnStaff();
      var ready0 = window.UEG_SESSION_READY;
      if (ready0 && typeof ready0.then === 'function') {
        ready0.then(function () { window.refreshAnnStaff(); }).catch(function () {});
      }
    })();
  </script>
</body>
</html>
