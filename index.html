<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>拉格朗日UEG公会官网</title>
  <link rel="stylesheet" href="public/admin.css">
  <link rel="stylesheet" href="public/rhine-fonts.css" media="print" onload="this.media='all'"> <!-- MiSans（异步加载，不阻塞首屏） -->
  <noscript><link rel="stylesheet" href="public/rhine-fonts.css"></noscript> <!-- MiSans webfont -->
  <link rel="stylesheet" href="public/rhine.css"> <!-- Rhine Lab Archive 设计系统 -->
  <link rel="stylesheet" href="public/rhine-motion.css"> <!-- 动效层 -->
  <!-- 页面视觉统一由 public/rhine.css 设计系统提供 -->
  <script src="public/rhine-motion.js"></script>
</head>
<body>
  <div class="container">
    <div class="user-bar" id="userBar">
      <span class="user-info" id="userInfo">未登录</span>
      <button class="btn-user" id="btnProfile" style="display:none;">个人中心</button>
      <button class="btn-user" id="btnLogout" style="display:none;">注销</button>
    </div>

    <div class="menu-view">
      <div class="menu-title">
<span class="fm">拉格朗日UEG公会官网</span>
      </div>
      <div class="menu-subtitle">UNITED EARTH GOVNMENT 3 YEARS</div>
      <div class="menu-options">
        <!-- 链接到 public/ 下的页面 -->
        <a href="public/xinghebei.html" class="menu-card" id="cardXinghebei">
          <div class="menu-card-icon"></div>
          <div class="menu-card-text">星河杯</div>
          <div class="menu-card-desc">舰队指标选择器</div>
        </a>
        <a href="public/mata.html" class="menu-card">
          <div class="menu-card-icon"></div>
          <div class="menu-card-text">MATA</div>
          <div class="menu-card-desc">自动化助手 · 素材共享 · 排行榜</div>
        </a>
        <a href="public/games.html" class="menu-card">
          <div class="menu-card-icon"></div>
          <div class="menu-card-text">小游戏</div>
          <div class="menu-card-desc">娱乐模块</div>
        </a>
        <div class="menu-card" onclick="alert('纪念堂建设中')">
          <div class="menu-card-icon"></div>
          <div class="menu-card-text">纪念堂</div>
          <div class="menu-card-desc">历史记录与成就</div>
        </div>
        <a href="public/guild.html" class="menu-card">
          <div class="menu-card-icon"></div>
          <div class="menu-card-text">公会</div>
          <div class="menu-card-desc">组织与协作</div>
        </a>
      </div>
    </div>

    <!-- 登录/注册模态框 -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <div class="modal-left">
          <h3 id="modalTitle">登录</h3>
          <input type="text" id="usernameInput" class="modal-input" placeholder="用户名" autocomplete="username">
          <input type="password" id="passwordInput" class="modal-input" placeholder="密码" autocomplete="current-password">
          <label class="remember-row" for="rememberMe">
            <input type="checkbox" id="rememberMe">
            <span>记住密码（下次自动登录）</span>
          </label>
          <div class="btn-row">
            <button class="modal-btn" id="modalConfirm">确定</button>
            <button class="modal-btn toggle" id="modalToggle">切换至注册</button>
          </div>
          <div id="errorMessage" style="color:var(--rl-danger); font-size:0.9rem; margin-top:10px; text-align:center; min-height:24px;"></div>
        </div>
        <div class="modal-right">
          <h2>拉格朗日UEG公会</h2>
          <div class="intro-text">
            <p>为公会<strong>三周年</strong>钜献，本网站由会长历时一个赛季倾心搭建。</p>
            <p style="margin-top: 8px;">目前功能尚不完善，<span class="highlight">非本公会人禁止登录</span>。</p>
            <p style="margin-top: 8px;">每赛季查人，若发现不在公会中则直接强制注销账号并拉黑。</p>
          </div>
          <div class="tagline">—— 荣耀属于UEG ——</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 引入核心模块（根目录） -->
  <script src="config.js"></script>
  <script src="github-db.js"></script>

  <script>
    // ==================== 用户状态管理 ====================
    function getCurrentUser() {
      try {
        const cu = localStorage.getItem('ueg_current_user');
        return cu ? JSON.parse(cu) : null;
      } catch (e) {
        localStorage.removeItem('ueg_current_user');
        return null;
      }
    }
    function setCurrentUser(user) {
      if (user) localStorage.setItem('ueg_current_user', JSON.stringify(user));
      else localStorage.removeItem('ueg_current_user');
    }

    // 显示错误
    function showError(msg, duration = 3000) {
      const el = document.getElementById('errorMessage');
      el.textContent = msg;
      if (duration > 0) {
        clearTimeout(el._timer);
        el._timer = setTimeout(() => { el.textContent = ''; }, duration);
      }
    }

    // ==================== 记住密码 ====================
    // 勾选「记住密码」时，把账号密码存到 localStorage；下次打开登录框自动回填并自动登录。
    const REMEMBER_KEY = 'ueg_remembered_login';
    function saveRemembered(username, password) {
      try { localStorage.setItem(REMEMBER_KEY, JSON.stringify({ u: username, p: password })); }
      catch (e) { /* 隐私模式/存储满时忽略 */ }
    }
    function loadRemembered() {
      try { return JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null'); } catch (e) { return null; }
    }
    function clearRemembered() {
      try { localStorage.removeItem(REMEMBER_KEY); } catch (e) {}
    }
    // 尝试用记住的密码自动登录（会话恢复失败后的兜底）
    async function autoLoginWithRemembered() {
      const r = loadRemembered();
      if (!r || !r.u || !r.p) return false;
      if (getCurrentUser()) return true;           // 已有登录态
      const ok = await loginUser(r.u, r.p);
      if (ok) { updateUI(); return true; }
      return false;                                  // 密码已改/账号被删等，保留记录供用户改
    }

    // ==================== 登录 / 注册（GitHub 数据库版） ====================
    async function loginUser(username, password) {
      const result = await DB.login(username, password);
      if (result.code === 200) {
        setCurrentUser(result.data);
        return true;
      } else {
        showError(result.msg);
        return false;
      }
    }

    async function registerUser(username, password) {
      if (password.length < 6) {
        showError('密码长度至少6位');
        return false;
      }
      const result = await DB.register(username, password);
      if (result.code === 200) {
        // 注册返回带 session（signup 开启自动确认）时已自动登录
        if (DB.hasToken && DB.hasToken()) {
          setCurrentUser(result.data);
          updateUI();
          showError('注册成功，已自动登录', 2000);
          return true;
        }
        showError('注册成功，请登录', 2000);
        // 引导回登录模式，但保留刚注册的用户名、密码留空，
        // 不回填「记住密码」里的旧账号（否则像把注册换成了登录）。
        setTimeout(() => openModal('login', username), 500);
        return true;
      } else {
        showError(result.msg);
        return false;
      }
    }

    // ==================== UI 控制 ====================
    const userInfo = document.getElementById('userInfo');
    const btnLogout = document.getElementById('btnLogout');
    const btnProfile = document.getElementById('btnProfile');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const modalConfirm = document.getElementById('modalConfirm');
    const modalToggle = document.getElementById('modalToggle');
    const rememberMe = document.getElementById('rememberMe');
    const menuCards = document.querySelectorAll('.menu-card');

    let modalMode = 'login';
    let isProcessing = false;

    function updateUI() {
      const user = getCurrentUser();
      if (user) {
        userInfo.textContent = '';
        const strong = document.createElement('strong');
        strong.textContent = user.username;
        userInfo.appendChild(document.createTextNode('欢迎，'));
        userInfo.appendChild(strong);
        btnLogout.style.display = 'inline-block';
        btnProfile.style.display = 'inline-block';
        menuCards.forEach(c => { c.style.pointerEvents = 'auto'; c.style.opacity = '1'; });
        // 登录后先恢复可见，是否真有权限由 gateXinghebei 异步判定。
        // 它定义在后面的 script 里，首次 updateUI() 执行时还没定义 —— typeof 兜底，
        // 由后面的 IIFE 负责首次判定。
        const xcCard = document.getElementById('cardXinghebei');
        if (xcCard) xcCard.style.display = '';
        if (typeof window.gateXinghebei === 'function') window.gateXinghebei();
        if (modal.style.display === 'flex') modal.style.display = 'none';
      } else {
        userInfo.textContent = '未登录';
        btnLogout.style.display = 'none';
        btnProfile.style.display = 'none';
        menuCards.forEach(c => { c.style.pointerEvents = 'none'; c.style.opacity = '0.6'; });
        // 星河杯入口未登录直接藏：gateXinghebei 只在页面加载时跑一次，
        // 而 DB.checkSession 失效是异步的（会把登录态清掉并弹登录框），
        // 两者之间有窗口期会让「登录框弹着、卡片还挂着」。
        const xcCard = document.getElementById('cardXinghebei');
        if (xcCard) xcCard.style.display = 'none';
        if (modal.style.display !== 'flex') openModal('login');
      }
    }

    function openModal(mode, prefillUser) {
      modalMode = mode;
      if (mode === 'login') {
        modalTitle.textContent = '登录';
        modalToggle.textContent = '切换至注册';
        modalConfirm.textContent = '登录';
      } else {
        modalTitle.textContent = '注册';
        modalToggle.textContent = '切换至登录';
        modalConfirm.textContent = '注册';
      }
      // 勾选了「记住密码」就回填账号密码，方便直接点登录；否则留空。
      // 显式传入 prefillUser 时（如注册成功后引导去登录）只带用户名，
      // 不回填密码、不勾记忆 —— 否则会把记忆里的旧账号密码填进来，
      // 看起来就像「正在注册却被换成登录」。
      let fillUser = '', fillPass = '', wasChecked = false;
      if (prefillUser !== undefined && prefillUser !== null) {
        fillUser = prefillUser;
      } else {
        const remembered = mode === 'login' ? loadRemembered() : null;
        fillUser = remembered ? remembered.u : '';
        fillPass = remembered ? remembered.p : '';
        wasChecked = !!remembered;
      }
      usernameInput.value = fillUser;
      passwordInput.value = fillPass;
      if (rememberMe) rememberMe.checked = wasChecked;
      document.getElementById('errorMessage').textContent = '';
      modal.style.display = 'flex';
      setTimeout(() => usernameInput.focus(), 100);
    }

    // 切换登录/注册
    modalToggle.addEventListener('click', () => {
      if (modalMode === 'login') openModal('register');
      else openModal('login');
    });

    // 确认按钮
    modalConfirm.addEventListener('click', async () => {
      if (isProcessing) return;
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      if (!username || !password) {
        showError('用户名和密码不能为空');
        return;
      }
      isProcessing = true;
      modalConfirm.disabled = true;
      modalConfirm.textContent = modalMode === 'login' ? '登录中...' : '注册中...';
      try {
        if (modalMode === 'register') {
          await registerUser(username, password);
        } else {
          const ok = await loginUser(username, password);
          if (ok) {
            // 只有勾选「记住密码」才落盘；取消勾选则清掉已存的密码
            if (rememberMe && rememberMe.checked) saveRemembered(username, password);
            else clearRemembered();
            updateUI();
          }
        }
      } catch (err) {
        console.error(err);
        showError('操作失败，请重试');
      } finally {
        isProcessing = false;
        modalConfirm.disabled = false;
        modalConfirm.textContent = modalMode === 'login' ? '登录' : '注册';
      }
    });

    // 回车提交
    passwordInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') modalConfirm.click();
    });
    usernameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') passwordInput.focus();
    });

    // 点击背景不关闭
    modal.addEventListener('click', e => {
      if (e.target === modal) {
        if (!getCurrentUser()) showError('请先登录或注册', 2000);
        else modal.style.display = 'none';
      }
    });

    // ESC 键
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && modal.style.display === 'flex') {
        if (!getCurrentUser()) showError('请先登录或注册', 2000);
        else modal.style.display = 'none';
      }
    });

    // 未登录拦截菜单点击
    document.querySelector('.menu-options').addEventListener('click', e => {
      const card = e.target.closest('.menu-card');
      if (!card) return;
      if (!getCurrentUser()) {
        e.preventDefault();
        e.stopPropagation();
        showError('请先登录', 2000);
        if (modal.style.display !== 'flex') openModal('login');
      }
    });

    // 个人中心 / 注销
    btnProfile.addEventListener('click', () => {
      if (!getCurrentUser()) { showError('请先登录', 2000); return; }
      window.location.href = 'public/profile.html';
    });
    btnLogout.addEventListener('click', () => {
      if (window.DB && DB.logout) DB.logout(); // 清除 Token 内存/会话缓存
      setCurrentUser(null);
      // 同时清掉记住的密码：否则下次打开会自动重新登录，等于注销无效
      clearRemembered();
      updateUI();
    });

    // ==================== 初始化 ====================
    // 自动登录：github-db.js 加载时会自动 restoreSession()（access token 过期则用
    // refresh token 续期），结果挂在 window.UEG_SESSION_READY 上。
    // 之前只在 gateXinghebei 里 await 了它，恢复成功后没人调 updateUI()，
    // 于是「自动登录其实成功了，但页面还显示未登录 / 弹登录框」。
    (function bootstrap() {
      const done = function (r) {
        if (r && r.code === 200) { updateUI(); return; }
        // 用户已经在登录/注册框里动手输入了（如正在注册），
        // 就不要用「记住的密码」自动登录去覆盖他的输入。
        const typing = (usernameInput.value || passwordInput.value);
        if (typing) return;
        // 会话恢复失败：再试一次「记住的密码」自动登录，仍失败才让用户手动登录
        autoLoginWithRemembered().then(function (ok) {
          if (!ok) updateUI();
        });
      };
      if (window.UEG_SESSION_READY && typeof window.UEG_SESSION_READY.then === 'function') {
        updateUI();                                  // 先渲染，避免白屏
        window.UEG_SESSION_READY.then(done).catch(function () { done({ code: 401 }); });
      } else {
        done(null);
      }
    })();
  </script>
  <script>
    // 星河杯入口仅管理员/官员可见。
    // updateUI() 会在登录态每次变化时重调它（登录、注销、checkSession 失效）。
    window.gateXinghebei = async function gateXinghebei() {
      try {
        var card = document.getElementById('cardXinghebei');
        if (!card) return;
        var ready = window.UEG_SESSION_READY;
        if (ready) { try { await ready; } catch (e) {} }
        // 与 updateUI 同源取登录态：checkSession 判定失效时会把它清掉，
        // 这里读到 null 就藏，不再用页面加载瞬间的旧快照兜底。
        var cu = getCurrentUser();
        if (!cu) { card.style.display = 'none'; return; }
        var ok = false;
        try {
          var r = await DB.myProfile();
          if (r && r.code === 200 && r.data) {
            ok = !!(r.data.is_admin || r.data.is_owner || r.data.is_official);
          }
        } catch (e) {}
        if (!ok) ok = !!(cu.is_admin || cu.is_owner || cu.is_official);
        card.style.display = ok ? '' : 'none';
      } catch (e) {}
    };
    window.gateXinghebei();
  </script>
</body>
</html>
