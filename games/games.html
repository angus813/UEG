<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小游戏 - UEG小网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c0f;
      color: #e0e8f0;
      font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 1100px; max-width: 95%;
      background: linear-gradient(135deg, #13171c 0%, #0d1014 100%);
      border: 1px solid #2a3340;
      box-shadow: 0 0 30px rgba(0,160,255,0.1);
      position: relative;
      overflow: hidden;
      min-height: 600px;
      margin: 20px auto;
    }
    .container::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 60px; height: 60px;
      border-top: 2px solid #00c8ff; border-left: 2px solid #00c8ff;
    }
    .container::after {
      content: ''; position: absolute; bottom: 0; right: 0;
      width: 60px; height: 60px;
      border-bottom: 2px solid #00c8ff; border-right: 2px solid #00c8ff;
    }
    .menu-view {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 550px; padding: 40px 20px;
    }
    .menu-title {
      font-size: 3rem; font-weight: 700; letter-spacing: 12px;
      color: #fff; text-shadow: 0 0 20px #00a3ff;
      text-transform: uppercase; margin-bottom: 10px;
      text-align: center;
    }
    .menu-subtitle {
      font-size: 1rem; letter-spacing: 4px; color: #5e7a8c;
      margin-bottom: 60px; text-align: center;
    }
    .menu-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      justify-items: center;
    }
    .menu-card {
      width: 200px; height: 200px;
      background: rgba(20,26,33,0.9); border: 1px solid #2e3b47;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; cursor: pointer;
      transition: all 0.3s ease; position: relative;
      text-decoration: none; color: inherit;
    }
    .menu-card::before {
      content: ''; position: absolute; top: -1px; left: -1px;
      width: 15px; height: 15px;
      border-top: 2px solid #3a4a5a; border-left: 2px solid #3a4a5a;
    }
    .menu-card:hover {
      border-color: #00c8ff; box-shadow: 0 0 25px rgba(0,200,255,0.4);
      background: rgba(30,40,50,0.9); transform: translateY(-5px);
    }
    .menu-card-icon { font-size: 3rem; margin-bottom: 20px; color: #00c8ff; }
    .menu-card-text { font-size: 1.8rem; font-weight: 600; letter-spacing: 4px; color: #f0f4f8; }
    .menu-card-desc { font-size: 0.8rem; color: #7a8b9a; margin-top: 8px; text-align: center; }

    .back-link {
      margin-top: 40px;
      color: #00c8ff;
      text-decoration: none;
      font-size: 1.2rem;
      letter-spacing: 2px;
      border: 1px solid #00c8ff;
      padding: 8px 20px;
      transition: 0.3s;
    }
    .back-link:hover {
      background: rgba(0,200,255,0.1);
      box-shadow: 0 0 15px rgba(0,200,255,0.4);
    }

    /* 移动端适配 */
    @media (max-width: 600px) {
      .container { max-width: 100%; margin: 10px; min-height: auto; }
      .menu-title { font-size: 2rem; letter-spacing: 6px; }
      .menu-subtitle { font-size: 0.8rem; margin-bottom: 40px; }
      .menu-options { grid-template-columns: 1fr; gap: 20px; }
      .menu-card { width: 150px; height: 150px; }
      .menu-card-icon { font-size: 2.5rem; margin-bottom: 12px; }
      .menu-card-text { font-size: 1.4rem; }
      .menu-card-desc { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="menu-view">
      <div class="menu-title">小游戏</div>
      <div class="menu-subtitle">UNITED EARTH GOVNMENT 3 YEARS</div>
      <div class="menu-options">
        <a href="games/sc.html" class="menu-card">
          <div class="menu-card-icon">🧩</div>
          <div class="menu-card-text">色块拼图</div>
          <div class="menu-card-desc">经典色块拼图游戏</div>
        </a>
        <a href="games/weishu.html" class="menu-card">
          <div class="menu-card-icon">🛡️</div>
          <div class="menu-card-text">卫戍协议</div>
          <div class="menu-card-desc">塔防策略对战</div>
        </a>
      </div>
      <a href="index.html" class="back-link">← 返回主菜单</a>
    </div>
  </div>
</body>
</html>
