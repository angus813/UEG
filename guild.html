<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>公会 - UEG小网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c0f;
      color: #e0e8f0;
      font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    .guild-container {
      width: 100%;
      max-width: 1100px;
      background: linear-gradient(135deg, #13171c 0%, #0d1014 100%);
      border: 1px solid #2a3340;
      box-shadow: 0 0 30px rgba(0,160,255,0.1);
      position: relative;
      overflow: hidden;
      min-height: 600px;
      display: flex;
      flex-direction: row;
    }
    .guild-container::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 60px; height: 60px;
      border-top: 2px solid #00c8ff; border-left: 2px solid #00c8ff;
    }
    .guild-container::after {
      content: ''; position: absolute; bottom: 0; right: 0;
      width: 60px; height: 60px;
      border-bottom: 2px solid #00c8ff; border-right: 2px solid #00c8ff;
    }

    /* 左侧面板 */
    .left-panel {
      width: 50%;
      padding: 25px 20px;
      border-right: 1px solid #2a3340;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .guild-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 15px #00a3ff;
      margin-bottom: 10px;
    }
    .feature-cards {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .feature-card {
      background: rgba(20,26,33,0.9);
      border: 1px solid #2e3b47;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .feature-card:hover {
      border-color: #00c8ff;
      box-shadow: 0 0 20px rgba(0,200,255,0.3);
      background: rgba(30,40,50,0.9);
    }
    .feature-icon {
      font-size: 2.5rem;
      color: #00c8ff;
      width: 50px;
      text-align: center;
    }
    .feature-text h3 {
      font-size: 1.4rem;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    .feature-text p {
      font-size: 0.8rem;
      color: #7a8b9a;
    }
    .back-link {
      margin-top: auto;
      text-align: center;
      color: #00c8ff;
      text-decoration: none;
      font-size: 1rem;
      border: 1px solid #00c8ff;
      padding: 8px 15px;
      transition: 0.3s;
      letter-spacing: 2px;
    }
    .back-link:hover {
      background: rgba(0,200,255,0.1);
      box-shadow: 0 0 15px rgba(0,200,255,0.4);
    }

    /* 右侧成员列表 */
    .right-panel {
      width: 50%;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      background: rgba(10,14,19,0.6);
    }
    .members-title {
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: #ff6a00;
      border-bottom: 1px solid #2a3340;
      padding-bottom: 12px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .member-list {
      flex: 1;
      overflow-y: auto;
      padding-right: 5px;
    }
    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 10px;
      border-bottom: 1px solid #1f2a33;
      transition: background 0.2s;
    }
    .member-item:hover {
      background: rgba(255,106,0,0.05);
    }
    .member-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .member-avatar {
      width: 40px;
      height: 40px;
      background: rgba(0,200,255,0.1);
      border: 1px solid #00c8ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .member-name {
      font-weight: 600;
      font-size: 1.1rem;
    }
    .member-role {
      font-size: 0.8rem;
      color: #7a8b9a;
      margin-left: 8px;
    }
    .leader-badge {
      color: #ffaa00;
      font-weight: 700;
    }
    .delete-member-btn {
      background: transparent;
      border: 1px solid #ff4444;
      color: #ff6666;
      padding: 4px 12px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 1px;
      display: none; /* 默认隐藏，管理员可见 */
    }
    .delete-member-btn:hover {
      background: rgba(255,50,50,0.2);
      box-shadow: 0 0 10px rgba(255,0,0,0.4);
    }
    .no-members {
      text-align: center;
      color: #4a5a6a;
      margin-top: 50px;
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .guild-container {
        flex-direction: column;
        min-height: auto;
      }
      .left-panel, .right-panel {
        width: 100%;
        border-right: none;
      }
      .left-panel {
        border-bottom: 1px solid #2a3340;
      }
      .right-panel {
        max-height: 50vh;
      }
    }
  </style>
</head>
<body>
  <div class="guild-container">
    <!-- 左侧：公会功能 -->
    <div class="left-panel">
      <div class="guild-title">⚔️ 公会</div>
      <div class="feature-cards">
        <!-- 战略地图：已链接至 strategy_map.html -->
        <a href="strategy_map.html" class="feature-card" style="text-decoration:none; color:inherit;">
          <div class="feature-icon">🗺️</div>
          <div class="feature-text">
            <h3>战略地图</h3>
            <p>查看同盟战略部署</p>
          </div>
        </a>
        <div class="feature-card" onclick="alert('论坛即将开放')">
          <div class="feature-icon">💬</div>
          <div class="feature-text">
            <h3>论坛</h3>
            <p>交流战术与心得</p>
          </div>
        </div>
        <div class="feature-card" onclick="alert('配队攻略即将开放')">
          <div class="feature-icon">📋</div>
          <div class="feature-text">
            <h3>配队攻略</h3>
            <p>分享舰队配置方案</p>
          </div>
        </div>
      </div>
      <a href="index.html" class="back-link">← 返回主菜单</a>
    </div>

    <!-- 右侧：成员列表 -->
    <div class="right-panel">
      <div class="members-title">
        <span>👥</span> 公会成员
      </div>
      <div class="member-list" id="memberList">
        <div class="no-members">加载中...</div>
      </div>
    </div>
  </div>

  <script>
    const USERS_KEY = 'ueg_users';
    const CURRENT_USER_KEY = 'ueg_current_user';

    function getUsers() {
      return JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
    }
    function saveUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }
    function getCurrentUser() {
      const cu = localStorage.getItem(CURRENT_USER_KEY);
      return cu ? JSON.parse(cu) : null;
    }

    // 判断当前用户是否为管理员
    function isAdmin() {
      const user = getCurrentUser();
      return user && user.isAdmin;
    }

    // 删除用户
    window.deleteMember = function(username) {
      if (!confirm(`⚠️ 确定要永久删除用户 "${username}" 吗？此操作不可恢复！`)) return;
      if (!isAdmin()) {
        alert('您没有管理员权限');
        return;
      }
      let users = getUsers();
      users = users.filter(u => u.username !== username);
      saveUsers(users);
      // 如果被删除的是当前登录用户，则登出并跳转
      const currentUser = getCurrentUser();
      if (currentUser && currentUser.username === username) {
        localStorage.removeItem(CURRENT_USER_KEY);
        alert('你的账号已被删除，即将返回主页。');
        window.location.href = 'index.html';
        return;
      }
      renderMemberList();
    };

    // 渲染成员列表
    function renderMemberList() {
      const users = getUsers();
      const admin = isAdmin();
      const container = document.getElementById('memberList');

      if (users.length === 0) {
        container.innerHTML = '<div class="no-members">暂无成员</div>';
        return;
      }

      // 置顶 angus（会长），其余按用户名排序
      const angus = users.find(u => u.username === 'angus');
      const others = users.filter(u => u.username !== 'angus').sort((a, b) => a.username.localeCompare(b.username));
      const sorted = angus ? [angus, ...others] : others;

      let html = '';
      sorted.forEach(user => {
        const role = user.username === 'angus' ? '会长' : '成员';
        const roleClass = user.username === 'angus' ? 'leader-badge' : '';
        html += `
          <div class="member-item">
            <div class="member-info">
              <div class="member-avatar">👤</div>
              <div>
                <span class="member-name">${user.username}</span>
                <span class="member-role ${roleClass}">${role}</span>
              </div>
            </div>
            <button class="delete-member-btn" style="display:${admin ? 'block' : 'none'}" onclick="deleteMember('${user.username}')">注销</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // 初始加载
    renderMemberList();
  </script>
</body>
</html>
