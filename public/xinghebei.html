<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>星河杯 - 指标选择</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; color: #e0e8f0;
      font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      margin: 0; padding: 10px;
    }
    .container {
      width: 100%; max-width: 1100px;
      background: rgba(19,23,28,0.66); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid #2a3340;
      box-shadow: 0 0 30px rgba(0,160,255,0.1);
      position: relative; overflow: hidden; min-height: 600px; margin: 0 auto;
    }
    .container::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 60px; height: 60px;
      border-top: 2px solid #00c8ff; border-left: 2px solid #00c8ff;
    }
    .container::after {
      content: ''; position: absolute; bottom: 0; right: 0;
      width: 60px; height: 60px;
      border-bottom: 2px solid #00c8ff; border-right: 2px solid #00c8ff;
    }

    /* 头部 */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; border-bottom: 1px solid #2a3340;
      background: rgba(20,25,30,0.8); flex-wrap: wrap; gap: 10px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .back-btn {
      background: transparent; border: 1px solid #3a5060;
      color: #b0c7d6; padding: 6px 12px; font-family: inherit;
      font-size: 0.9rem; letter-spacing: 2px; cursor: pointer;
      transition: all 0.2s; text-decoration: none; white-space: nowrap;
    }
    .back-btn:hover { border-color: #00c8ff; color: #fff; }
    .title {
      font-size: 2rem; font-weight: 700; letter-spacing: 6px;
      color: #fff; text-shadow: 0 0 15px #00a3ff; text-transform: uppercase;
    }
    .subtitle { display: block; font-size: 0.7rem; letter-spacing: 3px; color: #5e7a8c; }

    .header-center {
      display: flex; align-items: center;
    }
    .crisis-level { display: flex; align-items: baseline; gap: 10px; }
    .level-label { font-size: 1rem; color: #7a8b9a; letter-spacing: 1px; }
    .level-value {
      font-size: 2.8rem; font-weight: 700; color: #ff6a00;
      text-shadow: 0 0 15px #ff6a00; line-height: 1;
    }

    .header-right {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .btn-action {
      background: transparent; border: 1px solid #3a5060;
      color: #b0c7d6; padding: 8px 14px; font-family: inherit;
      font-size: 0.9rem; letter-spacing: 1px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-action:hover { border-color: #00c8ff; color: #fff; }
    .btn-leaderboard {
      background: transparent; border: 1px solid #ff6a00;
      color: #ff6a00; padding: 8px 14px; font-family: inherit;
      font-size: 0.9rem; letter-spacing: 1px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-leaderboard:hover { background: rgba(255,106,0,0.2); }

    /* 主内容区 */
    .main-content {
      display: flex; height: 500px;
    }

    .contracts-section {
      flex: 2; padding: 15px; display: flex; flex-direction: row;
      overflow: hidden; border-right: 1px solid #2a3340; gap: 15px;
    }

    .tabs {
      display: flex; flex-direction: column; gap: 6px;
      width: 100px; flex-shrink: 0;
    }
    .tab {
      background: transparent; border: 1px solid #2a3340;
      color: #8a9aa8; padding: 8px 10px; font-family: inherit;
      font-size: 0.9rem; letter-spacing: 1px; cursor: pointer;
      transition: 0.2s; text-align: left;
      display: flex; flex-direction: column; align-items: stretch;
    }
    .tab-text { margin-bottom: 4px; font-weight: 600; }
    .tab-progress { height: 3px; background: #1f2a33; border-radius: 2px; overflow: hidden; }
    .tab-progress-fill { height: 100%; background: #ff9999; width: 0%; transition: width 0.3s; }
    .tab.active, .tab:hover {
      border-color: #00c8ff; color: #00c8ff;
      background: rgba(0,200,255,0.05);
    }

    .grid-scroll { flex: 1; overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
    .contract-grid { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 15px; align-items: flex-start; }
    .series-column { display: flex; flex-direction: column; align-items: center; gap: 0; flex-shrink: 0; }

    .contract-card {
      width: 120px; height: 120px; padding: 8px;
      display: flex; flex-direction: row; align-items: center;
      background: rgba(20,26,33,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid #2e3b47;
      cursor: pointer; transition: all 0.2s; position: relative;
    }
    .contract-card::before {
      content: ''; position: absolute; top: -1px; left: -1px;
      width: 10px; height: 10px;
      border-top: 2px solid #3a4a5a; border-left: 2px solid #3a4a5a;
    }
    .contract-card:hover { border-color: #5e7a8c; background: rgba(30,40,50,0.9); }
    .contract-card.selected {
      border-color: #ff6a00; box-shadow: 0 0 12px rgba(255,106,0,0.4);
      background: rgba(40,20,10,0.8); animation: pulse 0.35s ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .card-level-badge {
      width: 24px; height: 24px; background: #1f2a33;
      color: #ff6a00; font-weight: 700; font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      margin-right: 8px; flex-shrink: 0; border-radius: 2px;
    }
    .card-content { overflow: hidden; }
    .contract-name { font-size: 0.85rem; font-weight: 600; color: #f0f4f8; margin-bottom: 3px; }
    .contract-desc { font-size: 0.65rem; color: #7a8b9a; line-height: 1.2; }
    .series-connector { width: 2px; height: 18px; background: #ff6a00; opacity: 0.8; }

    /* 右侧面板 */
    .selected-panel {
      flex: 1; padding: 15px; background: rgba(10,14,19,0.7);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .panel-title {
      font-size: 1.2rem; letter-spacing: 2px; color: #00c8ff;
      border-bottom: 1px solid #2a3340; padding-bottom: 10px; margin-bottom: 12px;
    }
    .selected-list { flex: 1; }
    .placeholder { color: #4a5a6a; text-align: center; margin-top: 40px; }

    .selected-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 4px; border-bottom: 1px solid #1f2a33;
      animation: itemPulse 0.4s ease-out;
    }
    .selected-item.active {
      background: rgba(255,106,0,0.15);
      box-shadow: inset 0 0 6px rgba(255,106,0,0.4);
      border-left: 3px solid #ff6a00;
    }
    .selected-info { flex: 1; }
    .selected-name { font-weight: 600; color: #f0f4f8; font-size: 0.9rem; margin-bottom: 2px; }
    .selected-desc-big { font-size: 0.95rem; color: #d0dae4; }
    .remove-btn {
      background: none; border: none; color: #ff5a5a; font-size: 1.1rem;
      cursor: pointer; margin-left: 8px;
    }

    .panel-summary {
      border-top: 1px solid #2a3340; padding-top: 10px;
      display: flex; justify-content: space-between; color: #8a9aa8; font-size: 0.9rem;
    }

    .record-badge {
      position: absolute; bottom: 10px; right: 10px;
      background: rgba(10,14,19,0.9); border: 1px solid #ff6a00;
      padding: 5px 12px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 0 10px rgba(255,106,0,0.3); z-index: 10;
    }
    .record-label { font-size: 0.8rem; color: #b0c7d6; }
    .record-value {
      font-size: 1.4rem; font-weight: 700; color: #ff6a00;
      text-shadow: 0 0 8px #ff6a00;
    }

    /* 弹窗 */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: #13171c; border: 1px solid #2a3340; padding: 25px;
      width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 0 30px rgba(0,160,255,0.3);
    }
    .modal-content h3 { margin-bottom: 15px; color: #ff6a00; letter-spacing: 2px; text-align: center; }
    .modal-input {
      width: 100%; background: #1a1e24; border: 1px solid #3a5060;
      color: #fff; padding: 10px; margin-bottom: 12px; font-family: inherit;
      resize: vertical; min-height: 80px;
    }
    .modal-btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .modal-btn {
      background: #00c8ff; border: none; color: #000; padding: 10px 18px;
      cursor: pointer; font-weight: bold; font-family: inherit; letter-spacing: 1px;
    }
    .copy-btn { background: #ffaa00; }
    .copy-btn:hover { background: #ff8c00; }

    /* 移动端增强 */
    @media (max-width: 768px) {
      body { padding: 5px; }
      .container { min-height: auto; }
      .header { padding: 10px; }
      .title { font-size: 1.6rem; }
      .level-value { font-size: 2.2rem; }
      .main-content { flex-direction: column; height: auto; }
      .contracts-section { flex: none; flex-direction: column; border-right: none; padding: 10px; gap: 8px; }
      .tabs { flex-direction: row; width: 100%; overflow-x: auto; padding-bottom: 5px; }
      .tab { white-space: nowrap; padding: 6px 12px; }
      .grid-scroll { max-height: 50vh; }
      .selected-panel { flex: none; max-height: 35vh; border-top: 1px solid #2a3340; }
      .btn-action, .btn-leaderboard { padding: 6px 10px; font-size: 0.8rem; }
      .record-badge { bottom: 8px; right: 8px; padding: 4px 10px; }
    }

    @media (max-width: 400px) {
      .contract-card { width: 100px; height: 100px; padding: 6px; }
      .card-level-badge { width: 20px; height: 20px; font-size: 0.7rem; margin-right: 6px; }
      .contract-name { font-size: 0.7rem; }
      .contract-desc { font-size: 0.6rem; }
    }
  </style>
<script src="dyson-bg.js"></script>

<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <a href="../index.html" class="back-btn">← 返回</a>
        <div>
          <h1 class="title">星河杯</h1>
          <span class="subtitle">UNITED EARTH GOVNMENT 3 YEARS</span>
        </div>
      </div>
      <div class="header-center">
        <div class="crisis-level">
          <span class="level-label">指标等级</span>
          <span class="level-value" id="crisisLevel">0</span>
        </div>
      </div>
      <div class="header-right">
        <button class="btn-action" id="shareBtn">📤 分享</button>
        <button class="btn-action" id="importBtn">📥 导入</button>
        <button class="btn-action" id="resetBtn">重置</button>
        <button class="btn-leaderboard" id="leaderboardBtn">🏆</button>
      </div>
    </header>

    <main class="main-content">
      <section class="contracts-section">
        <nav class="tabs" id="tabNav">
          <button class="tab active" data-category="改写">改写</button>
          <button class="tab" data-category="缺失">缺失</button>
          <button class="tab" data-category="重压">重压</button>
          <button class="tab" data-category="应变">应变</button>
        </nav>
        <div class="grid-scroll">
          <div class="contract-grid" id="contractGrid"></div>
        </div>
      </section>

      <aside class="selected-panel">
        <h2 class="panel-title">已选指标</h2>
        <div class="selected-list" id="selectedList">
          <p class="placeholder">未选择任何指标</p>
        </div>
        <div class="panel-summary">
          <span>总数：<strong id="selectedCount">0</strong></span>
          <span>等级：<strong id="selectedTotalLevel">0</strong></span>
        </div>
      </aside>
    </main>

    <div class="record-badge">
      <span class="record-label">最高记录</span>
      <span class="record-value" id="recordValue">0</span>
    </div>

    <!-- 分享弹窗 -->
    <div class="modal" id="shareModal">
      <div class="modal-content">
        <h3>分享指标</h3>
        <textarea id="shareCode" class="modal-input" rows="3" readonly></textarea>
        <div class="modal-btn-row">
          <button class="modal-btn copy-btn" id="copyBtn">复制码</button>
          <button class="modal-btn" onclick="closeShareModal()">关闭</button>
        </div>
      </div>
    </div>

    <!-- 导入弹窗 -->
    <div class="modal" id="importModal">
      <div class="modal-content">
        <h3>导入指标</h3>
        <textarea id="importCode" class="modal-input" rows="3" placeholder="粘贴指标码..."></textarea>
        <div class="modal-btn-row">
          <button class="modal-btn" id="confirmImport">导入</button>
          <button class="modal-btn" onclick="closeImportModal()" style="background:#3a5060; color:#fff;">取消</button>
        </div>
      </div>
    </div>

    <!-- 排行榜弹窗 -->
    <div class="modal" id="leaderboardModal">
      <div class="modal-content">
        <h3>🏆 排行榜</h3>
        <div id="leaderboardContent" style="max-height: 300px; overflow-y: auto;"></div>
        <div class="modal-btn-row" style="margin-top: 15px;">
          <button class="modal-btn" onclick="closeLeaderboard()">关闭</button>
        </div>
      </div>
    </div>
  </div>

      { id: 'str_spear_2b', category: '应变', name: '大矛II', level: 2, desc: 'M，A系统原装，C系统禁用', series: 'spear' },
      { id: 'str_spear_3', category: '应变', name: '大矛III', level: 3, desc: '白板配置', series: 'spear' },
      { id: 'str_storm_1', category: '应变', name: '风暴I', level: 1, desc: 'B，D系统禁用', series: 'storm' },
      { id: 'str_storm_2', category: '应变', name: '风暴II', level: 2, desc: 'B，C，D系统禁用', series: 'storm' },
      { id: 'str_storm_3', category: '应变', name: '风暴III', level: 3, desc: '白板配置', series: 'storm' },
      { id: 'str_bigshield_1', category: '应变', name: '大盾I', level: 1, desc: 'C系统禁用', series: 'big_shield' },
      { id: 'str_bigshield_2', category: '应变', name: '大盾II', level: 2, desc: 'B，C系统禁用', series: 'big_shield' },
      { id: 'str_bigshield_3', category: '应变', name: '大盾III', level: 3, desc: '白板配置', series: 'big_shield' },
      { id: 'str_st59_1', category: '应变', name: 'st59I', level: 1, desc: 'B，C系统禁用', series: 'st59' },
      { id: 'str_st59_2', category: '应变', name: 'st59II', level: 2, desc: '白板配置', series: 'st59' },
      { id: 'str_support_2', category: '应变', name: '支援舰II', level: 2, desc: '白板配置', series: 'support_ship' }
    ];

    // ========== 核心逻辑 ==========
    let currentCategory = '改写';
    let selectedContracts = new Set();
    let lastSelectedId = null;

    const tabNav = document.getElementById('tabNav');
    const contractGrid = document.getElementById('contractGrid');
    const selectedList = document.getElementById('selectedList');
    const crisisLevelEl = document.getElementById('crisisLevel');
    const selectedCountEl = document.getElementById('selectedCount');
    const selectedTotalLevelEl = document.getElementById('selectedTotalLevel');
    const resetBtn = document.getElementById('resetBtn');
    const recordValueEl = document.getElementById('recordValue');

    // ---------- 用户及记录（从 Supabase） ----------
    function getCurrentUser() {
      const cu = localStorage.getItem('ueg_current_user');
      return cu ? JSON.parse(cu) : null;
    }

    async function loadHighestRecord() {
      const user = getCurrentUser();
      if (!user) {
        recordValueEl.textContent = '0';
        return;
      }
      const { data, error } = await supabase
        .from('users')
        .select('highest_record')
        .eq('username', user.username)
        .maybeSingle();
      if (error) {
        console.error('读取最高记录失败:', error);
        recordValueEl.textContent = '0';
        return;
      }
      recordValueEl.textContent = data?.highest_record ?? 0;
    }

    // ---------- 排行榜 ----------
    async function loadLeaderboard() {
      const { data: users, error } = await supabase
        .from('users')
        .select('username, highest_record')
        .order('highest_record', { ascending: false })
        .limit(10);

      if (error) {
        alert('加载排行榜失败: ' + error.message);
        return;
      }

      let msg = '🏆 排行榜\n';
      if (!users || users.length === 0) {
        msg += '暂无数据';
      } else {
        users.forEach((u, i) => {
          msg += `${i+1}. ${u.username} - ${u.highest_record || 0}\n`;
        });
      }
      alert(msg); // 简单提示，也可改为弹窗展示
    }

    // ---------- 合约交互（保持不变） ----------
    function initTabs() {
      document.querySelectorAll('.tab').forEach(tab => {
        const text = tab.textContent.trim();
        tab.innerHTML = `<span class="tab-text">${text}</span><div class="tab-progress"><div class="tab-progress-fill" style="width:0%"></div></div>`;
      });
    }

    function toggleContract(id) {
      const contract = contracts.find(c => c.id === id);
      if (!contract) return;
      if (selectedContracts.has(id)) {
        selectedContracts.delete(id);
        if (lastSelectedId === id) lastSelectedId = null;
      } else {
        const sameSeriesIds = Array.from(selectedContracts).filter(sid => {
          const s = contracts.find(c => c.id === sid);
          return s && s.category === contract.category && s.series === contract.series;
        });
        sameSeriesIds.forEach(sid => { selectedContracts.delete(sid); if (lastSelectedId === sid) lastSelectedId = null; });
        selectedContracts.add(id);
        lastSelectedId = id;
      }
      updateUI();
    }

    function toggleFillCategory(category) {
      const catContracts = contracts.filter(c => c.category === category);
      const seriesMax = {};
      catContracts.forEach(c => { if (!seriesMax[c.series] || c.level > seriesMax[c.series].level) seriesMax[c.series] = c; });
      const seriesNames = Object.keys(seriesMax);
      let isFull = seriesNames.every(s => selectedContracts.has(seriesMax[s].id));
      const toRemove = [];
      selectedContracts.forEach(id => { const con = contracts.find(c => c.id === id); if (con && con.category === category) toRemove.push(id); });
      toRemove.forEach(id => { selectedContracts.delete(id); if (lastSelectedId === id) lastSelectedId = null; });
      if (!isFull) {
        const sorted = seriesNames.sort();
        sorted.forEach(s => selectedContracts.add(seriesMax[s].id));
        lastSelectedId = sorted.length > 0 ? seriesMax[sorted[0]].id : null;
      } else { lastSelectedId = null; }
      updateUI();
    }

    function renderContracts() {
      const filtered = contracts.filter(c => c.category === currentCategory);
      const seriesMap = new Map();
      filtered.forEach(c => { if (!seriesMap.has(c.series)) seriesMap.set(c.series, []); seriesMap.get(c.series).push(c); });
      for (let list of seriesMap.values()) list.sort((a,b) => a.level - b.level);
      let html = '';
      for (let [series, list] of seriesMap) {
        html += '<div class="series-column">';
        for (let i = 0; i < list.length; i++) {
          const c = list[i];
          if (i > 0) html += '<div class="series-connector"></div>';
          html += `<div class="contract-card ${selectedContracts.has(c.id) ? 'selected' : ''}" data-id="${c.id}">
            <div class="card-level-badge">${c.level}</div>
            <div class="card-content"><div class="contract-name">${c.name}</div><div class="contract-desc">${c.desc}</div></div>
          </div>`;
        }
        html += '</div>';
      }
      contractGrid.innerHTML = html;
      document.querySelectorAll('.contract-card').forEach(card => card.addEventListener('click', () => toggleContract(card.dataset.id)));
    }

    function updateTabProgress() {
      const categoryMaxLevel = {};
      contracts.forEach(c => { if (!categoryMaxLevel[c.category]) categoryMaxLevel[c.category] = {}; if (!categoryMaxLevel[c.category][c.series] || c.level > categoryMaxLevel[c.category][c.series]) categoryMaxLevel[c.category][c.series] = c.level; });
      const categorySelectedLevel = {};
      selectedContracts.forEach(id => { const c = contracts.find(con => con.id === id); if (c) { if (!categorySelectedLevel[c.category]) categorySelectedLevel[c.category] = {}; categorySelectedLevel[c.category][c.series] = c.level; } });
      document.querySelectorAll('.tab').forEach(tab => {
        const cat = tab.dataset.category;
        const map = categoryMaxLevel[cat] || {};
        const names = Object.keys(map);
        if (names.length === 0) return;
        let total = 0;
        names.forEach(s => { const max = map[s]; const sel = (categorySelectedLevel[cat] && categorySelectedLevel[cat][s]) || 0; total += Math.min(sel/max, 1); });
        const pct = (total / names.length) * 100;
        const fill = tab.querySelector('.tab-progress-fill');
        if (fill) fill.style.width = pct + '%';
      });
    }

    function updateUI() {
      document.querySelectorAll('.contract-card').forEach(card => card.classList.toggle('selected', selectedContracts.has(card.dataset.id)));
      const selectedArray = Array.from(selectedContracts).map(id => contracts.find(c => c.id === id)).filter(Boolean);
      if (selectedArray.length === 0) {
        selectedList.innerHTML = '<p class="placeholder">未选择任何指标</p>';
        lastSelectedId = null;
      } else {
        selectedList.innerHTML = selectedArray.map(c => `<div class="selected-item${c.id === lastSelectedId ? ' active' : ''}" data-id="${c.id}"><div class="selected-info"><div class="selected-name">${c.name}</div><div class="selected-desc-big">${c.desc}</div></div><button class="remove-btn" data-id="${c.id}">✕</button></div>`).join('');
        document.querySelectorAll('.remove-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); const id = btn.dataset.id; if (lastSelectedId === id) lastSelectedId = null; selectedContracts.delete(id); updateUI(); }));
      }
      const totalLevel = selectedArray.reduce((sum, c) => sum + c.level, 0);
      crisisLevelEl.textContent = totalLevel;
      selectedCountEl.textContent = selectedArray.length;
      selectedTotalLevelEl.textContent = totalLevel;
      updateTabProgress();
      loadHighestRecord();
    }

    // ---------- 分享导入 ----------
    function generateShareCode() {
      const ids = Array.from(selectedContracts);
      return ids.length ? btoa(JSON.stringify(ids)) : null;
    }
    function importFromCode(code) {
      try {
        const ids = JSON.parse(atob(code));
        if (!Array.isArray(ids)) throw new Error();
        selectedContracts.clear();
        lastSelectedId = null;
        ids.forEach(id => {
          const contract = contracts.find(c => c.id === id);
          if (!contract) return;
          const sameSeriesIds = Array.from(selectedContracts).filter(sid => {
            const s = contracts.find(c => c.id === sid);
            return s && s.category === contract.category && s.series === contract.series;
          });
          sameSeriesIds.forEach(sid => selectedContracts.delete(sid));
          selectedContracts.add(id);
        });
        updateUI();
        return true;
      } catch (e) {
        alert('指标码无效，请检查是否完整复制。');
        return false;
      }
    }

    document.getElementById('shareBtn').addEventListener('click', () => {
      const code = generateShareCode();
      if (!code) { alert('请先选择至少一个指标'); return; }
      document.getElementById('shareCode').value = code;
      document.getElementById('shareModal').style.display = 'flex';
    });
    document.getElementById('copyBtn').addEventListener('click', () => {
      const ta = document.getElementById('shareCode');
      ta.select(); document.execCommand('copy'); alert('已复制！');
    });
    window.closeShareModal = () => document.getElementById('shareModal').style.display = 'none';

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importCode').value = '';
      document.getElementById('importModal').style.display = 'flex';
    });
    window.closeImportModal = () => document.getElementById('importModal').style.display = 'none';
    document.getElementById('confirmImport').addEventListener('click', () => {
      const code = document.getElementById('importCode').value.trim();
      if (code && importFromCode(code)) closeImportModal();
    });

    // ---------- 排行榜按钮（改为弹窗展示） ----------
    document.getElementById('leaderboardBtn').addEventListener('click', async () => {
      const { data: users, error } = await supabase
        .from('users')
        .select('username, highest_record')
        .order('highest_record', { ascending: false })
        .limit(10);

      if (error) {
        alert('加载排行榜失败: ' + error.message);
        return;
      }

      const content = document.getElementById('leaderboardContent');
      if (!users || users.length === 0) {
        content.innerHTML = '<p style="color:#7a8b9a; text-align:center;">暂无数据</p>';
      } else {
        let html = '<table style="width:100%; color:#d0dae4; border-collapse:collapse;">';
        html += '<tr><th style="padding:6px 4px;border-bottom:1px solid #2a3340;">#</th><th style="padding:6px 4px;border-bottom:1px solid #2a3340;">用户名</th><th style="padding:6px 4px;border-bottom:1px solid #2a3340;text-align:right;">记录</th></tr>';
        users.forEach((u, i) => {
          html += `<tr><td style="padding:6px 4px;border-bottom:1px solid #1f2a33;">${i+1}</td><td style="padding:6px 4px;border-bottom:1px solid #1f2a33;">${u.username}</td><td style="padding:6px 4px;border-bottom:1px solid #1f2a33;text-align:right;">${u.highest_record || 0}</td></tr>`;
        });
        html += '</table>';
        content.innerHTML = html;
      }
      document.getElementById('leaderboardModal').style.display = 'flex';
    });
    window.closeLeaderboard = () => document.getElementById('leaderboardModal').style.display = 'none';

    // ---------- 标签切换 ----------
    tabNav.addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCategory = tab.dataset.category;
      renderContracts();
    });
    tabNav.addEventListener('dblclick', (e) => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      toggleFillCategory(tab.dataset.category);
    });
    resetBtn.addEventListener('click', () => { selectedContracts.clear(); lastSelectedId = null; updateUI(); });

    // ---------- 初始化 ----------
    (function init() {
      initTabs();
      renderContracts();
      updateUI();
    })();
  </script>
