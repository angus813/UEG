<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>个人中心 - UEG小网站</title>
  <link rel="stylesheet" href="rhine-fonts.css" media="print" onload="this.media='all'"> <!-- MiSans（异步加载，不阻塞首屏） -->
  <noscript><link rel="stylesheet" href="rhine-fonts.css"></noscript> <!-- MiSans webfont -->
  <link rel="stylesheet" href="admin.css"> <!-- 基础布局（先于设计系统） -->
  <link rel="stylesheet" href="rhine.css"> <!-- Rhine Lab Archive 设计系统 -->
  <link rel="stylesheet" href="rhine-motion.css"> <!-- 动效层 -->
  <!-- 视觉统一由 rhine.css 设计系统提供 -->
  <script src="rhine-motion.js"></script>
<script src="bgm.js?v=20261004i"></script>
</head>
<body>
  <div class="profile-page">
    <div class="profile-header">
      <!-- iOS Safari 不响应隐藏 input 的 click()，改为用 label 包住头像与提示文字 -->
      <label class="avatar-picker" for="avatarFile" id="avatarLabel">
        <input type="file" id="avatarFile" accept="image/*" class="avatar-file-input">
        <span class="profile-avatar" id="avatarBox" title="点击更换头像" style="cursor:pointer;"></span>
        <span class="avatar-hint">点头像可更换（jpg/png，建议方形）</span>
      </label>
      <div class="profile-username" id="profileUsername">用户名</div>
      <div class="profile-mark"></div>
    </div>

    <div class="info-card">
      <div class="info-row">
        <span class="info-label">星河杯最高记录</span>
        <span class="info-value" id="profileRecord">0</span>
      </div>
    </div>

    <!-- 管理员入口（动态显示） -->
    <div class="admin-zone" id="adminEntry" style="display: none;">
      <a href="admin.html" class="btn-admin">管理用户</a>
    </div>

    <!-- 修改用户名 -->
    <div class="password-section">
      <button class="btn-toggle-pw" id="btnToggleUsername">修改用户名</button>
      <div class="pw-form" id="usernameForm" style="display:none">
        <input type="text" id="newUsername" placeholder="新用户名（2-20位中文/字母/数字/下划线）" maxlength="20">
        <div class="form-actions">
          <button class="btn-save" id="btnSaveUsername">保存</button>
          <button class="btn-cancel" id="btnCancelUsername">取消</button>
        </div>
      </div>
    </div>

    <!-- 修改密码 -->
    <div class="password-section">
      <button class="btn-toggle-pw" id="btnTogglePassword">修改密码</button>
      <div class="pw-form" id="pwForm" style="display:none">
        <input type="password" id="oldPassword" placeholder="旧密码">
        <input type="password" id="newPassword" placeholder="新密码">
        <input type="password" id="confirmPassword" placeholder="确认新密码">
        <div class="form-actions">
          <button class="btn-save" id="btnSavePassword">保存</button>
          <button class="btn-cancel" id="btnCancelPassword">取消</button>
        </div>
      </div>
    </div>

    <!-- 注销账号 -->
    <div class="danger-zone">
      <button class="btn-delete" id="btnDeleteAccount">彻底注销账号</button>
    </div>

    <a href="../index.html" class="back-link">← 返回主页</a>
  </div>

  <!-- 引入 Supabase 客户端 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="../github-db.js"></script>
  <script src="supabase-client.js"></script>

  <script>
    // ==================== 工具函数 ====================
    // 获取当前登录用户（从 localStorage）
    function getCurrentUser() {
      const cu = localStorage.getItem('ueg_current_user');
      if (!cu) return null;
      try { return JSON.parse(cu); } catch (e) { return null; }
    }

    // 设置当前用户（存入 localStorage）
    function setCurrentUser(user) {
      if (user) {
        localStorage.setItem('ueg_current_user', JSON.stringify(user));
      } else {
        localStorage.removeItem('ueg_current_user');
      }
    }

    // ==================== 加载个人资料 ====================
    function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function loadProfile() {
      const currentUser = getCurrentUser();
      if (!currentUser) {
        alert('请先登录');
        window.location.href = '../index.html';
        return;
      }

      // 从 Supabase 读取最新用户数据
      const { data: user, error } = await supabase
        .from('users')
        .select('username, highest_record, is_admin, is_owner, is_official, avatar_url')
        .eq('username', currentUser.username)
        .maybeSingle();

      if (error || !user) {
        alert('获取用户数据失败，请重新登录');
        window.location.href = '../index.html';
        return;
      }

      document.getElementById('profileUsername').textContent = user.username;
      document.getElementById('profileRecord').textContent = user.highest_record || 0;
      var _pn = document.getElementById('profileUsername');
      if (user.is_owner) _pn.insertAdjacentHTML('beforeend', ' 【会长】');
      else if (user.is_official) _pn.insertAdjacentHTML('beforeend', ' 【官员】');
      var _av = document.getElementById('avatarBox');
      if (user.avatar_url && _av) {
        _av.innerHTML = '<img src="' + esc(user.avatar_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
      }

      // 显示管理员入口
      if (user.is_admin) {
        document.getElementById('adminEntry').style.display = 'block';
      }

      // 同步更新 localStorage：键名用全站一致的 snake_case，且在原对象上合并更新 ——
      // 此前整对象替换成 camelCase 三字段，会把 is_admin/is_owner/is_official 等抹掉
      const prevUser = JSON.parse(localStorage.getItem('ueg_current_user') || '{}');
      setCurrentUser(Object.assign({}, prevUser, {
        username: user.username,
        is_admin: user.is_admin || false,
        highest_record: user.highest_record || 0
      }));
    }

    // ==================== 修改用户名 ====================
    document.getElementById('btnToggleUsername').addEventListener('click', () => {
      document.getElementById('usernameForm').style.display = 'flex';
      document.getElementById('newUsername').focus();
    });
    document.getElementById('btnCancelUsername').addEventListener('click', () => {
      document.getElementById('usernameForm').style.display = 'none';
      document.getElementById('newUsername').value = '';
    });
    document.getElementById('btnSaveUsername').addEventListener('click', async () => {
      const name = document.getElementById('newUsername').value.trim();
      if (!name) { alert('请输入新用户名'); return; }
      const cu = getCurrentUser();
      if (!cu) { alert('请先登录'); return; }
      if (name === cu.username) { alert('与当前用户名相同'); return; }
      if (!window.DB || typeof DB.changeUsername !== 'function') {
        alert('数据层未加载：请强制刷新后重试'); return;
      }
      const save = document.getElementById('btnSaveUsername');
      save.disabled = true;
      try {
        const r = await DB.changeUsername(name);
        if (r.code !== 200) { alert('改名失败：' + (r.msg || '')); return; }
        alert('改名成功！当前用户名：' + r.data.username +
              '\n之前发的帖子和上传记录已同步改名，新内容从现在起归属新名字。');
        location.reload();
      } finally {
        save.disabled = false;
      }
    });

    // ==================== 修改密码 ====================
    async function changePassword(oldPw, newPw) {
      const currentUser = getCurrentUser();
      if (!currentUser) return false;

      // 由后端校验旧密码（bcrypt 哈希），不再经前端读取明文密码
      const r = await DB.changePassword(currentUser.username, oldPw, newPw);
      if (r.code !== 200) {
        alert(r.msg);
        return false;
      }

      // 改密后 GoTrue 旧 access_token 立即失效，DB.changePassword 内部已清除会话。
      // 此处绝不能再写回用户对象，否则会出现「有用户信息但无 token」的半登录状态，
      // 后续所有请求 401。统一清除，引导重新登录。
      setCurrentUser(null);
      return true;
    }

    // ==================== 注销账号 ====================
    async function deleteAccount() {
      const currentUser = getCurrentUser();
      if (!currentUser) return;

      const r = await DB.deleteUser(currentUser.username);
      if (r.code !== 200) {
        alert('注销失败: ' + r.msg);
        return;
      }

      // 清除本地登录状态并跳转
      DB.logout();
      setCurrentUser(null);
      alert('账号已注销');
      window.location.href = '../index.html';
    }

    // ==================== 事件绑定 ====================
    document.getElementById('btnTogglePassword').addEventListener('click', () => {
      document.getElementById('pwForm').style.display = 'flex';
    });

    document.getElementById('btnCancelPassword').addEventListener('click', () => {
      document.getElementById('pwForm').style.display = 'none';
      document.getElementById('oldPassword').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmPassword').value = '';
    });

    document.getElementById('btnSavePassword').addEventListener('click', async () => {
      const oldPw = document.getElementById('oldPassword').value;
      const newPw = document.getElementById('newPassword').value;
      const confirmPw = document.getElementById('confirmPassword').value;

      if (!oldPw || !newPw || !confirmPw) {
        alert('请填写完整');
        return;
      }
      if (newPw !== confirmPw) {
        alert('两次输入的新密码不一致');
        return;
      }

      const success = await changePassword(oldPw, newPw);
      if (success) {
        alert('密码修改成功！出于安全考虑，请使用新密码重新登录。');
        try { localStorage.removeItem('ueg_current_user'); localStorage.removeItem('ueg_token'); } catch (e) {}
        location.href = '../index.html';
        return;
      }
    });

    document.getElementById('btnDeleteAccount').addEventListener('click', () => {
      if (!confirm('确定要彻底删除你的账号吗？此操作不可恢复！')) return;
      deleteAccount();
    });

    // ==================== 头像上传 ====================
    (function initAvatar() {
      var box = document.getElementById('avatarBox');
      var fi = document.getElementById('avatarFile');
      var label = document.getElementById('avatarLabel');
      if (!box || !fi) return;
      // 优先用 label[for] 触发（iOS Safari 只认这个）。
      // label 已把头像和提示文字都包住，点哪都能换。
      // 桌面端也保留 box 的 click 兜底，防止 label 渲染异常时无入口。
      if (!label) {
        box.addEventListener('click', function () { fi.click(); });
      }
      fi.addEventListener('change', async function () {
        var f = fi.files && fi.files[0];
        // 先把 File 引用取出来再清空 input：iOS 上 fi.files 是活引用，
        // 先清空会让同一个 File 的 name/type/size 失效，导致上传被判为非图片。
        fi.value = '';
        if (!f) return;
        if (!/^image\//.test(f.type)) { alert('请选择图片文件'); return; }
        if (f.size > 4 * 1024 * 1024) { alert('图片请小于 4MB'); return; }
        var cu = getCurrentUser();
        if (!cu) { alert('请先登录'); return; }
        var ext = (f.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
        var path = DB.folderOf(cu.username) + '/avatar_' + Date.now() + '.' + ext;
        var up = await DB.upload('avatars', path, f, f.type);
        if (up.code !== 200) { alert('上传失败：' + (up.msg || '')); return; }
        var w = await DB.updateMyProfile({ avatar_url: up.url });
        if (w.code !== 200) { alert('保存失败：' + (w.msg || '')); return; }
        box.innerHTML = '<img src="' + esc(up.url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
        alert('头像已更新');
      });
    })();

    // ==================== 初始化 ====================
    // 等会话恢复完成再拉数据：access token 1 小时过期，隔一阵回来
    // 首屏若带过期 token 会 401 被误判为未登录/无权限（forum/mata 等页都已等）
    (async function () {
      try { if (window.UEG_SESSION_READY) await window.UEG_SESSION_READY; } catch (e) {}
      loadProfile();
    })();
  </script>
</body>
</html>
