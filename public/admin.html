<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - UEG小网站</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    body {
      background: transparent;
      color: #e0e8f0;
      font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .admin-container {
      width: 900px;
      max-width: 95%;
      background: rgba(19,23,28,0.66); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid #2a3340;
      box-shadow: 0 0 30px rgba(0,160,255,0.1);
      position: relative;
      overflow: hidden;
      padding: 30px 20px;
      margin: 20px auto;
    }
    .admin-container::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 60px; height: 60px;
      border-top: 2px solid #00c8ff; border-left: 2px solid #00c8ff;
    }
    .admin-container::after {
      content: ''; position: absolute; bottom: 0; right: 0;
      width: 60px; height: 60px;
      border-bottom: 2px solid #00c8ff; border-right: 2px solid #00c8ff;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #2a3340;
    }
    .admin-title {
      font-size: 2rem;
      font-weight: 700;
      color: #ff6a00;
      letter-spacing: 4px;
      text-shadow: 0 0 10px rgba(255,106,0,0.4);
    }
    .back-link {
      color: #00c8ff;
      text-decoration: none;
      font-size: 1rem;
      border: 1px solid #00c8ff;
      padding: 6px 15px;
      transition: 0.3s;
      letter-spacing: 2px;
    }
    .back-link:hover {
      background: rgba(0,200,255,0.1);
      box-shadow: 0 0 15px rgba(0,200,255,0.4);
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      color: #d0dae4;
    }
    .admin-table th, .admin-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #1f2a33;
      text-align: left;
    }
    .admin-table th {
      color: #7a8b9a;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .btn-small {
      background: transparent;
      border: 1px solid #3a5060;
      color: #b0c7d6;
      padding: 4px 10px;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      font-size: 0.8rem;
      margin-right: 6px;
    }
    .btn-small:hover {
      border-color: #00c8ff;
      color: #fff;
    }
    .record-input {
      background: #1a1e24;
      border: 1px solid #3a5060;
      color: #fff;
      padding: 4px;
      width: 70px;
      font-family: inherit;
      font-size: 0.85rem;
    }
    .error-message {
      text-align: center;
      padding: 50px;
      color: #ff6666;
      font-size: 1.2rem;
    }
    .loading-message {
      text-align: center;
      padding: 30px;
      color: #7a8b9a;
      font-size: 1.1rem;
    }
    @media (max-width: 600px) {
      .admin-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .admin-title {
        font-size: 1.5rem;
      }
      .admin-table {
        font-size: 0.8rem;
      }
      .admin-table th, .admin-table td {
        padding: 8px 4px;
      }
      .btn-small {
        padding: 3px 6px;
        font-size: 0.7rem;
      }
      .record-input {
        width: 50px;
        font-size: 0.75rem;
      }
    }
  </style>
<script src="dyson-bg.js"></script>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <div class="admin-title">👥 用户管理</div>
      <a href="../index.html" class="back-link">← 返回主页</a>
    </div>

    <!-- 未授权提示 -->
    <div id="unauthorized" style="display:none;">
      <div class="error-message">⚠️ 您没有管理员权限，无法访问此页面。</div>
      <div style="text-align:center; margin-top:20px;">
        <a href="../index.html" class="back-link">返回主页</a>
      </div>
    </div>

    <!-- 加载中 -->
    <div id="loadingIndicator" class="loading-message">加载用户数据...</div>

    <!-- 管理表格 -->
    <div id="adminContent" style="display:none;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>用户名</th>
            <th>管理员</th>
            <th>最高记录</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 引入 Supabase 客户端 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <script>
    // ==================== 工具函数 ====================
    // 获取当前登录用户（从 localStorage；数据损坏时返回 null 而非抛错）
    function getCurrentUser() {
      const cu = localStorage.getItem('ueg_current_user');
      if (!cu) return null;
      try { return JSON.parse(cu); } catch (e) { return null; }
    }

    // HTML 转义（防存储型 XSS：用户名等拼接进 innerHTML / onclick 前转义）
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ==================== 管理员权限校验 ====================
    async function checkAdmin() {
      const currentUser = getCurrentUser();
      if (!currentUser) {
        document.getElementById('unauthorized').style.display = 'block';
        document.getElementById('adminContent').style.display = 'none';
        document.getElementById('loadingIndicator').style.display = 'none';
        return false;
      }

      // 从 Supabase 查询当前用户是否为管理员
      const { data, error } = await supabase
        .from('users')
        .select('is_admin')
        .eq('username', currentUser.username)
        .maybeSingle();

      if (error || !data || !data.is_admin) {
        document.getElementById('unauthorized').style.display = 'block';
        document.getElementById('adminContent').style.display = 'none';
        document.getElementById('loadingIndicator').style.display = 'none';
        return false;
      }

      // 是管理员，显示内容
      document.getElementById('unauthorized').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      document.getElementById('loadingIndicator').style.display = 'none';
      return true;
    }

    // ==================== 渲染用户表格 ====================
    async function renderTable() {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '<tr><td colspan="4" class="loading-message">加载中...</td></tr>';

      // 从 Supabase 读取所有用户
      const { data: users, error } = await supabase
        .from('users')
        .select('username, is_admin, highest_record')
        .order('username');

      if (error) {
        tbody.innerHTML = `<tr><td colspan="4" class="error-message">加载失败：${error.message}</td></tr>`;
        return;
      }

      if (!users || users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#4a5a6a;">暂无用户</td></tr>';
        return;
      }

      let html = '';
      users.forEach(user => {
        const isAdmin = user.is_admin ? '是' : '否';
        const uName = esc(user.username);
        html += `
          <tr>
            <td>${uName}</td>
            <td>${isAdmin}</td>
            <td>
              <input type="number" class="record-input" id="record-${uName}" 
                     placeholder="等级" value="${esc(user.highest_record) || 0}" min="0" step="1">
            </td>
            <td>
              <button class="btn-small" onclick="updateRecord('${uName}')">保存</button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // ==================== 更新用户最高记录 ====================
    async function updateRecord(username) {
      const input = document.getElementById(`record-${username}`);
      if (!input) return;

      const record = parseInt(input.value);
      if (isNaN(record) || record < 0) {
        alert('请输入有效的非负整数');
        return;
      }

      // 更新 Supabase
      const { error } = await supabase
        .from('users')
        .update({ highest_record: record })
        .eq('username', username);

      if (error) {
        alert('更新失败：' + error.message);
        return;
      }

      // 如果修改的是当前登录用户，同步更新 localStorage 中的记录（保持界面一致）
      const currentUser = getCurrentUser();
      if (currentUser && currentUser.username === username) {
        currentUser.highestRecord = record;
        localStorage.setItem('ueg_current_user', JSON.stringify(currentUser));
      }

      alert('更新成功！');
    }

    // 暴露函数到全局（供 onclick 调用）
    window.updateRecord = updateRecord;

    // ==================== 初始化 ====================
    async function init() {
      const isAdmin = await checkAdmin();
      if (isAdmin) {
        await renderTable();
      }
    }

    init();
  </script>
</body>
</html>
