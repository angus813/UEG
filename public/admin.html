<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>用户管理 - UEG小网站</title>
  <link rel="stylesheet" href="rhine-fonts.css" media="print" onload="this.media='all'"> <!-- MiSans（异步加载，不阻塞首屏） -->
  <noscript><link rel="stylesheet" href="rhine-fonts.css"></noscript> <!-- MiSans webfont -->
  <link rel="stylesheet" href="admin.css"> <!-- 基础布局（先于设计系统） -->
  <link rel="stylesheet" href="rhine.css"> <!-- Rhine Lab Archive 设计系统 -->
  <link rel="stylesheet" href="rhine-motion.css"> <!-- 动效层 -->
  <!-- 视觉统一由 rhine.css 设计系统提供 -->
  <script src="rhine-motion.js"></script>
<script src="bgm.js?v=20261004i"></script>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <div class="admin-title">用户管理</div>
      <a href="../index.html" class="back-link">← 返回主页</a>
    </div>

    <!-- 未授权提示 -->
    <div id="unauthorized" style="display:none;">
      <div class="error-message">您没有管理员权限，无法访问此页面。</div>
      <div style="text-align:center; margin-top:20px;">
        <a href="../index.html" class="back-link">返回主页</a>
      </div>
    </div>

    <!-- 加载中 -->
    <div id="loadingIndicator" class="loading-message">加载用户数据...</div>

    <!-- 管理表格 -->
    <div id="adminContent" style="display:none;">
      <!-- 两个视图。密码重置申请原本接在用户表格下面，而用户表格有三十多行，
           那一节实际落在首屏之外，管理员根本看不到入口也没有任何提示指向它。
           改成 tab：入口固定在顶部，待处理数量直接挂在 tab 上。 -->
      <nav class="tabs" id="adminTabs">
        <button type="button" class="tab active" data-view="users">用户档案</button>
        <button type="button" class="tab" data-view="pw">密码重置申请<span id="pwBadge" style="display:none;margin-left:7px;padding:1px 8px;border-radius:10px;background:var(--rl-accent);color:var(--rl-paper);font-size:10px;font-weight:700;letter-spacing:0;"></span></button>
      </nav>

      <div id="viewUsers">
        <table class="admin-table">
          <thead>
            <tr>
              <th>用户名</th>
              <th>管理员</th>
              <th>最高记录</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>

      <div id="viewPw" style="display:none;">
        <div id="pwEmpty" class="loading-message" style="display:none;">暂无申请</div>
        <table class="admin-table" id="pwTable" style="display:none;">
          <thead>
            <tr>
              <th>单号</th>
              <th>用户名</th>
              <th>账号</th>
              <th>补充说明 / 联系方式</th>
            <th>提交时间</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="pwTableBody"></tbody>
      </table>

      <!-- 重置密码对话框 -->
      <div id="pwDialog" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:70; display:none; align-items:center; justify-content:center; padding:16px;">
        <div style="width:min(480px,92vw); background:var(--rl-panel); border:1px solid var(--rl-line-soft); border-radius:12px; padding:22px;">
          <div style="font-weight:700; letter-spacing:0.06em;">重置密码</div>
          <div id="pwDialogWho" style="font-size:0.85rem; color:var(--rl-text-dim); margin:6px 0 16px;"></div>
          <input type="text" id="pwDialogPw" class="modal-input" autocomplete="off" style="width:100%;">
          <div style="font-size:0.8rem; line-height:1.6; color:var(--rl-text-dim); margin:-4px 0 16px;">
            已预填一个随机密码，可直接用，也可自己改成别的。密码不会入库，关闭后无法再查看。
          </div>
          <div class="btn-row">
            <button class="btn-small" id="pwDialogAgain">换一个</button>
            <button class="modal-btn" id="pwDialogCancel">取消</button>
            <button class="modal-btn toggle" id="pwDialogOk">确认重置</button>
          </div>
          <div id="pwDialogMsg" style="color:var(--rl-danger); font-size:0.85rem; margin-top:12px; min-height:20px;"></div>

          <!-- 成功后换成「把密码给用户」的展示态 -->
          <div id="pwResult" style="display:none;">
            <div style="font-size:0.85rem; line-height:1.7; color:var(--rl-text-dim);">新密码已生效，旧密码和旧登录状态都已失效。请把下面这串密码交给用户：</div>
            <div id="pwResultPw" style="font-size:1.15rem; font-weight:700; letter-spacing:0.08em; word-break:break-all; margin:12px 0; padding:12px; border:1px dashed var(--rl-line-strong); border-radius:8px; user-select:all;"></div>
            <div class="btn-row">
              <button class="btn-small" id="pwCopy">复制</button>
              <button class="modal-btn toggle" id="pwDone" style="flex:2;">完成</button>
            </div>
          </div>
        </div>
      </div>
      </div>
    </div>
  </div>

  <!-- 引入 Supabase 客户端 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=20261016a"></script>

  <script>
    // ==================== 工具函数 ====================
    // 获取当前登录用户（从 localStorage；数据损坏时返回 null 而非抛错）
    function getCurrentUser() {
      const cu = localStorage.getItem('ueg_current_user');
      if (!cu) return null;
      try { return JSON.parse(cu); } catch (e) { return null; }
    }

    // HTML 转义（防存储型 XSS：用户名等拼接进 innerHTML / onclick 前转义）
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ==================== 管理员权限校验 ====================
    async function checkAdmin() {
      const currentUser = getCurrentUser();
      if (!currentUser) {
        document.getElementById('unauthorized').style.display = 'block';
        document.getElementById('adminContent').style.display = 'none';
        document.getElementById('loadingIndicator').style.display = 'none';
        return false;
      }

      // 从 Supabase 查询当前用户是否为管理员
      const { data, error } = await supabase
        .from('users')
        .select('is_admin')
        .eq('username', currentUser.username)
        .maybeSingle();

      if (error || !data || !data.is_admin) {
        document.getElementById('unauthorized').style.display = 'block';
        document.getElementById('adminContent').style.display = 'none';
        document.getElementById('loadingIndicator').style.display = 'none';
        return false;
      }

      // 是管理员，显示内容
      document.getElementById('unauthorized').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      document.getElementById('loadingIndicator').style.display = 'none';
      return true;
    }

    // ==================== 渲染用户表格 ====================
    async function renderTable() {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '<tr><td colspan="4" class="loading-message">加载中...</td></tr>';

      // 从 Supabase 读取所有用户
      const { data: users, error } = await supabase
        .from('users')
        .select('username, is_admin, highest_record')
        .order('username');

      if (error) {
        tbody.innerHTML = `<tr><td colspan="4" class="error-message">加载失败：${error.message}</td></tr>`;
        return;
      }

      if (!users || users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#536166;">暂无用户</td></tr>';
        return;
      }

      let html = '';
      users.forEach(user => {
        const isAdmin = user.is_admin ? '是' : '否';
        const uName = esc(user.username);
        html += `
          <tr>
            <td>${uName}</td>
            <td>${isAdmin}</td>
            <td>
              <input type="number" class="record-input" id="record-${uName}" 
                     placeholder="等级" value="${esc(user.highest_record) || 0}" min="0" step="1">
            </td>
            <td>
              <button class="btn-small" onclick="updateRecord('${uName}')">保存</button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // ==================== 更新用户最高记录 ====================
    async function updateRecord(username) {
      const input = document.getElementById(`record-${username}`);
      if (!input) return;

      const record = parseInt(input.value);
      if (isNaN(record) || record < 0) {
        alert('请输入有效的非负整数');
        return;
      }

      // 更新 Supabase
      const { error } = await supabase
        .from('users')
        .update({ highest_record: record })
        .eq('username', username);

      if (error) {
        alert('更新失败：' + error.message);
        return;
      }

      // 如果修改的是当前登录用户，同步更新 localStorage 中的记录（保持界面一致）
      const currentUser = getCurrentUser();
      if (currentUser && currentUser.username === username) {
        currentUser.highest_record = record;
        localStorage.setItem('ueg_current_user', JSON.stringify(currentUser));
      }

      alert('更新成功！');
    }

    // 暴露函数到全局（供 onclick 调用）
    window.updateRecord = updateRecord;

    // ==================== 密码重置申请 ====================
    // 站内账号没有真实邮箱（地址是 encEmail() 拼的 <用户名>@ueg.local），
    // GoTrue 的 /recover 对这些地址一律判 email_address_invalid，
    // 而内置 SMTP 又只投给 team members —— 三条路都堵死，所以只走人工审批。
    //
    // 权限：这一节只有 is_admin 看得到，后端 pw_reset_list / pw_reset_resolve
    // 也会再校验一次 current_user_is_admin()，前端隐藏不算防护。
    let pwRows = [];
    let pwTarget = null;

    // 生成一个「好念、好记、不易混」的随机密码：去掉 I/O/l/0/1 这些
    // 电话里念出来会歧义的字符，长度 12 位，混合大小写数字加一个符号。
    function generatePassword() {
      const upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      const lower = 'abcdefghijkmnpqrstuvwxyz';
      const digit = '23456789';
      const sym = '!@#$%&*';
      const pool = upper + lower + digit;
      const pick = a => a.charAt(Math.floor(Math.random() * a.length));
      let s = pick(upper) + pick(lower) + pick(digit) + pick(sym);
      for (let i = 0; i < 8; i++) s += pick(pool);
      return s;
    }

    function fmtTime(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '-';
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
        + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    // ==================== 视图切换 ====================
// 用户表格三十多行，密码重置申请若接在它下面就永远落在首屏之外。tab 把入口
// 固定在顶部，待处理数量挂在 tab 上，管理员不用先滚一遍用户表才知道有没有事。
function switchAdminView(view) {
  document.querySelectorAll('#adminTabs .tab').forEach(function (b) {
    b.classList.toggle('active', b.dataset.view === view);
  });
  document.getElementById('viewUsers').style.display = view === 'users' ? '' : 'none';
  document.getElementById('viewPw').style.display = view === 'pw' ? '' : 'none';
}

document.querySelectorAll('#adminTabs .tab').forEach(function (b) {
  b.addEventListener('click', function () { switchAdminView(b.dataset.view); });
});

async function renderPwTable() {
      const tbody = document.getElementById('pwTableBody');
      const r = await DB.listPasswordResets();
      if (r.code !== 200) {
        tbody.innerHTML = '<tr><td colspan="7" class="error-message">加载失败：' + esc(r.msg) + '</td></tr>';
        document.getElementById('pwTable').style.display = '';
        return;
      }
      pwRows = r.data || [];
      const pending = pwRows.filter(x => x.status === 'pending').length;
      const badge = document.getElementById('pwBadge');
      if (badge) {
        badge.textContent = pending;
        badge.style.display = pending ? '' : 'none';
      }
      if (!pwRows.length) {
        document.getElementById('pwTable').style.display = 'none';
        const empty = document.getElementById('pwEmpty');
        empty.style.display = '';
        empty.textContent = '暂无申请';
        return;
      }
      document.getElementById('pwEmpty').style.display = 'none';
      document.getElementById('pwTable').style.display = '';

      const statusText = { pending: '待处理', done: '已重置', rejected: '已驳回' };
      let html = '';
      pwRows.forEach(rw => {
        const name = esc(rw.username);
        const detail = [esc(rw.note), rw.contact ? '联系：' + esc(rw.contact) : '']
          .filter(Boolean).join(' / ') || '<span style="color:#8a9aa5;">（无）</span>';
        const actions = rw.status === 'pending'
          ? '<button class="btn-small" onclick="openPwDialog(' + rw.id + ')">重置密码</button> '
            + '<button class="btn-small" onclick="rejectPw(' + rw.id + ')">驳回</button>'
          : '<span style="color:#8a9aa5;">' + (rw.handled_by ? esc(rw.handled_by) + ' · ' + fmtTime(rw.handled_at) : '-') + '</span>';
        html += '<tr>'
          + '<td>#' + rw.id + '</td>'
          + '<td>' + name + (rw.submissions > 1 ? ' <span style="color:#b06;">×' + rw.submissions + '</span>' : '') + '</td>'
          // 账号不存在时明确标出来：管理员没必要为一个查无此人的用户名改密码
          + '<td>' + (rw.account_exists ? '存在' : '<span style="color:var(--rl-danger);">查无此账号</span>') + '</td>'
          + '<td style="max-width:260px;">' + detail + '</td>'
          + '<td>' + fmtTime(rw.created_at) + '</td>'
          + '<td>' + (statusText[rw.status] || esc(rw.status)) + '</td>'
          + '<td>' + actions + '</td>'
          + '</tr>';
      });
      tbody.innerHTML = html;
    }

    function closePwDialog() {
      document.getElementById('pwDialog').style.display = 'none';
      document.getElementById('pwResult').style.display = 'none';
      document.getElementById('pwDialogMsg').textContent = '';
      pwTarget = null;
    }

    function openPwDialog(id) {
      const rw = pwRows.find(x => x.id === id);
      if (!rw) return;
      if (!rw.account_exists) {
        alert('「' + rw.username + '」在登录账号表里查不到，改不了密码。\n请先驳回这条申请。');
        return;
      }
      pwTarget = rw;
      document.getElementById('pwDialogWho').textContent =
        '用户：' + rw.username + '（单号 #' + rw.id + '）';
      document.getElementById('pwDialogPw').value = generatePassword();
      document.getElementById('pwDialogMsg').textContent = '';
      document.getElementById('pwResult').style.display = 'none';
      document.getElementById('pwDialog').style.display = 'flex';
      setTimeout(() => document.getElementById('pwDialogPw').select(), 0);
    }

    async function confirmPwReset() {
      if (!pwTarget) return;
      const pw = document.getElementById('pwDialogPw').value;
      const okBtn = document.getElementById('pwDialogOk');
      okBtn.disabled = true;
      const r = await DB.resolvePasswordReset(pwTarget.id, 'done', pw, '管理员重置');
      okBtn.disabled = false;
      if (r.code !== 200) {
        document.getElementById('pwDialogMsg').textContent = r.msg;
        return;
      }
      // 密码不落库，只能在这里给管理员看一眼，让它转交给用户
      document.getElementById('pwResultPw').textContent = pw;
      document.getElementById('pwResult').style.display = '';
      document.getElementById('pwDialogMsg').textContent = '';
      await renderPwTable();
    }

    async function rejectPw(id) {
      if (!confirm('驳回这条密码重置申请？')) return;
      const r = await DB.resolvePasswordReset(id, 'reject', '', '管理员驳回');
      if (r.code !== 200) { alert(r.msg); return; }
      await renderPwTable();
    }

    document.getElementById('pwDialogCancel').addEventListener('click', closePwDialog);
    document.getElementById('pwDone').addEventListener('click', closePwDialog);
    document.getElementById('pwDialogAgain').addEventListener('click', () => {
      document.getElementById('pwDialogPw').value = generatePassword();
    });
    document.getElementById('pwDialogOk').addEventListener('click', confirmPwReset);
    document.getElementById('pwDialogPw').addEventListener('keydown', e => {
      if (e.key === 'Enter') confirmPwReset();
    });
    document.getElementById('pwCopy').addEventListener('click', async () => {
      const pw = document.getElementById('pwResultPw').textContent;
      try {
        await navigator.clipboard.writeText(pw);
        document.getElementById('pwCopy').textContent = '已复制';
        setTimeout(() => { document.getElementById('pwCopy').textContent = '复制'; }, 1500);
      } catch (e) {
        window.prompt('手动复制：', pw);
      }
    });

    window.openPwDialog = openPwDialog;
    window.rejectPw = rejectPw;

    // ==================== 初始化 ====================
    async function init() {
      const isAdmin = await checkAdmin();
      if (!isAdmin) return;
      switchAdminView('users');
      await renderTable();
      await renderPwTable();
    }

    // 等会话恢复完成再初始化：token 过期回来的首屏先 401 会被误判非管理员。
    // UEG_DB_READY 同样要等：DB 的 RPC 走 ueg_token，token 还没恢复就调用会被判未登录。
    (async function () {
      try { if (window.UEG_DB_READY) await window.UEG_DB_READY; } catch (e) {}
      try { if (window.UEG_SESSION_READY) await window.UEG_SESSION_READY; } catch (e) {}
      await init();
    })();
  </script>
</body>
</html>
