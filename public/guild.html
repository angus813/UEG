<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>公会 - UEG小网站</title>
  <link rel="stylesheet" href="rhine.css">
  <style>
    /* 莱茵生命风格 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #dyson-bg { display: none !important; }
    body {
      color: var(--rhine-body, #3c3a37);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 10px;
    }
    .guild-container {
      width: 100%;
      max-width: 1100px;
      background: var(--rhine-panel, #faf8f6);
      border: 1px solid var(--rhine-line, #e5e1dc);
      border-left: 3px solid var(--rhine-accent, #ffd700);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      min-height: 600px;
      display: flex;
      flex-direction: row;
      box-shadow: none !important;
    }
    .guild-container::before, .guild-container::after { content: none; }

    /* 左侧面板 */
    .left-panel {
      width: 50%;
      padding: 25px 20px;
      border-right: 1px solid var(--rhine-line, #e5e1dc);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .guild-title {
      font-family: var(--rhine-title-font, 'Oswald', 'Arial Narrow', Arial, sans-serif);
      font-size: 2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--rhine-ink, #1a1a1a);
      text-shadow: none;
      margin-bottom: 10px;
    }
    .feature-cards {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .feature-card {
      background: var(--rhine-bg, #ffffff);
      border: 1px solid var(--rhine-line, #e5e1dc);
      border-left: 3px solid var(--rhine-accent, #ffd700);
      border-radius: 2px;
      padding: 20px;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: none !important;
    }
    .feature-card:hover {
      border-color: var(--rhine-accent, #ffd700);
      background: var(--rhine-panel2, #f3f0ec);
    }
    .feature-icon {
      font-size: 2.5rem;
      color: var(--rhine-accent, #ffd700);
      width: 50px;
      text-align: center;
    }
    .feature-text h3 {
      font-family: var(--rhine-title-font, 'Oswald', 'Arial Narrow', Arial, sans-serif);
      font-size: 1.4rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--rhine-ink, #1a1a1a);
      margin-bottom: 5px;
    }
    .feature-text p {
      font-size: 0.8rem;
      color: var(--rhine-mute, #8a857e);
    }
    .back-link {
      margin-top: auto;
      text-align: center;
      color: var(--rhine-ink, #1a1a1a);
      text-decoration: none;
      font-family: var(--rhine-title-font, 'Oswald', 'Arial Narrow', Arial, sans-serif);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.8rem;
      border: 1px solid var(--rhine-ink, #1a1a1a);
      border-radius: 0;
      padding: 8px 15px;
      transition: background .15s ease, color .15s ease;
      box-shadow: none !important;
    }
    .back-link:hover {
      background: var(--rhine-accent, #ffd700);
      border-color: var(--rhine-accent, #ffd700);
      color: var(--rhine-accent-ink, #000);
    }

    /* 右侧成员列表 */
    .right-panel {
      width: 50%;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      background: var(--rhine-bg, #ffffff);
    }
    .members-title {
      font-family: var(--rhine-title-font, 'Oswald', 'Arial Narrow', Arial, sans-serif);
      font-size: 1.4rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--rhine-ink, #1a1a1a);
      border-bottom: 2px solid var(--rhine-accent, #ffd700);
      padding-bottom: 12px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: none;
    }
    .member-list {
      flex: 1;
      overflow-y: auto;
      padding-right: 5px;
    }
    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 10px;
      border-bottom: 1px solid var(--rhine-line, #e5e1dc);
      transition: background .15s ease;
    }
    .member-item:hover {
      background: var(--rhine-panel2, #f3f0ec);
    }
    .member-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .member-avatar {
      width: 40px;
      height: 40px;
      background: var(--rhine-panel, #faf8f6);
      border: 1px solid var(--rhine-accent, #ffd700);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .member-name {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--rhine-ink, #1a1a1a);
    }
    .member-role {
      font-size: 0.8rem;
      color: var(--rhine-mute, #8a857e);
      margin-left: 8px;
    }
    .leader-badge {
      color: var(--rhine-accent, #ffd700);
      font-weight: 700;
    }
    .delete-member-btn {
      background: var(--rhine-bg, #ffffff);
      border: 1px solid var(--rhine-ink, #1a1a1a);
      border-radius: 0;
      color: var(--rhine-ink, #1a1a1a);
      font-family: var(--rhine-title-font, 'Oswald', 'Arial Narrow', Arial, sans-serif);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.72rem;
      padding: 4px 12px;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
      display: none; /* 默认隐藏，管理员可见 */
      box-shadow: none !important;
    }
    .delete-member-btn:hover {
      background: var(--rhine-accent, #ffd700);
      border-color: var(--rhine-accent, #ffd700);
      color: var(--rhine-accent-ink, #000);
    }
    .no-members {
      text-align: center;
      color: var(--rhine-mute, #8a857e);
      margin-top: 50px;
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .guild-container {
        flex-direction: column;
        min-height: auto;
      }
      .left-panel, .right-panel { width: 100%; border-right: none; }
      .left-panel { border-bottom: 1px solid var(--rhine-line, #e5e1dc); }
      .right-panel { max-height: 50vh; }
    }
  </style>
<script src="dyson-bg.js"></script>
</head>
<body>
  <div class="guild-container">
    <!-- 左侧：公会功能 -->
    <div class="left-panel">
      <div class="guild-title"><span class="rhine-mark"><span class="pm">±</span><span class="inf">∞</span></span> 公会</div>
      <div class="feature-cards">
        <a href="strategy_map.html" class="feature-card" style="text-decoration:none; color:inherit;">
          <div class="feature-icon">🗺️</div>
          <div class="feature-text">
            <h3>战略地图</h3>
            <p>查看同盟战略部署</p>
          </div>
        </a>
        <div class="feature-card" onclick="alert('论坛即将开放')">
          <div class="feature-icon">💬</div>
          <div class="feature-text">
            <h3>论坛</h3>
            <p>交流战术与心得</p>
          </div>
        </div>
        <div class="feature-card" onclick="alert('配队攻略即将开放')">
          <div class="feature-icon">📋</div>
          <div class="feature-text">
            <h3>配队攻略</h3>
            <p>分享舰队配置方案</p>
          </div>
        </div>
      </div>
      <a href="../index.html" class="back-link">← 返回主菜单</a>
    </div>

    <!-- 右侧：成员列表 -->
    <div class="right-panel">
      <div class="members-title">
        <span class="rhine-mark"><span class="pm">±</span><span class="inf">∞</span></span> 公会成员
      </div>
      <div class="member-list" id="memberList">
        <div class="no-members">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 引入 Supabase 客户端 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <script>
    // ==================== 工具函数 ====================
    // 获取当前登录用户（从 localStorage，保持与 index.html 一致；数据损坏时返回 null 而非抛错）
    function getCurrentUser() {
      const cu = localStorage.getItem('ueg_current_user');
      if (!cu) return null;
      try { return JSON.parse(cu); } catch (e) { return null; }
    }

    // HTML 转义（防存储型 XSS：用户名等拼接进 innerHTML / onclick 前转义）
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 判断当前用户是否为管理员（从 Supabase 实时查询）
    async function isAdmin() {
      const user = getCurrentUser();
      if (!user) return false;
      const { data, error } = await supabase
        .from('users')
        .select('is_admin')
        .eq('username', user.username)
        .maybeSingle();
      if (error || !data) return false;
      return data.is_admin === true;
    }

    // ==================== 删除用户 ====================
    async function deleteMember(username) {
      if (!confirm(`⚠️ 确定要永久删除用户 "${username}" 吗？此操作不可恢复！`)) return;

      const admin = await isAdmin();
      if (!admin) {
        alert('您没有管理员权限');
        return;
      }

      const { error } = await supabase
        .from('users')
        .delete()
        .eq('username', username);

      if (error) {
        alert('删除失败: ' + error.message);
        return;
      }

      // 如果被删除的是当前登录用户，则登出并跳转
      const currentUser = getCurrentUser();
      if (currentUser && currentUser.username === username) {
        localStorage.removeItem('ueg_current_user');
        alert('你的账号已被删除，即将返回主页。');
        window.location.href = '../index.html';
        return;
      }

      // 重新渲染列表
      await renderMemberList();
    }

    // 暴露到全局（供 onclick 调用）
    window.deleteMember = deleteMember;

    // ==================== 渲染成员列表 ====================
    async function renderMemberList() {
      const container = document.getElementById('memberList');
      container.innerHTML = '<div class="no-members">加载中...</div>';

      // 从 Supabase 读取所有用户，按用户名排序
      const { data: users, error } = await supabase
        .from('users')
        .select('username, is_admin')
        .order('username');

      if (error) {
        container.innerHTML = '<div class="no-members">加载失败，请刷新重试</div>';
        console.error('加载成员列表失败:', error);
        return;
      }

      if (!users || users.length === 0) {
        container.innerHTML = '<div class="no-members">暂无成员</div>';
        return;
      }

      // 置顶 angus（会长），其余按用户名排序
      const angus = users.find(u => u.username === 'angus');
      const others = users.filter(u => u.username !== 'angus');
      const sorted = angus ? [angus, ...others] : others;

      const admin = await isAdmin();
      let html = '';
      sorted.forEach(user => {
        const isLeader = user.username === 'angus';
        const role = isLeader ? '会长' : '成员';
        const roleClass = isLeader ? 'leader-badge' : '';
        const uName = esc(user.username);
        html += `
          <div class="member-item">
            <div class="member-info">
              <div class="member-avatar">👤</div>
              <div>
                <span class="member-name">${uName}</span>
                <span class="member-role ${roleClass}">${role}</span>
              </div>
            </div>
            <button class="delete-member-btn" style="display:${admin && !isLeader ? 'block' : 'none'}" onclick="deleteMember('${uName}')">注销</button>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // ==================== 初始化 ====================
    (async function init() {
      await renderMemberList();
    })();
  </script>
</body>
</html>
