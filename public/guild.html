<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>公会 - UEG小网站</title>
  <link rel="stylesheet" href="rhine-fonts.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="rhine-fonts.css"></noscript>
  <link rel="stylesheet" href="rhine.css">
  <link rel="stylesheet" href="rhine-motion.css">
  <script src="rhine-motion.js"></script>
  <style>
    .member-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .member-avatar { overflow: hidden; }
    .tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 8px; font-size: 11px;
      border: 1px solid rgba(120,160,220,.45); opacity: .95; }
    .tag.owner { border-color: #ffd76e; color: #ffd76e; }
    .tag.official { border-color: #7de3a4; color: #7de3a4; }
    .tag.admin { border-color: #8ab7ff; color: #8ab7ff; }
    .member-actions { display: flex; gap: 6px; align-items: center; }
    .mini-btn { padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;
      border: 1px solid rgba(120,160,220,.45); background: rgba(30,40,60,.7); color: #e7ecf5; }
    .mini-btn.warn { border-color: rgba(255,140,140,.5); color: #ffb3b3; }
  </style>
</head>
<body>
  <div class="guild-container">
    <!-- 左侧：公会功能 -->
    <div class="left-panel">
      <div class="guild-title">公会</div>
      <div class="feature-cards">
        <a href="strategy_map.html" class="feature-card" style="text-decoration:none; color:inherit;">
          <div class="feature-icon">🗺️</div>
          <div class="feature-text">
            <h3>战略地图</h3>
            <p>查看同盟战略部署</p>
          </div>
        </a>
        <a href="forum.html" class="feature-card" style="text-decoration:none; color:inherit;">
          <div class="feature-icon">💬</div>
          <div class="feature-text">
            <h3>公会论坛</h3>
            <p>聊天式交流 · 图片视频表情</p>
          </div>
        </a>
        <!-- 配队攻略：由「小游戏 → 舰船强化」迁移而来 -->
        <a href="games/enhance.html" class="feature-card" style="text-decoration:none; color:inherit;">
          <div class="feature-icon">📋</div>
          <div class="feature-text">
            <h3>配队攻略 · 舰船强化</h3>
            <p>蓝图科技加点与舰队配置</p>
          </div>
        </a>
      </div>
      <a href="../index.html" class="back-link">← 返回主菜单</a>
    </div>

    <!-- 右侧：成员列表 -->
    <div class="right-panel">
      <div class="members-title">公会成员</div>
      <div class="member-list" id="memberList">
        <div class="no-members">加载中...</div>
      </div>
    </div>
  </div>

  <script src="supabase-client.js"></script>

  <script>
    function getCurrentUser() {
      const cu = localStorage.getItem('ueg_current_user');
      if (!cu) return null;
      try { return JSON.parse(cu); } catch (e) { return null; }
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    async function myRole() {
      const u = getCurrentUser();
      if (!u) return { name: '', admin: false, owner: false, official: false };
      try {
        const r = await DB.myProfile();
        const p = (r && r.code === 200) ? r.data : {};
        return { name: u.username, admin: !!p.is_admin, owner: !!p.is_owner, official: !!p.is_official };
      } catch (e) {
        return { name: u.username, admin: !!u.is_admin, owner: !!u.is_owner, official: !!u.is_official };
      }
    }

    async function setOfficial(username, on) {
      const r = await DB.setOfficial(username, on);
      alert(r.msg || (r.code === 200 ? '已更新' : '操作失败'));
      if (r.code === 200) await renderMemberList();
    }
    window.setOfficial = setOfficial;

    async function deleteMember(username) {
      if (!confirm('⚠️ 确定要永久删除用户 "' + username + '" 吗？此操作不可恢复！')) return;
      const role = await myRole();
      if (!role.admin && !role.owner) { alert('您没有管理员权限'); return; }
      const { error } = await supabase.from('users').delete().eq('username', username);
      if (error) { alert('删除失败: ' + error.message); return; }
      const cu = getCurrentUser();
      if (cu && cu.username === username) {
        localStorage.removeItem('ueg_current_user');
        alert('你的账号已被删除，即将返回主页。');
        window.location.href = '../index.html';
        return;
      }
      await renderMemberList();
    }
    window.deleteMember = deleteMember;

    async function renderMemberList() {
      const container = document.getElementById('memberList');
      container.innerHTML = '<div class="no-members">加载中...</div>';

      const { data: users, error } = await supabase
        .from('users')
        .select('username, is_admin, is_owner, is_official, avatar_url, highest_record')
        .order('username');

      if (error) {
        container.innerHTML = '<div class="no-members">加载失败，请刷新重试</div>';
        return;
      }
      if (!users || users.length === 0) {
        container.innerHTML = '<div class="no-members">暂无成员</div>';
        return;
      }

      const role = await myRole();
      const canManage = role.admin || role.owner;

      // 排序：会长 → 官员 → 管理员 → 其他人（按用户名）
      const rank = u => (u.is_owner ? 0 : (u.is_official ? 1 : (u.is_admin ? 2 : 3)));
      const sorted = users.slice().sort((a, b) => {
        const d = rank(a) - rank(b);
        if (d) return d;
        return String(a.username).localeCompare(String(b.username), 'zh-CN');
      });

      let html = '';
      sorted.forEach(user => {
        const uName = esc(user.username);
        const isOwner = !!user.is_owner;
        const isOfficial = !!user.is_official;
        const isAdmin = !!user.is_admin;
        let tags = '';
        if (isOwner) tags += '<span class="tag owner">会长</span>';
        if (isOfficial) tags += '<span class="tag official">官员</span>';
        if (isAdmin && !isOwner) tags += '<span class="tag admin">管理员</span>';
        if (!tags) tags = '<span class="tag">成员</span>';

        const ava = user.avatar_url
          ? '<img src="' + esc(user.avatar_url) + '" alt="">'
          : '👤';

        // 会长不能被注销，也不能被他人任免
        const canToggle = canManage && !isOwner;
        const toggleBtn = canToggle
          ? '<button class="mini-btn" onclick="setOfficial(\'' + uName + '\',' + (isOfficial ? 'false' : 'true') + ')">'
            + (isOfficial ? '解除官员' : '任命官员') + '</button>'
          : '';
        const delBtn = (canManage && !isOwner)
          ? '<button class="mini-btn warn" onclick="deleteMember(\'' + uName + '\')">注销</button>'
          : '';

        html += '<div class="member-item">' +
          '<div class="member-info">' +
            '<div class="member-avatar">' + ava + '</div>' +
            '<div><span class="member-name">' + uName + '</span>' + tags + '</div>' +
          '</div>' +
          '<div class="member-actions">' + toggleBtn + delBtn + '</div>' +
        '</div>';
      });

      container.innerHTML = html;
    }

    (async function init() {
      try { if (window.UEG_SESSION_READY) await window.UEG_SESSION_READY; } catch (e) {}
      await renderMemberList();
    })();
  </script>
</body>
</html>
