<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>公会论坛 - UEG小网站</title>
  <link rel="stylesheet" href="rhine-fonts.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="rhine-fonts.css"></noscript>
  <link rel="stylesheet" href="rhine.css">
  <link rel="stylesheet" href="rhine-motion.css">
  <script src="rhine-motion.js"></script>
<script src="bgm.js?v=20261004i"></script>
  <style>
    :root { --bubble-me: #3a7afe; --bubble-other: var(--rl-field); }
    .chat-wrap { max-width: 900px; margin: 12px auto 0; padding: 0 12px 12px; display: flex; flex-direction: column;
      height: calc(100vh - 24px); height: calc(100dvh - 24px);
      padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    .chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 4px; }
    .chat-head h1 { font-size: 20px; margin: 0; }
    .chat-head .spacer { flex: 1; }
    .color-pick { display: flex; align-items: center; gap: 6px; font-size: 13px; opacity: .9; }
    .color-pick input[type=color] { width: 30px; height: 24px; border: none; background: none; padding: 0; }
    .chat-body { flex: 1; overflow-y: auto; padding: 8px; border: 1px solid var(--rl-line-soft);
      border-radius: 14px; background: var(--rl-panel); }
    .msg { display: flex; gap: 8px; margin: 10px 2px; align-items: flex-start; }
    .msg .ava { width: 34px; height: 34px; border-radius: 50%; background: var(--rl-field); flex: 0 0 34px;
      display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 16px; }
    .msg .ava img { width: 100%; height: 100%; object-fit: cover; }
    .msg .stack { max-width: 72%; min-width: 0; }
    .msg .who { font-size: 12px; opacity: .6; margin: 0 0 3px 2px; }
    .bubble { display: inline-block; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.6;
      /* overflow-wrap:anywhere 会参与 min-content 宽度计算：只写 break-word 时，
         长串（帖子正文/URL）仍会把 inline-block 气泡撑破 */
      word-break: break-word; overflow-wrap: anywhere; white-space: pre-wrap;
      max-width: 100%; background: var(--bubble-other); color: var(--rl-ink); }
    .bubble img, .bubble video { max-width: 100%; border-radius: 10px; display: block; }
    .msg.mine { flex-direction: row-reverse; }
    .msg.mine .who { text-align: right; margin-right: 2px; }
    .msg.mine .stack { display: flex; flex-direction: column; align-items: flex-end; }
    .chat-input { display: flex; gap: 8px; align-items: flex-end; padding: 10px 0 0; }
    .chat-input textarea { flex: 1; min-height: 44px; max-height: 130px; resize: none; padding: 10px 12px;
      border-radius: 12px; border: 1px solid var(--rl-line); background: var(--rl-field); color: var(--rl-ink); font-size: 14px; }
    .tool { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--rl-line);
      background: var(--rl-field); color: var(--rl-ink); cursor: pointer; font-size: 13px; }
    .send { padding: 0 16px; height: 40px; border-radius: 10px; border: 1px solid var(--rl-accent);
      background: var(--rl-accent); color: var(--rl-paper); cursor: pointer; }
    .emoji-bar { display: none; flex-wrap: wrap; gap: 6px; padding: 8px 0 0; }
    .emoji-bar span { cursor: pointer; font-size: 20px; padding: 2px 4px; border-radius: 6px; }
    .emoji-bar span:hover { background: var(--rl-accent-soft); }
    .tips { font-size: 12px; opacity: .6; padding: 6px 2px 0; }
    .msg .recall { margin-left: 6px; padding: 0 5px; border: 1px solid var(--rl-line-soft); border-radius: 4px;
      background: transparent; color: var(--rl-muted); font-size: 11px; line-height: 16px; cursor: pointer; }
    @media (hover: hover) { .msg .recall { opacity: 0; } .msg:hover .recall { opacity: 1; } }
    .bubble .recalled { opacity: .55; font-style: italic; }
    .msg.recalled-msg .bubble { background: var(--rl-field); color: var(--rl-muted); }
    @media (max-width: 700px) {
      .chat-head { flex-wrap: wrap; row-gap: 6px; }
      .chat-input textarea { font-size: 16px; min-height: 44px; }
      .msg .stack { max-width: 80%; }
      .color-pick input[type=color] { width: 46px; height: 40px; }
    }
    @media (hover: none) { .msg .recall { min-height: 32px; padding: 0 10px; font-size: 12px; } }
    /* ==================== 帖子模式 ==================== */
    .forum-tabs { display: flex; gap: 6px; }
    .ftab { padding: 5px 14px; border-radius: 8px; border: 1px solid var(--rl-line-soft, #2a3550);
            background: transparent; color: var(--rl-ink, #e8eef7); cursor: pointer; font-size: 14px; }
    .ftab.active { background: var(--rl-accent, #3a7afe); color: #fff; border-color: transparent; }
    .view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .post-bar { display: flex; align-items: center; gap: 10px; padding: 8px 2px; flex-wrap: wrap; }
    .post-list { flex: 1; overflow-y: auto; padding: 4px; }
    .post-item { border: 1px solid var(--rl-line-soft, #2a3550); border-radius: 10px;
                 padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
    .post-item:hover { border-color: var(--rl-line, #33456b); }
    .post-item h3 { margin: 0 0 4px; font-size: 15px; word-break: break-word; overflow-wrap: anywhere; }
    .post-meta { font-size: 12px; opacity: .72; display: flex; gap: 10px; flex-wrap: wrap; }
    .post-preview { font-size: 13px; opacity: .85; margin-top: 4px; word-break: break-word; overflow-wrap: anywhere; }
    .post-title { margin: 0 0 4px; font-size: 17px; word-break: break-word; overflow-wrap: anywhere; }
    .post-main { border: 1px solid var(--rl-line-soft, #2a3550); border-radius: 10px;
                 padding: 12px; margin-bottom: 10px; }
    .reply-list { flex: 1; overflow-y: auto; padding: 2px; }
    .reply-item { display: flex; gap: 8px; padding: 8px 6px; border-bottom: 1px dashed var(--rl-line-soft, #2a3550); }
    .reply-item .avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
                          object-fit: cover; background: rgba(255,255,255,.08); }
    .reply-body { flex: 1; min-width: 0; }
    .reply-name { font-size: 12px; opacity: .8; margin-bottom: 2px; }
    .reply-text { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
    .reply-text img, .reply-text video { max-width: 100%; border-radius: 8px; display: block; margin-top: 4px; }
    .reply-text .recall { margin-left: 6px; }
    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: none;
             align-items: center; justify-content: center; z-index: 60; padding: 14px; }
    .modal.open { display: flex; }
    .modal-box { background: var(--rl-panel, #101a2e); border: 1px solid var(--rl-line-soft, #2a3550);
                 border-radius: 12px; padding: 16px; width: min(560px, 100%); max-height: 88vh; overflow-y: auto; }
    .modal-box h3 { margin: 0 0 10px; }
    .modal-input { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 8px 10px;
                   border-radius: 8px; border: 1px solid var(--rl-line, #33456b);
                   background: var(--rl-field, #17233d); color: var(--rl-ink, #e8eef7);
                   font-size: 15px; font-family: inherit; }
    .modal-input[rows] { resize: vertical; }
    .post-media-row, .modal-actions { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="chat-wrap">
    <div class="chat-head">
      <h1>公会论坛</h1>
      <div class="forum-tabs">
        <button class="ftab active" id="tabChat" data-view="chat">聊天</button>
        <button class="ftab" id="tabPosts" data-view="posts">帖子</button>
      </div>
      <div class="spacer"></div>
      <label class="color-pick">我的气泡
        <input type="color" id="bubbleColor" value="#3a7afe">
      </label>
      <a href="guild.html" class="back-link">← 公会</a>
    </div>

    <!-- 视图一：聊天（原样） -->
    <div class="view" id="viewChat">
      <div class="chat-body" id="chatBody">
        <div class="tips">加载中…</div>
      </div>

      <div class="emoji-bar" id="emojiBar"></div>

      <div class="chat-input">
        <button class="tool" id="btnEmoji" title="表情">表情</button>
        <button class="tool" id="btnImg" title="发图片">图片</button>
        <button class="tool" id="btnVid" title="发视频">视频</button>
        <input type="file" id="fileImg" accept="image/*" style="display:none">
        <input type="file" id="fileVid" accept="video/*" style="display:none">
        <textarea id="txt" placeholder="说点什么…" enterkeyhint="send" title="Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send" id="btnSend">发送</button>
      </div>
      <div class="tips" id="chatTip"></div>
    </div>

    <!-- 视图二：帖子列表 -->
    <div class="view" id="viewPosts" style="display:none;">
      <div class="post-bar">
        <button class="send" id="btnNewPost">＋ 发帖</button>
        <button class="tool" id="btnReloadPosts" title="刷新列表">刷新</button>
        <span class="tips" id="postTip"></span>
      </div>
      <div class="post-list" id="postList">
        <div class="tips">加载中…</div>
      </div>
    </div>

    <!-- 帖子详情（主帖 + 平铺回复楼层） -->
    <div class="view" id="postDetail" style="display:none;">
      <div class="post-bar">
        <button class="tool" id="btnBackPosts">← 帖子列表</button>
        <span class="tips" id="replyTip"></span>
      </div>
      <div class="post-main" id="postMain"></div>
      <div class="reply-list" id="replyList"></div>
      <div class="chat-input">
        <button class="tool" id="rbtnImg" title="回复图片">图片</button>
        <button class="tool" id="rbtnVid" title="回复视频">视频</button>
        <input type="file" id="rfileImg" accept="image/*" style="display:none">
        <input type="file" id="rfileVid" accept="video/*" style="display:none">
        <textarea id="rtxt" placeholder="回复这个帖子…" enterkeyhint="send" title="Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send" id="btnReply">回复</button>
      </div>
    </div>

    <!-- 发帖弹窗 -->
    <div class="modal" id="newPostModal">
      <div class="modal-box">
        <h3>发帖子</h3>
        <input type="text" class="modal-input" id="postTitle" placeholder="标题（必填，2-60 字）" maxlength="60">
        <textarea class="modal-input" id="postBody" rows="6" placeholder="正文（可留空，只发图片/视频也行）"></textarea>
        <div class="post-media-row">
          <button class="tool" id="pbtnImg">选图片</button>
          <button class="tool" id="pbtnVid">选视频</button>
          <input type="file" id="pfileImg" accept="image/*" style="display:none">
          <input type="file" id="pfileVid" accept="video/*" style="display:none">
          <span class="tips" id="postMediaInfo"></span>
        </div>
        <div class="modal-actions">
          <button class="send" id="btnPublishPost">发布</button>
          <button class="tool" id="btnCancelPost">取消</button>
        </div>
        <div class="tips" id="newPostTip"></div>
      </div>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../github-db.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    var EMOS = ['😀','😄','😁','😆','😉','😊','😍','🤩','😎','🤔','😏','😢','😭','😡','👍','👎','👏','🙏','💪','🎉','🔥','✨','❤️','💔','🚀','🛰️','⚔️','🛡️','🧭','📦','🎯','💎','⭐','🌟','⚡','🫡'];
    var EMO_CACHE = {};
    var me = null, myColor = '#3a7afe', lastId = 0, timer = null, polls = 0, canSoftRecall = true;
    var MSG_INDEX = {};   // id → 消息行（撤回后就地重渲染，不整页重载）

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function userName(u) {
      return (u || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function fmt(t) {
      try {
        var d = new Date(t);
        var now = new Date();
        var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        if (d.toDateString() === now.toDateString()) return hm;
        return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
      } catch (e) { return ''; }
    }
    function currentUser() {
      var u = null;
      try { u = JSON.parse(localStorage.getItem('ueg_current_user') || 'null'); } catch (e) {}
      var t = null;
      try { t = localStorage.getItem('ueg_token'); } catch (e) {}
      if (u && u.username && t) return u;
      if (!t) return null;
      try {
        var b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b.length % 4) b += '=';
        var p = JSON.parse(decodeURIComponent(escape(atob(b))));
        var nm = (p.user_metadata && p.user_metadata.username) || String(p.email || '').split('@')[0];
        return nm ? { username: nm } : null;
      } catch (e) { return null; }
    }
    // 管理员能撤回别人的消息（与 SQL 里的 forum_recall_own 策略对应）。
    // is_admin 由登录时写进 localStorage 的档案带过来，initColor() 会再核对一次。
    function isAdmin() { return !!(me && me.is_admin); }
    function tip(msg, bad) {
      var el = document.getElementById('chatTip');
      el.textContent = msg || '';
      el.style.color = bad ? '#ff9a9a' : '';
    }

    // ---------- 渲染 ----------
    function mediaUrl(kind, path) {
      return DB.publicUrl('forum-media', path);
    }

    function readableInk(hex) {
      var mm = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
      if (!mm) return '#fff';
      var n = parseInt(mm[1], 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#111111' : '#ffffff';
    }

    function msgHtml(m) {
      var mine = me && m.author === me.username;
      var recalled = !!m.recalled_at;
      var avaHtml = '<div class="ava"></div>';
      var cached = EMO_CACHE[m.author];
      if (cached && cached.avatar) avaHtml = '<div class="ava"><img src="' + esc(cached.avatar) + '" alt=""></div>';

      var inner = '';
      if (recalled) {
        inner = '<span class="recalled">该消息已撤回</span>';
      } else if (m.kind === 'image') {
        inner = '<img src="' + esc(mediaUrl('image', m.media_path)) + '" loading="lazy" alt="图片">';
      } else if (m.kind === 'video') {
        inner = '<video src="' + esc(mediaUrl('video', m.media_path)) + '" controls preload="metadata"></video>';
      } else {
        inner = esc(m.body || '');
      }
      var colorStyle = '';
      if (mine && !recalled) {
        var color = myColor || '#3a7afe';
        colorStyle = 'background:' + color + ';color:' + readableInk(color) + ';';
      }
      var allowRecall = !recalled && (mine || isAdmin());
      var recallBtn = (allowRecall && canSoftRecall)
        ? ' <button class="recall" data-recall="' + m.id + '" title="'
          + (mine ? '撤回这条消息' : '管理员撤回这条消息') + '">撤回</button>' : '';
      return '' +
        '<div class="msg' + (mine ? ' mine' : '') + (recalled ? ' recalled-msg' : '') + '" data-id="' + m.id + '">' +
        avaHtml +
        '<div class="stack">' +
        '<div class="who">' + esc(m.author || '?') + ' · ' + fmt(m.created_at) + recallBtn + '</div>' +
        '<div class="bubble" style="' + colorStyle + '">' + inner + '</div>' +
        '</div></div>';
    }

    function appendNewest(rows) {
      var body = document.getElementById('chatBody');
      var html = '';
      rows.forEach(function (m) { MSG_INDEX[m.id] = m; html += msgHtml(m); });
      body.insertAdjacentHTML('beforeend', html);
    }

    function renderOne(m) {
      var el = document.querySelector('.msg[data-id="' + m.id + '"]');
      if (el) el.outerHTML = msgHtml(m);
    }

    // ---------- 拉取 ----------
    async function loadMessages(reset) {
      // 聊天只显示聊天消息：排除帖子（kind=post）与回复（parent_id 非空）
      var url = '/rest/v1/forum_messages?select=id,author,kind,body,media_path,created_at,recalled_at'
        + '&kind=neq.post&parent_id=is.null&order=id.asc&limit=200';
      if (!reset && lastId) url += '&id=gt.' + lastId;
      var r = await DB.rest(url);
      // 数据库还没执行「撤回」那条 SQL（没有 recalled_at 列）时，按旧字段重读一次，
      // 页面不至于挂掉，只是没有撤回按钮
      if (r.code === 400 && String(r.msg || '').indexOf('recalled_at') >= 0) {
        canSoftRecall = false;
        r = await DB.rest(url.replace(',recalled_at', ''));
      }
      var rows = (r.code === 200 && Array.isArray(r.data)) ? r.data : [];
      var body = document.getElementById('chatBody');
      if (reset) {
        body.innerHTML = rows.length ? '' : '<div class="tips">还没有消息，来说第一句吧</div>';
      }
      if (rows.length) {
        appendNewest(rows);
        lastId = rows[rows.length - 1].id;
        body.scrollTop = body.scrollHeight;
      }
      await loadAvatars(rows);
    }

    // 定期整表重拉：id 增量同步看不到别人的撤回，这里补一次（尽量不打断阅读位置）
    async function refreshAll() {
      var body = document.getElementById('chatBody');
      var atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 40;
      var keep = body.scrollTop;
      await loadMessages(true);
      if (!atBottom) body.scrollTop = keep;
    }

    // 只重拉最近 30 条：别人的撤回不用等整表重拉（60 秒）就能就地更新
    async function syncRecent() {
      var url = '/rest/v1/forum_messages?select=id,author,kind,body,media_path,created_at,recalled_at'
        + '&kind=neq.post&parent_id=is.null'
        + '&order=id.desc&limit=30';
      var r = await DB.rest(url);
      if (r.code === 400 && String(r.msg || '').indexOf('recalled_at') >= 0) {
        canSoftRecall = false;
        r = await DB.rest(url.replace(',recalled_at', ''));
      }
      if (r.code !== 200 || !Array.isArray(r.data)) return;
      r.data.forEach(function (m) {
        var old = MSG_INDEX[m.id];
        if (!old) return;
        var changed = (!!old.recalled_at !== !!m.recalled_at)
          || String(old.body || '') !== String(m.body || '')
          || String(old.media_path || '') !== String(m.media_path || '');
        if (!changed) return;
        MSG_INDEX[m.id] = m;
        renderOne(m);
      });
    }

    async function loadAvatars(rows) {
      var names = [];
      rows.forEach(function (m) { if (m.author && !EMO_CACHE[m.author] && names.indexOf(m.author) < 0) names.push(m.author); });
      if (!names.length) return;
      var q = names.map(function (n) { return encodeURIComponent(n); }).join(',');
      var r = await DB.rest('/rest/v1/users?select=username,avatar_url&username=in.(' + q + ')');
      if (r.code === 200 && Array.isArray(r.data)) {
        r.data.forEach(function (u) { EMO_CACHE[u.username] = { avatar: u.avatar_url || '' }; });
      }
      // 请求失败时不写缓存：原来失败也写空值，本次会话就不再重试，头像永远缺
    }

    // ---------- 发送 ----------
    async function send(kind, body, mediaPath) {
      if (!me) { tip('请先登录后再发言', true); return; }
      var row = { author: me.username, kind: kind, body: body || null, media_path: mediaPath || null, bubble_color: myColor || null };
      var r = await DB.rest('/rest/v1/forum_messages', { method: 'POST', body: row, prefer: 'return=minimal' });
      if (r.code === 200 || r.code === 201) { tip(''); await loadMessages(false); }
      else tip('发送失败：' + (r.msg || ''), true);
    }

    async function sendText() {
      var el = document.getElementById('txt');
      var v = (el.value || '').trim();
      if (!v) return;
      el.value = '';
      await send('text', v, null);
    }

    async function sendEmoji(e) {
      await send('text', e, null);
    }

    async function uploadMedia(file, kind) {
      if (!me) { tip('请先登录后再上传', true); return; }
      if (!file) return;
      tip('上传中…');
      var ext = (file.name.split('.').pop() || (kind === 'video' ? 'mp4' : 'png')).toLowerCase().replace(/[^a-z0-9]/g, '');
      var path = DB.folderOf(me.username) + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + '.' + ext;
      var up = await DB.upload('forum-media', path, file, file.type);
      if (up.code !== 200) { tip('上传失败：' + (up.msg || ''), true); return; }
      await send(kind, null, path);
      tip('');
    }

    // ==================== 帖子模式（列表 / 详情 / 发帖 / 平铺回复） ====================
    var currentView = 'chat';
    var currentPostId = null;
    var pendingPostMedia = null;     // {kind, path}：发帖弹窗里已上传的媒体

    function tip2(id, msg, bad) {
      var el = document.getElementById(id);
      if (!el) return;
      el.textContent = msg || '';
      el.style.color = bad ? '#ff9a9a' : '';
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('viewChat').style.display = view === 'chat' ? 'flex' : 'none';
      document.getElementById('viewPosts').style.display = view === 'posts' ? 'flex' : 'none';
      document.getElementById('postDetail').style.display = 'none';
      document.getElementById('tabChat').classList.toggle('active', view === 'chat');
      document.getElementById('tabPosts').classList.toggle('active', view === 'posts');
      if (view === 'posts') loadPosts();
    }

    function postMediaHtml(path) {
      if (!path) return '';
      return /\.(mp4|webm|mov)$/i.test(path)
        ? '<video src="' + esc(mediaUrl('video', path)) + '" controls preload="metadata"></video>'
        : '<img src="' + esc(mediaUrl('image', path)) + '" loading="lazy" alt="图片">';
    }

    // 主帖与回复统一渲染：isMain 时带标题；撤回/权限按钮与聊天一致
    function postHtml(m, isMain) {
      var mine = me && m.author === me.username;
      var recalled = !!m.recalled_at;
      var cached = EMO_CACHE[m.author];
      var ava = (cached && cached.avatar)
        ? '<img class="avatar" src="' + esc(cached.avatar) + '" alt="">'
        : '<div class="avatar"></div>';
      var head = '<div class="reply-name">' + esc(m.author || '?') + ' · ' + fmt(m.created_at);
      if (!recalled && canSoftRecall && (mine || isAdmin())) {
        head += ' <button class="recall" data-recall="' + m.id + '" title="'
          + (mine ? '撤回' : '管理员撤回') + '">撤回</button>';
      }
      head += '</div>';
      var inner;
      if (recalled) {
        inner = '<div class="reply-text" style="opacity:.55">该消息已撤回</div>';
      } else {
        inner = '';
        if (m.body) inner += '<div class="reply-text">' + esc(m.body) + '</div>';
        if (m.media_path) inner += '<div class="reply-text">' + postMediaHtml(m.media_path) + '</div>';
      }
      return '<div class="reply-item" data-id="' + m.id + '">' + ava +
        '<div class="reply-body">' +
        (isMain && m.title ? '<h2 class="post-title">' + esc(m.title) + '</h2>' : '') +
        head + inner + '</div></div>';
    }

    async function loadPosts() {
      var list = document.getElementById('postList');
      list.innerHTML = '<div class="tips">加载中…</div>';
      var r = await DB.rest('/rest/v1/forum_messages?select=id,author,title,body,media_path,created_at,recalled_at'
        + '&parent_id=is.null&kind=eq.post&order=id.desc&limit=100');
      if (r.code === 400) {
        list.innerHTML = '<div class="tips">帖子功能未就绪：数据库缺少 title/parent_id 列（执行 ops 迁移后重试）</div>';
        return;
      }
      var rows = (r.code === 200 && Array.isArray(r.data)) ? r.data : [];
      rows = rows.filter(function (m) { return !m.recalled_at; });
      if (!rows.length) {
        list.innerHTML = '<div class="tips">还没有帖子，点「＋ 发帖」来第一帖</div>';
        return;
      }
      // 回复数：对本页主帖一次批量统计（不依赖外键/内嵌资源）
      var cnt = {};
      var ids = rows.map(function (m) { return m.id; }).join(',');
      if (ids) {
        var r2 = await DB.rest('/rest/v1/forum_messages?select=parent_id&parent_id=in.(' + ids + ')&limit=1000');
        if (r2.code === 200 && Array.isArray(r2.data)) {
          r2.data.forEach(function (x) { cnt[x.parent_id] = (cnt[x.parent_id] || 0) + 1; });
        }
      }
      list.innerHTML = rows.map(function (m) {
        var preview = String(m.body || '').replace(/\s+/g, ' ').slice(0, 60);
        var mediaTag = m.media_path ? (/\.(mp4|webm|mov)$/i.test(m.media_path) ? '含视频' : '含图片') : '';
        return '<div class="post-item" data-id="' + m.id + '">' +
          '<h3>' + esc(m.title || '(无标题)') + '</h3>' +
          '<div class="post-meta"><span>' + esc(m.author || '?') + '</span>' +
          '<span>' + fmt(m.created_at) + '</span>' +
          '<span>' + (cnt[m.id] || 0) + ' 条回复</span>' +
          (mediaTag ? '<span>' + mediaTag + '</span>' : '') +
          '</div>' +
          (preview ? '<div class="post-preview">' + esc(preview) + '</div>' : '') +
          '</div>';
      }).join('');
      list.querySelectorAll('.post-item').forEach(function (el) {
        el.addEventListener('click', function () { openPost(parseInt(el.dataset.id, 10)); });
      });
      await loadAvatars(rows);
    }

    async function openPost(id, silent) {
      if (!id) return;
      currentPostId = id;
      document.getElementById('viewPosts').style.display = 'none';
      document.getElementById('postDetail').style.display = 'flex';
      var main = document.getElementById('postMain');
      var rl = document.getElementById('replyList');
      var keepScroll = silent ? rl.scrollTop : 0;      // 静默刷新不打断阅读位置
      if (!silent) { main.innerHTML = '<div class="tips">加载中…</div>'; rl.innerHTML = ''; }
      var r = await DB.rest('/rest/v1/forum_messages?select=id,author,title,kind,body,media_path,created_at,recalled_at&id=eq.' + id);
      var p = (r.code === 200 && r.data && r.data[0]) || null;
      if (!p) { main.innerHTML = '<div class="tips">帖子不存在或已删除</div>'; rl.innerHTML = ''; return; }
      main.innerHTML = postHtml(p, true);
      if (p.recalled_at) { rl.innerHTML = '<div class="tips">该帖已撤回</div>'; return; }
      var r2 = await DB.rest('/rest/v1/forum_messages?select=id,author,kind,body,media_path,created_at,recalled_at'
        + '&parent_id=eq.' + id + '&order=id.asc&limit=300');
      var reps = (r2.code === 200 && Array.isArray(r2.data)) ? r2.data : [];
      rl.innerHTML = reps.length ? reps.map(function (m) { return postHtml(m, false); }).join('')
        : '<div class="tips">还没有回复，来说两句吧</div>';
      await loadAvatars(reps.concat([p]));
      if (silent) rl.scrollTop = Math.min(keepScroll, rl.scrollHeight);
    }

    function openPostList() {
      currentPostId = null;
      document.getElementById('postDetail').style.display = 'none';
      switchView('posts');
    }

    // ---------- 发帖 ----------
    function openNewPost() {
      if (!me) { tip2('postTip', '请先登录后再发帖（回主菜单登录）', true); return; }
      pendingPostMedia = null;
      document.getElementById('postTitle').value = '';
      document.getElementById('postBody').value = '';
      document.getElementById('postMediaInfo').textContent = '';
      tip2('newPostTip', '');
      document.getElementById('newPostModal').classList.add('open');
      document.getElementById('postTitle').focus();
    }

    function closeNewPost() {
      document.getElementById('newPostModal').classList.remove('open');
    }

    async function pickPostMedia(file, kind) {
      if (!me) { tip2('newPostTip', '请先登录后再上传', true); return; }
      if (!file) return;
      tip2('newPostTip', '上传中…');
      var ext = (file.name.split('.').pop() || (kind === 'video' ? 'mp4' : 'png')).toLowerCase().replace(/[^a-z0-9]/g, '');
      var path = DB.folderOf(me.username) + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + '.' + ext;
      var up = await DB.upload('forum-media', path, file, file.type || (kind === 'video' ? 'video/mp4' : 'image/png'),
                               kind === 'video' ? 300000 : undefined);
      if (up.code !== 200) { tip2('newPostTip', '上传失败：' + (up.msg || ''), true); return; }
      pendingPostMedia = { kind: kind, path: path };
      document.getElementById('postMediaInfo').textContent = kind === 'video' ? '已选视频 ✓' : '已选图片 ✓';
      tip2('newPostTip', '');
    }

    async function publishPost() {
      if (!me) { tip2('newPostTip', '请先登录后再发帖', true); return; }
      var title = (document.getElementById('postTitle').value || '').trim();
      if (title.length < 2) { tip2('newPostTip', '标题至少 2 个字', true); return; }
      if (title.length > 60) { tip2('newPostTip', '标题最多 60 个字', true); return; }
      var body = (document.getElementById('postBody').value || '').trim();
      if (!body && !pendingPostMedia) { tip2('newPostTip', '正文和图片/视频至少有一个', true); return; }
      var btn = document.getElementById('btnPublishPost');
      btn.disabled = true;
      try {
        var row = {
          author: me.username, kind: 'post', title: title,
          body: body || null,
          media_path: pendingPostMedia ? pendingPostMedia.path : null,
          parent_id: null,
          bubble_color: myColor || null
        };
        var r = await DB.rest('/rest/v1/forum_messages', { method: 'POST', body: row, prefer: 'return=minimal' });
        if (r.code === 200 || r.code === 201) {
          closeNewPost();
          await loadPosts();
          tip2('postTip', '已发布');
        } else {
          tip2('newPostTip', '发布失败：' + (r.msg || ''), true);
        }
      } finally {
        btn.disabled = false;
      }
    }

    // ---------- 回复（平铺楼层） ----------
    async function sendReply() {
      if (!me) { tip2('replyTip', '请先登录后再回复', true); return; }
      if (!currentPostId) return;
      var el = document.getElementById('rtxt');
      var v = (el.value || '').trim();
      if (!v) return;
      var r = await DB.rest('/rest/v1/forum_messages', {
        method: 'POST',
        body: { author: me.username, kind: 'text', body: v, media_path: null,
                parent_id: currentPostId, bubble_color: myColor || null },
        prefer: 'return=minimal'
      });
      if (r.code === 200 || r.code === 201) { el.value = ''; tip2('replyTip', ''); await openPost(currentPostId); }
      else tip2('replyTip', '回复失败：' + (r.msg || ''), true);
    }

    async function uploadReplyMedia(file, kind) {
      if (!me) { tip2('replyTip', '请先登录后再上传', true); return; }
      if (!file || !currentPostId) return;
      tip2('replyTip', '上传中…');
      var ext = (file.name.split('.').pop() || (kind === 'video' ? 'mp4' : 'png')).toLowerCase().replace(/[^a-z0-9]/g, '');
      var path = DB.folderOf(me.username) + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + '.' + ext;
      var up = await DB.upload('forum-media', path, file, file.type || (kind === 'video' ? 'video/mp4' : 'image/png'),
                               kind === 'video' ? 300000 : undefined);
      if (up.code !== 200) { tip2('replyTip', '上传失败：' + (up.msg || ''), true); return; }
      var r = await DB.rest('/rest/v1/forum_messages', {
        method: 'POST',
        body: { author: me.username, kind: kind, body: null, media_path: path,
                parent_id: currentPostId, bubble_color: myColor || null },
        prefer: 'return=minimal'
      });
      if (r.code === 200 || r.code === 201) { tip2('replyTip', ''); await openPost(currentPostId); }
      else tip2('replyTip', '发送失败：' + (r.msg || ''), true);
    }

    // ---------- 撤回 ----------
    async function recall(id) {
      if (!me) { tip('请先登录后再操作', true); return; }
      var m = MSG_INDEX[id];
      var mine = !!(m && m.author === me.username);
      if (!mine && !isAdmin()) { tip('只能撤回自己的消息', true); return; }
      var ask = mine
        ? '撤回这条消息？撤回后所有人看到的是「该消息已撤回」。'
        : ('以管理员身份撤回「' + ((m && m.author) || '该用户') + '」的消息？');
      if (!confirm(ask)) return;
      var at = new Date().toISOString();
      // 用 return=representation 才能确认「真的改到了」：被 RLS 拦下（0 行命中）时
      // PostgREST 同样返回成功状态码，只看状态码会误报撤回成功。
      var r = await DB.rest('/rest/v1/forum_messages?id=eq.' + id, {
        method: 'PATCH',
        body: { recalled_at: at, body: null, media_path: null },
        prefer: 'return=representation'
      });
      if (r.code !== 200) {
        var why = String(r.msg || '');
        if (why.indexOf('recalled_at') >= 0) why += '（数据库还没执行 ops/forum_recall.sql）';
        tip('撤回失败：' + why, true);
        return;
      }
      if (!Array.isArray(r.data) || !r.data.length) {
        tip('撤回失败：没有权限改动这条消息（请确认已在 Supabase 执行 ops/forum_recall.sql）', true);
        return;
      }
      // 顺手清掉已上传的图片/视频，避免撤回后原图 URL 仍能被打开（失败也不影响撤回）
      if (m && m.media_path && typeof DB.remove === 'function') {
        try { await DB.remove('forum-media', m.media_path); } catch (e) {}
      }
      if (m) {
        m.recalled_at = at;
        m.body = null;
        m.media_path = null;
        renderOne(m);                                  // 聊天视图就地更新
        if (currentView === 'posts' && currentPostId) {
          await openPost(currentPostId, true);         // 帖子视图：主帖/回复重渲染
        }
      } else {
        await loadMessages(true);
      }
      tip(mine ? '已撤回' : '已撤回（管理员）');
    }

    // 撤回按钮：聊天与帖子共用一套委托（document 级，帖子回复区也生效）
    document.addEventListener('click', function (ev) {
      var btn = ev.target && ev.target.closest ? ev.target.closest('[data-recall]') : null;
      if (btn) recall(parseInt(btn.getAttribute('data-recall'), 10));
    });

    // ---------- 气泡颜色 ----------
    async function initColor() {
      var el = document.getElementById('bubbleColor');
      if (!me) return;
      var r = await DB.rest('/rest/v1/users?select=bubble_color,is_admin&username=eq.' + encodeURIComponent(me.username));
      if (r.code === 200 && Array.isArray(r.data) && r.data.length) {
        var row = r.data[0];
        if (row.bubble_color) { myColor = row.bubble_color; el.value = myColor; }
        me.is_admin = !!row.is_admin;   // 管理员可撤回他人消息
      }
      el.addEventListener('change', async function () {
        myColor = el.value;
        var w = await DB.updateMyProfile({ bubble_color: myColor });
        if (w.code !== 200) tip('颜色保存失败：' + (w.msg || ''), true);
        else tip('气泡颜色已保存');
        await loadMessages(true);
      });
    }

    // ---------- 事件 ----------
    document.getElementById('btnSend').addEventListener('click', sendText);
    // 手机上没 Shift 键，Enter 用来换行（用「发送」按钮发）；键盘/鼠标才 Enter 直发
    var touchOnly = !!(window.matchMedia && window.matchMedia('(hover: none)').matches);
    document.getElementById('txt').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !touchOnly) { e.preventDefault(); sendText(); }
    });
    document.getElementById('btnImg').addEventListener('click', function () { document.getElementById('fileImg').click(); });
    document.getElementById('btnVid').addEventListener('click', function () { document.getElementById('fileVid').click(); });
    document.getElementById('fileImg').addEventListener('change', function (e) { uploadMedia(e.target.files[0], 'image'); e.target.value = ''; });
    document.getElementById('fileVid').addEventListener('change', function (e) { uploadMedia(e.target.files[0], 'video'); e.target.value = ''; });

    // ---------- 帖子模式事件 ----------
    document.getElementById('tabChat').addEventListener('click', function () { switchView('chat'); });
    document.getElementById('tabPosts').addEventListener('click', function () { switchView('posts'); });
    document.getElementById('btnReloadPosts').addEventListener('click', function () { loadPosts(); });
    document.getElementById('btnBackPosts').addEventListener('click', openPostList);
    document.getElementById('btnNewPost').addEventListener('click', openNewPost);
    document.getElementById('btnCancelPost').addEventListener('click', closeNewPost);
    document.getElementById('btnPublishPost').addEventListener('click', publishPost);
    document.getElementById('btnReply').addEventListener('click', sendReply);
    document.getElementById('pbtnImg').addEventListener('click', function () { document.getElementById('pfileImg').click(); });
    document.getElementById('pbtnVid').addEventListener('click', function () { document.getElementById('pfileVid').click(); });
    document.getElementById('pfileImg').addEventListener('change', function (e) { pickPostMedia(e.target.files[0], 'image'); e.target.value = ''; });
    document.getElementById('pfileVid').addEventListener('change', function (e) { pickPostMedia(e.target.files[0], 'video'); e.target.value = ''; });
    document.getElementById('rbtnImg').addEventListener('click', function () { document.getElementById('rfileImg').click(); });
    document.getElementById('rbtnVid').addEventListener('click', function () { document.getElementById('rfileVid').click(); });
    document.getElementById('rfileImg').addEventListener('change', function (e) { uploadReplyMedia(e.target.files[0], 'image'); e.target.value = ''; });
    document.getElementById('rfileVid').addEventListener('change', function (e) { uploadReplyMedia(e.target.files[0], 'video'); e.target.value = ''; });
    document.getElementById('rtxt').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !touchOnly) { e.preventDefault(); sendReply(); }
    });
    // 发帖弹窗：点空白处关闭
    document.getElementById('newPostModal').addEventListener('click', function (e) {
      if (e.target && e.target.id === 'newPostModal') closeNewPost();
    });

    var bar = document.getElementById('emojiBar');
    EMOS.forEach(function (e) {
      var s = document.createElement('span');
      s.textContent = e;
      s.addEventListener('click', function () { sendEmoji(e); });
      bar.appendChild(s);
    });
    document.getElementById('btnEmoji').addEventListener('click', function () {
      bar.style.display = bar.style.display === 'flex' ? 'none' : 'flex';
    });

    (async function init() {
      try { if (window.UEG_SESSION_READY) await window.UEG_SESSION_READY; } catch (e) {}
      me = currentUser();
      if (!me) tip('未登录：可以浏览，登录后才能发言（回主菜单登录）', true);
      await initColor();
      await loadMessages(true);
      timer = setInterval(function () {
        polls++;
        if (document.hidden) return;   // 页面在后台/切走时不轮询（省请求、省连接占用）
        if (currentView === 'posts') {
          // 帖子视图：详情页静默刷新（保留滚动位置）；列表页低频刷新
          if (currentPostId && document.getElementById('postDetail').style.display !== 'none') {
            openPost(currentPostId, true);
          } else if (polls % 6 === 0) {
            loadPosts();
          }
          return;
        }
        loadMessages(false);                   // 拉新消息（增量）
        syncRecent();                          // 同一条被别人撤回/改动时就地更新
        if (polls % 12 === 0) refreshAll();    // 兜底：整表重拉（也能同步「硬删除」）
      }, 5000);
    })();
  </script>
</body>
