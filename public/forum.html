<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>公会论坛 - UEG小网站</title>
  <link rel="stylesheet" href="rhine-fonts.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="rhine-fonts.css"></noscript>
  <link rel="stylesheet" href="rhine.css">
  <link rel="stylesheet" href="rhine-motion.css">
  <script src="rhine-motion.js"></script>
  <style>
    :root { --bubble-me: #3a7afe; --bubble-other: var(--rl-field); }
    .chat-wrap { max-width: 900px; margin: 12px auto 0; padding: 0 12px 12px; display: flex; flex-direction: column;
      height: calc(100vh - 24px); height: calc(100dvh - 24px);
      padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    .chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 4px; }
    .chat-head h1 { font-size: 20px; margin: 0; }
    .chat-head .spacer { flex: 1; }
    .color-pick { display: flex; align-items: center; gap: 6px; font-size: 13px; opacity: .9; }
    .color-pick input[type=color] { width: 30px; height: 24px; border: none; background: none; padding: 0; }
    .chat-body { flex: 1; overflow-y: auto; padding: 8px; border: 1px solid var(--rl-line-soft);
      border-radius: 14px; background: var(--rl-panel); }
    .msg { display: flex; gap: 8px; margin: 10px 2px; align-items: flex-start; }
    .msg .ava { width: 34px; height: 34px; border-radius: 50%; background: var(--rl-field); flex: 0 0 34px;
      display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 16px; }
    .msg .ava img { width: 100%; height: 100%; object-fit: cover; }
    .msg .stack { max-width: 72%; }
    .msg .who { font-size: 12px; opacity: .6; margin: 0 0 3px 2px; }
    .bubble { display: inline-block; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.6;
      word-break: break-word; white-space: pre-wrap; background: var(--bubble-other); color: var(--rl-ink); }
    .bubble img, .bubble video { max-width: 100%; border-radius: 10px; display: block; }
    .msg.mine { flex-direction: row-reverse; }
    .msg.mine .who { text-align: right; margin-right: 2px; }
    .msg.mine .stack { display: flex; flex-direction: column; align-items: flex-end; }
    .chat-input { display: flex; gap: 8px; align-items: flex-end; padding: 10px 0 0; }
    .chat-input textarea { flex: 1; min-height: 44px; max-height: 130px; resize: none; padding: 10px 12px;
      border-radius: 12px; border: 1px solid var(--rl-line); background: var(--rl-field); color: var(--rl-ink); font-size: 14px; }
    .tool { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--rl-line);
      background: var(--rl-field); color: var(--rl-ink); cursor: pointer; font-size: 18px; }
    .send { padding: 0 16px; height: 40px; border-radius: 10px; border: 1px solid var(--rl-accent);
      background: var(--rl-accent); color: var(--rl-paper); cursor: pointer; }
    .emoji-bar { display: none; flex-wrap: wrap; gap: 6px; padding: 8px 0 0; }
    .emoji-bar span { cursor: pointer; font-size: 20px; padding: 2px 4px; border-radius: 6px; }
    .emoji-bar span:hover { background: var(--rl-accent-soft); }
    .tips { font-size: 12px; opacity: .6; padding: 6px 2px 0; }
    .msg .recall { margin-left: 6px; padding: 0 5px; border: 1px solid var(--rl-line-soft); border-radius: 4px;
      background: transparent; color: var(--rl-muted); font-size: 11px; line-height: 16px; cursor: pointer; }
    @media (hover: hover) { .msg .recall { opacity: 0; } .msg:hover .recall { opacity: 1; } }
    .bubble .recalled { opacity: .55; font-style: italic; }
    .msg.recalled-msg .bubble { background: var(--rl-field); color: var(--rl-muted); }
    @media (max-width: 700px) {
      .chat-head { flex-wrap: wrap; row-gap: 6px; }
      .chat-input textarea { font-size: 16px; min-height: 44px; }
      .msg .stack { max-width: 80%; }
      .color-pick input[type=color] { width: 46px; height: 40px; }
    }
    @media (hover: none) { .msg .recall { min-height: 32px; padding: 0 10px; font-size: 12px; } }
  </style>
</head>
<body>
  <div class="chat-wrap">
    <div class="chat-head">
      <h1>💬 公会论坛</h1>
      <div class="spacer"></div>
      <label class="color-pick">我的气泡
        <input type="color" id="bubbleColor" value="#3a7afe">
      </label>
      <a href="guild.html" class="back-link">← 公会</a>
    </div>

    <div class="chat-body" id="chatBody">
      <div class="tips">加载中…</div>
    </div>

    <div class="emoji-bar" id="emojiBar"></div>

    <div class="chat-input">
      <button class="tool" id="btnEmoji" title="表情">😊</button>
      <button class="tool" id="btnImg" title="发图片">🖼️</button>
      <button class="tool" id="btnVid" title="发视频">🎬</button>
      <input type="file" id="fileImg" accept="image/*" style="display:none">
      <input type="file" id="fileVid" accept="video/*" style="display:none">
      <textarea id="txt" placeholder="说点什么…" enterkeyhint="send" title="Enter 发送，Shift+Enter 换行"></textarea>
      <button class="send" id="btnSend">发送</button>
    </div>
    <div class="tips" id="chatTip"></div>
  </div>

  <script src="../config.js"></script>
  <script src="../github-db.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    var EMOS = ['😀','😄','😁','😆','😉','😊','😍','🤩','😎','🤔','😏','😢','😭','😡','👍','👎','👏','🙏','💪','🎉','🔥','✨','❤️','💔','🚀','🛰️','⚔️','🛡️','🧭','📦','🎯','💎','⭐','🌟','⚡','🫡'];
    var EMO_CACHE = {};
    var me = null, myColor = '#3a7afe', lastId = 0, timer = null, polls = 0, canSoftRecall = true;
    var MSG_INDEX = {};   // id → 消息行（撤回后就地重渲染，不整页重载）

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function userName(u) {
      return (u || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function fmt(t) {
      try {
        var d = new Date(t);
        var now = new Date();
        var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        if (d.toDateString() === now.toDateString()) return hm;
        return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
      } catch (e) { return ''; }
    }
    function currentUser() {
      var u = null;
      try { u = JSON.parse(localStorage.getItem('ueg_current_user') || 'null'); } catch (e) {}
      var t = null;
      try { t = localStorage.getItem('ueg_token'); } catch (e) {}
      if (u && u.username && t) return u;
      if (!t) return null;
      try {
        var b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b.length % 4) b += '=';
        var p = JSON.parse(decodeURIComponent(escape(atob(b))));
        var nm = (p.user_metadata && p.user_metadata.username) || String(p.email || '').split('@')[0];
        return nm ? { username: nm } : null;
      } catch (e) { return null; }
    }
    // 管理员能撤回别人的消息（与 SQL 里的 forum_recall_own 策略对应）。
    // is_admin 由登录时写进 localStorage 的档案带过来，initColor() 会再核对一次。
    function isAdmin() { return !!(me && me.is_admin); }
    function tip(msg, bad) {
      var el = document.getElementById('chatTip');
      el.textContent = msg || '';
      el.style.color = bad ? '#ff9a9a' : '';
    }

    // ---------- 渲染 ----------
    function mediaUrl(kind, path) {
      return DB.publicUrl('forum-media', path);
    }

    function readableInk(hex) {
      var mm = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
      if (!mm) return '#fff';
      var n = parseInt(mm[1], 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#111111' : '#ffffff';
    }

    function msgHtml(m) {
      var mine = me && m.author === me.username;
      var recalled = !!m.recalled_at;
      var avaHtml = '<div class="ava">👤</div>';
      var cached = EMO_CACHE[m.author];
      if (cached && cached.avatar) avaHtml = '<div class="ava"><img src="' + esc(cached.avatar) + '" alt=""></div>';

      var inner = '';
      if (recalled) {
        inner = '<span class="recalled">该消息已撤回</span>';
      } else if (m.kind === 'image') {
        inner = '<img src="' + esc(mediaUrl('image', m.media_path)) + '" loading="lazy" alt="图片">';
      } else if (m.kind === 'video') {
        inner = '<video src="' + esc(mediaUrl('video', m.media_path)) + '" controls preload="metadata"></video>';
      } else {
        inner = esc(m.body || '');
      }
      var colorStyle = '';
      if (mine && !recalled) {
        var color = myColor || '#3a7afe';
        colorStyle = 'background:' + color + ';color:' + readableInk(color) + ';';
      }
      var allowRecall = !recalled && (mine || isAdmin());
      var recallBtn = (allowRecall && canSoftRecall)
        ? ' <button class="recall" data-recall="' + m.id + '" title="'
          + (mine ? '撤回这条消息' : '管理员撤回这条消息') + '">撤回</button>' : '';
      return '' +
        '<div class="msg' + (mine ? ' mine' : '') + (recalled ? ' recalled-msg' : '') + '" data-id="' + m.id + '">' +
        avaHtml +
        '<div class="stack">' +
        '<div class="who">' + esc(m.author || '?') + ' · ' + fmt(m.created_at) + recallBtn + '</div>' +
        '<div class="bubble" style="' + colorStyle + '">' + inner + '</div>' +
        '</div></div>';
    }

    function appendNewest(rows) {
      var body = document.getElementById('chatBody');
      var html = '';
      rows.forEach(function (m) { MSG_INDEX[m.id] = m; html += msgHtml(m); });
      body.insertAdjacentHTML('beforeend', html);
    }

    function renderOne(m) {
      var el = document.querySelector('.msg[data-id="' + m.id + '"]');
      if (el) el.outerHTML = msgHtml(m);
    }

    // ---------- 拉取 ----------
    async function loadMessages(reset) {
      var url = '/rest/v1/forum_messages?select=id,author,kind,body,media_path,created_at,recalled_at&order=id.asc&limit=200';
      if (!reset && lastId) url += '&id=gt.' + lastId;
      var r = await DB.rest(url);
      // 数据库还没执行「撤回」那条 SQL（没有 recalled_at 列）时，按旧字段重读一次，
      // 页面不至于挂掉，只是没有撤回按钮
      if (r.code === 400 && String(r.msg || '').indexOf('recalled_at') >= 0) {
        canSoftRecall = false;
        r = await DB.rest(url.replace(',recalled_at', ''));
      }
      var rows = (r.code === 200 && Array.isArray(r.data)) ? r.data : [];
      var body = document.getElementById('chatBody');
      if (reset) {
        body.innerHTML = rows.length ? '' : '<div class="tips">还没有消息，来说第一句吧</div>';
      }
      if (rows.length) {
        appendNewest(rows);
        lastId = rows[rows.length - 1].id;
        body.scrollTop = body.scrollHeight;
      }
      await loadAvatars(rows);
    }

    // 定期整表重拉：id 增量同步看不到别人的撤回，这里补一次（尽量不打断阅读位置）
    async function refreshAll() {
      var body = document.getElementById('chatBody');
      var atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 40;
      var keep = body.scrollTop;
      await loadMessages(true);
      if (!atBottom) body.scrollTop = keep;
    }

    // 只重拉最近 30 条：别人的撤回不用等整表重拉（60 秒）就能就地更新
    async function syncRecent() {
      var url = '/rest/v1/forum_messages?select=id,author,kind,body,media_path,created_at,recalled_at'
        + '&order=id.desc&limit=30';
      var r = await DB.rest(url);
      if (r.code === 400 && String(r.msg || '').indexOf('recalled_at') >= 0) {
        canSoftRecall = false;
        r = await DB.rest(url.replace(',recalled_at', ''));
      }
      if (r.code !== 200 || !Array.isArray(r.data)) return;
      r.data.forEach(function (m) {
        var old = MSG_INDEX[m.id];
        if (!old) return;
        var changed = (!!old.recalled_at !== !!m.recalled_at)
          || String(old.body || '') !== String(m.body || '')
          || String(old.media_path || '') !== String(m.media_path || '');
        if (!changed) return;
        MSG_INDEX[m.id] = m;
        renderOne(m);
      });
    }

    async function loadAvatars(rows) {
      var names = [];
      rows.forEach(function (m) { if (m.author && !EMO_CACHE[m.author] && names.indexOf(m.author) < 0) names.push(m.author); });
      if (!names.length) return;
      var q = names.map(function (n) { return encodeURIComponent(n); }).join(',');
      var r = await DB.rest('/rest/v1/users?select=username,avatar_url&username=in.(' + q + ')');
      if (r.code === 200 && Array.isArray(r.data)) {
        r.data.forEach(function (u) { EMO_CACHE[u.username] = { avatar: u.avatar_url || '' }; });
      } else {
        names.forEach(function (n) { EMO_CACHE[n] = {}; });
      }
    }

    // ---------- 发送 ----------
    async function send(kind, body, mediaPath) {
      if (!me) { tip('请先登录后再发言', true); return; }
      var row = { author: me.username, kind: kind, body: body || null, media_path: mediaPath || null, bubble_color: myColor || null };
      var r = await DB.rest('/rest/v1/forum_messages', { method: 'POST', body: row, prefer: 'return=minimal' });
      if (r.code === 200 || r.code === 201) { tip(''); await loadMessages(false); }
      else tip('发送失败：' + (r.msg || ''), true);
    }

    async function sendText() {
      var el = document.getElementById('txt');
      var v = (el.value || '').trim();
      if (!v) return;
      el.value = '';
      await send('text', v, null);
    }

    async function sendEmoji(e) {
      await send('text', e, null);
    }

    async function uploadMedia(file, kind) {
      if (!me) { tip('请先登录后再上传', true); return; }
      if (!file) return;
      tip('上传中…');
      var ext = (file.name.split('.').pop() || (kind === 'video' ? 'mp4' : 'png')).toLowerCase().replace(/[^a-z0-9]/g, '');
      var path = me.username + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + '.' + ext;
      var up = await DB.upload('forum-media', path, file, file.type);
      if (up.code !== 200) { tip('上传失败：' + (up.msg || ''), true); return; }
      await send(kind, null, path);
      tip('');
    }

    // ---------- 撤回 ----------
    async function recall(id) {
      if (!me) { tip('请先登录后再操作', true); return; }
      var m = MSG_INDEX[id];
      var mine = !!(m && m.author === me.username);
      if (!mine && !isAdmin()) { tip('只能撤回自己的消息', true); return; }
      var ask = mine
        ? '撤回这条消息？撤回后所有人看到的是「该消息已撤回」。'
        : ('以管理员身份撤回「' + ((m && m.author) || '该用户') + '」的消息？');
      if (!confirm(ask)) return;
      var at = new Date().toISOString();
      // 用 return=representation 才能确认「真的改到了」：被 RLS 拦下（0 行命中）时
      // PostgREST 同样返回成功状态码，只看状态码会误报撤回成功。
      var r = await DB.rest('/rest/v1/forum_messages?id=eq.' + id, {
        method: 'PATCH',
        body: { recalled_at: at, body: null, media_path: null },
        prefer: 'return=representation'
      });
      if (r.code !== 200) {
        var why = String(r.msg || '');
        if (why.indexOf('recalled_at') >= 0) why += '（数据库还没执行 ops/forum_recall.sql）';
        tip('撤回失败：' + why, true);
        return;
      }
      if (!Array.isArray(r.data) || !r.data.length) {
        tip('撤回失败：没有权限改动这条消息（请确认已在 Supabase 执行 ops/forum_recall.sql）', true);
        return;
      }
      // 顺手清掉已上传的图片/视频，避免撤回后原图 URL 仍能被打开（失败也不影响撤回）
      if (m && m.media_path && typeof DB.remove === 'function') {
        try { await DB.remove('forum-media', m.media_path); } catch (e) {}
      }
      if (m) {
        m.recalled_at = at;
        m.body = null;
        m.media_path = null;
        renderOne(m);
      } else {
        await loadMessages(true);
      }
      tip(mine ? '已撤回' : '已撤回（管理员）');
    }

    document.getElementById('chatBody').addEventListener('click', function (ev) {
      var btn = ev.target && ev.target.closest ? ev.target.closest('[data-recall]') : null;
      if (btn) recall(parseInt(btn.getAttribute('data-recall'), 10));
    });

    // ---------- 气泡颜色 ----------
    async function initColor() {
      var el = document.getElementById('bubbleColor');
      if (!me) return;
      var r = await DB.rest('/rest/v1/users?select=bubble_color,is_admin&username=eq.' + encodeURIComponent(me.username));
      if (r.code === 200 && Array.isArray(r.data) && r.data.length) {
        var row = r.data[0];
        if (row.bubble_color) { myColor = row.bubble_color; el.value = myColor; }
        me.is_admin = !!row.is_admin;   // 管理员可撤回他人消息
      }
      el.addEventListener('change', async function () {
        myColor = el.value;
        var w = await DB.updateMyProfile({ bubble_color: myColor });
        if (w.code !== 200) tip('颜色保存失败：' + (w.msg || ''), true);
        else tip('气泡颜色已保存');
        await loadMessages(true);
      });
    }

    // ---------- 事件 ----------
    document.getElementById('btnSend').addEventListener('click', sendText);
    // 手机上没 Shift 键，Enter 用来换行（用「发送」按钮发）；键盘/鼠标才 Enter 直发
    var touchOnly = !!(window.matchMedia && window.matchMedia('(hover: none)').matches);
    document.getElementById('txt').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !touchOnly) { e.preventDefault(); sendText(); }
    });
    document.getElementById('btnImg').addEventListener('click', function () { document.getElementById('fileImg').click(); });
    document.getElementById('btnVid').addEventListener('click', function () { document.getElementById('fileVid').click(); });
    document.getElementById('fileImg').addEventListener('change', function (e) { uploadMedia(e.target.files[0], 'image'); e.target.value = ''; });
    document.getElementById('fileVid').addEventListener('change', function (e) { uploadMedia(e.target.files[0], 'video'); e.target.value = ''; });

    var bar = document.getElementById('emojiBar');
    EMOS.forEach(function (e) {
      var s = document.createElement('span');
      s.textContent = e;
      s.addEventListener('click', function () { sendEmoji(e); });
      bar.appendChild(s);
    });
    document.getElementById('btnEmoji').addEventListener('click', function () {
      bar.style.display = bar.style.display === 'flex' ? 'none' : 'flex';
    });

    (async function init() {
      try { if (window.UEG_SESSION_READY) await window.UEG_SESSION_READY; } catch (e) {}
      me = currentUser();
      if (!me) tip('未登录：可以浏览，登录后才能发言（右上角账号设置）', true);
      await initColor();
      await loadMessages(true);
      timer = setInterval(function () {
        polls++;
        loadMessages(false);                   // 拉新消息（增量）
        syncRecent();                          // 同一条被别人撤回/改动时就地更新
        if (polls % 12 === 0) refreshAll();    // 兜底：整表重拉（也能同步「硬删除」）
      }, 5000);
    })();
  </script>
</body>
</html>
