<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MATA - UEG小网站</title>
  <link rel="stylesheet" href="rhine-fonts.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="rhine-fonts.css"></noscript>
  <link rel="stylesheet" href="rhine.css">
  <link rel="stylesheet" href="rhine-motion.css">
  <script src="rhine-motion.js"></script>
  <style>
    .mata-wrap { max-width: 1080px; margin: 0 auto; padding: 18px 14px 60px; }
    .mata-hero { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .mata-hero h1 { margin: 0; font-size: 30px; letter-spacing: 2px; }
    .mata-tag { font-size: 12px; opacity: .7; }
    .mata-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0 22px; }
    @media (max-width: 820px) { .mata-cards { grid-template-columns: 1fr; } }
    .mata-card { background: var(--rl-panel); border: 1px solid var(--rl-line-soft); border-radius: 14px;
      padding: 16px 16px 14px; color: var(--rl-ink); }
    .mata-card h2 { margin: 0 0 10px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .mata-card p, .mata-card li { font-size: 14px; line-height: 1.75; opacity: .92; }
    .mata-card ul { margin: 6px 0 0 18px; padding: 0; }
    .mata-note { font-size: 12px; opacity: .65; margin-top: 10px; }
    .drop-zone { border: 2px dashed var(--rl-line); border-radius: 12px; padding: 18px; text-align: center;
      cursor: pointer; transition: .2s; background: var(--rl-field); color: var(--rl-ink); }
    .drop-zone:hover, .drop-zone.on { border-color: var(--rl-accent); background: var(--rl-accent-soft); }
    .preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .preview img { width: 74px; height: 74px; object-fit: cover; border-radius: 8px; border: 1px solid var(--rl-line-soft); }
    .mata-btn { display: inline-block; margin-top: 12px; padding: 9px 18px; border-radius: 10px;
      border: 1px solid var(--rl-accent); background: var(--rl-accent); color: var(--rl-paper);
      cursor: pointer; font-size: 14px; }
    .mata-btn:not(:disabled):hover { opacity: .88; }
    .mata-btn:disabled { opacity: .5; cursor: not-allowed; }
    .mata-status { font-size: 13px; margin-top: 10px; min-height: 18px; opacity: .9; }
    .board { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    .board th, .board td { padding: 8px 10px; border-bottom: 1px solid var(--rl-line-soft); text-align: left; }
    .board th { font-weight: 600; opacity: .75; font-size: 13px; }
    .board tr.me td { background: var(--rl-accent-soft); }
    .rank1 { color: var(--rl-accent); } .rank2 { color: var(--rl-body); } .rank3 { color: var(--rl-muted); }
    .my-stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; margin-top: 8px; opacity: .95; }
  </style>
</head>
<body>
  <div class="mata-wrap">
    <div class="mata-hero">
      <h1>MATA</h1>
      <span class="mata-tag">星际猎人自动化助手 · 素材共享计划</span>
      <a href="../index.html" class="back-link" style="margin-left:auto;">← 返回主菜单</a>
    </div>

    <div class="mata-cards">
      <!-- 卡片二：截图 / 录屏上传 -->
      <div class="mata-card">
        <h2>上传游戏截图 / 录屏</h2>
        <p>手机或电脑都能传。多选、拖拽都行。图片：jpg / png / webp / heic；录屏：mp4 / mov / webm（单个视频 ≤ 50MB）。</p>
        <div class="drop-zone" id="dropZone">
          <div>点这里选择截图或录屏，也可拖进来</div>
          <div class="mata-note" id="zoneHint">上传需要先登录：回主菜单登录后再传，素材才记在你名下。</div>
          <!-- capture="environment" 会强制走相机、且有它时 multiple 被忽略 —— 手机上
               就选不到相册里的截图（页面还写着「手机也能传」）。改为普通选择器。 -->
          <input type="file" id="fileInput" accept="image/*,video/*,.heic,.heif,.mp4,.mov,.m4v,.webm,.mkv,.avi" multiple style="display:none">
        </div>
        <div class="preview" id="preview"></div>
        <button class="mata-btn" id="btnUpload" disabled>上传到素材库</button>
        <div class="mata-status" id="upStatus"></div>
      </div>
    </div>

    <!-- 排行榜 -->
    <div class="mata-card">
      <h2>素材贡献排行榜</h2>
      <p class="mata-note">已上传 = 传过的全部截图与录屏（含审核中）。</p>
      <div class="my-stats" id="myStats"></div>
      <table class="board" id="board">
        <thead><tr><th>名次</th><th>用户</th><th>已上传</th><th>最近上传</th></tr></thead>
        <tbody><tr><td colspan="4">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../github-db.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    var files = [];
    var uploading = false;

    // 上传是本页内的 await 循环，切走/关掉页面必然中断 —— 上传中先拦一道。
    // （文件对象无法序列化，所以不能靠 localStorage 续传，只能阻止误退）
    window.addEventListener('beforeunload', function (e) {
      if (!uploading) return;
      e.preventDefault();
      e.returnValue = '';
      return '';
    });
    var me = null;

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmt(t) {
      if (!t) return '-';
      try { return new Date(t).toLocaleString('zh-CN', { hour12: false }); } catch (e) { return t; }
    }
    function currentUser() {
      var u = null;
      try { u = JSON.parse(localStorage.getItem('ueg_current_user') || 'null'); } catch (e) {}
      var t = null;
      try { t = localStorage.getItem('ueg_token'); } catch (e) {}
      if (u && u.username && t) return u;
      if (!t) return null;
      try {
        var b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b.length % 4) b += '=';
        var p = JSON.parse(decodeURIComponent(escape(atob(b))));
        var nm = (p.user_metadata && p.user_metadata.username) || String(p.email || '').split('@')[0];
        return nm ? { username: nm } : null;
      } catch (e) { return null; }
    }

    // ---------- 上传区 ----------
    var dz = document.getElementById('dropZone');
    var fi = document.getElementById('fileInput');
    var pv = document.getElementById('preview');
    var btn = document.getElementById('btnUpload');
    var st = document.getElementById('upStatus');

    // 只有直接点到 dropZone 才触发。fi 是 dz 的子元素，不加判断时
    // fi.click() 冒泡回 dz 会再次触发本处理，形成递归。
    dz.addEventListener('click', function (ev) { if (ev.target !== fi) fi.click(); });
    ['dragenter', 'dragover'].forEach(function (e) {
      dz.addEventListener(e, function (ev) { ev.preventDefault(); dz.classList.add('on'); });
    });
    ['dragleave', 'drop'].forEach(function (e) {
      dz.addEventListener(e, function (ev) { ev.preventDefault(); dz.classList.remove('on'); });
    });
    dz.addEventListener('drop', function (ev) {
      addFiles(ev.dataTransfer && ev.dataTransfer.files);
    });
    fi.addEventListener('change', function () { addFiles(fi.files); });

    // 图片/录屏都收：手机相册选出的 f.type 经常是空串（HEIC/WebP/录屏、部分安卓
    // 选择器），只认 MIME 会把它们静默丢掉 → files 空 → 上传按钮一直灰。按扩展名兜底。
    var IMAGE_EXT = /\.(png|jpe?g|webp|heic|heif|gif|bmp|avif)$/i;
    var VIDEO_EXT = /\.(mp4|mov|m4v|webm|mkv|avi|3gp)$/i;
    var MAX_VIDEO_MB = 50;   // 站点存储单文件上限（超限服务端也会拒，先在前端拦下并提示）

    function fileKind(f) {
      var n = String(f.name || '');
      if (/^video\//.test(f.type || '') || VIDEO_EXT.test(n)) return 'video';
      if (/^image\//.test(f.type || '') || IMAGE_EXT.test(n)) return 'image';
      return '';
    }

    function addFiles(list) {
      if (!list) return;
      var added = 0, skipHuge = 0;
      for (var i = 0; i < list.length; i++) {
        var f = list[i];
        var kind = fileKind(f);
        if (!kind) continue;
        if (kind === 'video' && f.size > MAX_VIDEO_MB * 1024 * 1024) { skipHuge++; continue; }
        f._kind = kind;   // 预览与上传复用这个标记
        files.push(f);
        added++;
      }
      if (skipHuge) {
        setStatus('已跳过 ' + skipHuge + ' 个超过 ' + MAX_VIDEO_MB + 'MB 的视频（请剪短后再传）', false);
      } else if (!added && list.length) {
        setStatus('所选文件不是图片或视频（图片：jpg/png/webp/heic；录屏：mp4/mov/webm）', false);
      }
      renderPreview();
      refreshLoginState();
    }

    function renderPreview() {
      pv.innerHTML = '';
      files.slice(0, 24).forEach(function (f) {
        if (f._kind === 'video') {
          // 视频不做缩略图（解码开销大），显示文件名与体积
          var box = document.createElement('div');
          box.title = f.name;
          box.style.cssText = 'width:72px;height:72px;border-radius:6px;' +
            'background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);' +
            'display:flex;align-items:center;justify-content:center;text-align:center;' +
            'font-size:10px;line-height:1.3;padding:4px;box-sizing:border-box;overflow:hidden;word-break:break-all;';
          box.textContent = '🎬 ' + f.name + ' ' + (f.size / 1048576).toFixed(1) + 'MB';
          pv.appendChild(box);
          return;
        }
        var img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        img.title = f.name;
        pv.appendChild(img);
      });
      // 只按有没有选文件来禁用。以前还带 `|| !currentUser()`，未登录时按钮是灰的，
      // 下面那句「请先登录后再上传」根本弹不出来 —— 用户只看到按钮点不动。
      btn.disabled = files.length === 0;
      var vids = files.filter(function (x) { return x._kind === 'video'; }).length;
      if (!files.length) {
        btn.textContent = '上传到素材库';
      } else if (vids) {
        btn.textContent = '上传到素材库（' + files.length + ' 个：图 ' +
          (files.length - vids) + ' / 视频 ' + vids + '）';
      } else {
        btn.textContent = '上传到素材库（' + files.length + ' 张）';
      }
    }

    function setStatus(msg, ok) {
      st.textContent = msg || '';
      st.style.color = ok === false ? '#ff9a9a' : (ok ? '#9cf0b8' : '');
    }

    btn.addEventListener('click', async function () {
      var u = currentUser();
      if (!u) { setStatus('请先登录后再上传（回主菜单登录）', false); return; }
      if (!files.length) return;
      if (!window.DB) {
        btn.disabled = false;
        setStatus('数据层未加载：请按 Ctrl+F5 强制刷新后重试', false);
        return;
      }
      btn.disabled = true;
      uploading = true;
      var okCount = 0, failCount = 0, firstErr = '';
      try {
        for (var i = 0; i < files.length; i++) {
          var f = files[i];
          var isVid = f._kind === 'video';
          setStatus('上传中 ' + (i + 1) + '/' + files.length +
                    (isVid ? '（视频较大，请保持页面不要切走）' : '') + ' …');
          var ext = (f.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
          var path = DB.folderOf(u.username) + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + '.' + ext;
          // 视频：MIME 为空串时按扩展名兜底（服务端要 Content-Type）+ 给足超时（大文件慢网）
          var ct = f.type || (isVid ? (/\.webm$/i.test(f.name || '') ? 'video/webm' : 'video/mp4') : '');
          var up = await DB.upload('mata-shots', path, f, ct, isVid ? 300000 : undefined);
          // 网络抖一下就重试一次：否则单个失败会直接计入失败，整批白传
          if (up.code !== 200) up = await DB.upload('mata-shots', path, f, ct, isVid ? 300000 : undefined);
          if (up.code !== 200) {
            failCount++;
            if (!firstErr) firstErr = up.msg || ('存储上传失败 HTTP ' + up.code);
            continue;
          }
          var ins = await DB.rest('/rest/v1/mata_shots', {
            method: 'POST',
            body: { uploader: u.username, storage_path: path, file_name: f.name, file_size: f.size },
            prefer: 'return=minimal'
          });
          if (ins.code !== 200 && ins.code !== 201) ins = await DB.rest('/rest/v1/mata_shots', {
            method: 'POST',
            body: { uploader: u.username, storage_path: path, file_name: f.name, file_size: f.size },
            prefer: 'return=minimal'
          });
          if (ins.code === 200 || ins.code === 201) okCount++;
          else {
            failCount++;
            if (!firstErr) firstErr = ins.msg || ('写入记录失败 HTTP ' + ins.code);
          }
        }
      } catch (err) {
        // 没有 finally 的话，任何一次抛异常都会让 uploading 卡在 true，
        // 之后每次离开页面都被 beforeunload 拦住，反而更糟
        failCount++;
        if (!firstErr) firstErr = '上传中断：' + ((err && err.message) || err);
      } finally {
        uploading = false;
        btn.disabled = false;
      }
      files = []; renderPreview();
      // 原来无论成功失败都拼一句「已计入排行榜」，失败的那几个其实没进榜
      setStatus(failCount
        ? '完成：成功 ' + okCount + ' 个（只有成功的计入排行榜），失败 ' + failCount + ' 个（' + (firstErr || '未知原因') + '）'
        : '完成：成功 ' + okCount + ' 个，已计入排行榜。', failCount === 0);
      refreshLoginState();
      loadBoard();
    });

    // 登录态直接摆在提示行上，别再让人猜
    function refreshLoginState() {
      var hint = document.getElementById('zoneHint');
      var u = currentUser();
      if (u && u.username) {
        hint.textContent = '当前登录：' + u.username + '（素材会记在你名下）';
        btn.disabled = !files.length;
      } else {
        hint.textContent = '未登录：回主菜单登录后才能上传。';
        btn.disabled = true;
      }
    }

    // ---------- 排行榜 ----------
    async function loadBoard() {
      var tb = document.querySelector('#board tbody');
      me = currentUser();
      if (!window.DB) {
        tb.innerHTML = '<tr><td colspan="4">数据层未加载：请按 Ctrl+F5 强制刷新</td></tr>';
        return;
      }
      var r = await DB.rest('/rest/v1/mata_leaderboard?select=*');
      var rows = (r.code === 200 && Array.isArray(r.data)) ? r.data : [];
      if (!rows.length) {
        tb.innerHTML = '<tr><td colspan="4">还没有人上传过截图，来传第一张吧</td></tr>';
      } else {
        var html = '';
        rows.forEach(function (row, i) {
          var cls = i === 0 ? 'rank1' : (i === 1 ? 'rank2' : (i === 2 ? 'rank3' : ''));
          var mine = me && me.username === row.uploader ? ' class="me"' : '';
          html += '<tr' + mine + '><td class="' + cls + '">' + (i + 1) + '</td><td>' + esc(row.uploader) +
                  '</td><td>' + row.upload_count +
                  '</td><td>' + fmt(row.last_upload) + '</td></tr>';
        });
        tb.innerHTML = html;
      }
      // 我的统计
      if (me) {
        var my = await DB.rest('/rest/v1/mata_shots?select=id&uploader=eq.' + encodeURIComponent(me.username));
        var list = (my.code === 200 && Array.isArray(my.data)) ? my.data : [];
        document.getElementById('myStats').innerHTML =
          '我上传：<b>' + list.length + '</b> 张';
      } else {
        document.getElementById('myStats').innerHTML = '登录后可查看自己的上传情况。';
      }
    }

    (async function init() {
      await (window.UEG_DB_READY || Promise.resolve());
      var u = currentUser();
      if (u) document.getElementById('zoneHint').textContent = '当前账号：' + u.username;
      try {
        if (window.UEG_SESSION_READY) {
          var s = await window.UEG_SESSION_READY;
          if (s && s.code === 200 && s.data) {
            document.getElementById('zoneHint').textContent = '当前账号：' + s.data.username;
          }
        }
      } catch (e) {}
      loadBoard();
    })();
  </script>
</body>
</html>
