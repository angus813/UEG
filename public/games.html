<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小游戏 - UEG小网站</title>
  <link rel="stylesheet" href="rhine.css">
  <style>
    /* ============ 莱茵生命（Rhine Lab）—— 纯白暖灰 / 柠檬黄 / 直角矩形 ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--rhine-bg);
      color: var(--rhine-body);
      font-family: var(--rhine-body-font);
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 1100px; max-width: 95%;
      background: var(--rhine-panel);
      border: 1px solid var(--rhine-line);
      border-left: 3px solid var(--rhine-accent);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      min-height: 600px;
      margin: 20px auto;
    }
    .container::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 40px; height: 40px;
      border-top: 2px solid var(--rhine-accent); border-left: 2px solid var(--rhine-accent);
    }
    .container::after {
      content: ''; position: absolute; bottom: 0; right: 0;
      width: 40px; height: 40px;
      border-bottom: 2px solid var(--rhine-accent); border-right: 2px solid var(--rhine-accent);
    }
    .menu-view {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 550px; padding: 40px 20px;
    }
    .menu-title {
      display: flex; align-items: center; justify-content: center; gap: 0.4em;
      font-family: var(--rhine-title-font);
      font-size: 2.6rem; font-weight: 800; letter-spacing: 0.1em;
      color: var(--rhine-ink);
      text-transform: uppercase; margin-bottom: 10px;
      text-align: center;
    }
    .menu-title .rhine-mark { font-size: 0.75em; }
    .menu-subtitle {
      font-family: var(--rhine-title-font);
      font-size: 0.9rem; letter-spacing: 0.28em; color: var(--rhine-mute);
      margin-bottom: 60px; text-align: center; text-transform: uppercase;
    }
    .menu-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      justify-items: center;
    }
    .menu-card {
      width: 200px; height: 200px;
      background: var(--rhine-bg);
      border: 1px solid var(--rhine-line);
      border-radius: 2px;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      position: relative;
      text-decoration: none; color: inherit;
    }
    .menu-card::before {
      content: ''; position: absolute; top: -1px; left: -1px;
      width: 14px; height: 14px;
      border-top: 2px solid var(--rhine-line-strong); border-left: 2px solid var(--rhine-line-strong);
    }
    .menu-card:hover {
      border-color: var(--rhine-accent); background: var(--rhine-panel);
    }
    .menu-card-icon { font-size: 3rem; margin-bottom: 20px; color: var(--rhine-accent); }
    .menu-card-text {
      font-family: var(--rhine-title-font);
      font-size: 1.5rem; font-weight: 800; letter-spacing: 0.08em;
      color: var(--rhine-ink); text-transform: uppercase;
    }
    .menu-card-desc { font-size: 0.78rem; color: var(--rhine-mute); margin-top: 8px; text-align: center; }

    .back-link {
      margin-top: 40px;
      color: var(--rhine-ink);
      text-decoration: none;
      font-family: var(--rhine-title-font);
      font-size: 0.85rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      border: 1px solid var(--rhine-ink);
      background: var(--rhine-bg);
      padding: 10px 22px;
      border-radius: 0;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .back-link:hover {
      background: var(--rhine-accent); border-color: var(--rhine-accent); color: var(--rhine-accent-ink);
    }

    @media (max-width: 600px) {
      .container { max-width: 100%; margin: 10px; min-height: auto; }
      .menu-title { font-size: 1.9rem; letter-spacing: 0.06em; }
      .menu-subtitle { font-size: 0.72rem; margin-bottom: 40px; }
      .menu-options { grid-template-columns: 1fr; gap: 20px; }
      .menu-card { width: 150px; height: 150px; }
      .menu-card-icon { font-size: 2.5rem; margin-bottom: 12px; }
      .menu-card-text { font-size: 1.2rem; }
      .menu-card-desc { font-size: 0.7rem; }
    }
  </style>
<script src="dyson-bg.js"></script>
</head>
<body>
  <div class="container">
    <div class="menu-view">
      <div class="menu-title rhine-h"><span class="rhine-mark"><span class="pm">±</span><span class="inf">∞</span></span><span class="rhine-underline">小游戏</span></div>
      <div class="menu-subtitle">UNITED EARTH GOVNMENT 3 YEARS</div>
      <div class="menu-options">
        <!-- 色块拼图：直接位于 games/ 下 -->
        <a href="games/sc.html" class="menu-card">
          <div class="menu-card-icon">🧩</div>
          <div class="menu-card-text">色块拼图</div>
          <div class="menu-card-desc">障碍上限 · 移动端拖拽</div>
        </a>
        <!-- 卫戍协议：也直接位于 games/ 下，不再有 weishu 子文件夹 -->
        <a href="games/weishu.html" class="menu-card">
          <div class="menu-card-icon">🛡️</div>
          <div class="menu-card-text">卫戍协议</div>
          <div class="menu-card-desc">塔防策略对战</div>
        </a>
        <!-- 舰船强化：蓝图科技强化系统 -->
        <a href="games/enhance.html" class="menu-card">
          <div class="menu-card-icon">🔧</div>
          <div class="menu-card-text">舰船强化</div>
          <div class="menu-card-desc">蓝图科技 · 加点强化</div>
        </a>
      </div>
      <a href="../index.html" class="back-link">← 返回主菜单</a>
    </div>
  </div>
</body>
</html>
