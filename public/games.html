  <link rel="stylesheet" href="rhine-fonts.css" media="print" onload="this.media='all'"> <!-- MiSans（异步加载，不阻塞首屏） -->
  <noscript><link rel="stylesheet" href="rhine-fonts.css"></noscript> <!-- MiSans webfont -->
  <link rel="stylesheet" href="rhine.css">
  <link rel="stylesheet" href="rhine-motion.css"> <!-- 动效层 -->
  <!-- 视觉统一由 rhine.css 设计系统提供 -->
  <script src="rhine-motion.js"></script>
<script src="bgm.js?v=20261004i"></script>
</head>
<body>
  <div class="container">
    <div class="menu-view">
      <div class="menu-title rhine-h"><span class="rhine-underline">小游戏</span></div>
      <div class="menu-subtitle">UNITED EARTH GOVNMENT 3 YEARS</div>
      <div class="menu-options">
        <!-- 色块拼图：直接位于 games/ 下 -->
        <a href="games/sc.html" class="menu-card">
          <div class="menu-card-icon"></div>
          <div class="menu-card-text">色块拼图</div>
          <div class="menu-card-desc">障碍上限 · 移动端拖拽</div>
        </a>
        <!-- 卫戍协议：管理员/官员可见（默认隐藏，验明身份后再放出来） -->
        <a href="games/weishu.html" class="menu-card" id="weishuEntry" style="display:none">
          <div class="menu-card-icon"></div>
          <div class="menu-card-text">卫戍协议</div>
          <div class="menu-card-desc">塔防策略对战</div>
        </a>
        <!-- 舰船强化已迁移到「公会 → 配队攻略 · 舰船强化」 -->
      </div>
      <a href="../index.html" class="back-link">← 返回主菜单</a>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../github-db.js?v=20261007a"></script>
  <script>
    // 卫戍协议入口：管理员与官员（is_admin / is_official）可见。
    // 默认 display:none —— 先藏起来，验明身份再放，普通用户连闪都不会闪。
    // localStorage 里的档案可能是登录时的旧快照，所以本地为真时仍向后端核一次，
    // 以服务端结果覆盖本地（两者任一为真即放行）。
    // 注意本地档案两个来源写入的字段要一致：登录时写 is_admin/is_official，
    // refreshSession 写 is_admin/is_official/is_owner —— 少写 is_official
    // 会让官员在登录后立即访问时被本地那关挡住。
    (async function () {
      var card = document.getElementById('weishuEntry');
      if (!card) return;
      var show = false;
      try {
        if (window.UEG_SESSION_READY) await window.UEG_SESSION_READY;
        var cu = null;
        try { cu = JSON.parse(localStorage.getItem('ueg_current_user') || 'null'); } catch (e) {}
        if (cu && (cu.is_admin || cu.is_official)) {
          show = true;
          if (window.DB && cu.username) {
            try {
              var r = await DB.rest('/rest/v1/users?select=is_admin,is_official&username=eq.' +
                                    encodeURIComponent(cu.username));
              if (r.code === 200 && Array.isArray(r.data) && r.data[0]) {
                var d = r.data[0];
                show = !!(d.is_admin || d.is_official);
              }
            } catch (e) { /* 后端查不到就维持本地判断，不因为一次抖动把管理员/官员挡在门外 */ }
          }
        }
      } catch (e) { show = false; }
      card.style.display = show ? '' : 'none';
    })();
  </script>
</body>
</html>
