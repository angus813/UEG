<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>卫戍协议</title>
<link rel="stylesheet" href="weishu.css">
<script src="../dyson-bg.js"></script>
</head>
<body>
<div class="page">
<div class="side-panel" id="leftPanel" data-mode="welcome">
<div class="welcome" id="welcomeContent">
<span class="big-icon">卫</span>
<h2>卫戍协议</h2>
<p>星河防线 · 舰队编组防御作战</p>
<div class="hint">点击「开始模拟」进入作战</div>
</div>
</div>
<div class="action-panel">
<button class="action-btn primary" id="btnSolo">开始模拟</button>
<button class="action-btn" id="btnMode">协议模式</button>
<button class="action-btn" id="btnSupply">物资调配处</button>
<button class="action-btn" id="btnBlueprint">蓝图数据库</button>
<button class="action-btn" id="btnStrategy">防守策略</button>
<a class="back-link" href="games.html">返回小游戏</a>
</div>
</div>
<div class="modal" id="genericModal">
<div class="modal-box">
<button class="modal-close" id="modalCloseBtn">X</button>
<h3 id="modalTitle">标题</h3>
<div id="modalBody"></div>
</div>
</div>
<div class="modal" id="modeModal">
<div class="modal-box">
<h3>选择协议模式</h3>
<div id="modeList"></div>
</div>
</div>
<div class="modal" id="strategyModal">
<div class="modal-box">
<h3>选择防守策略</h3>
<div class="modal-tip">策略选择后无法更改</div>
<div id="strategyList"></div>
</div>
</div>
<div class="modal" id="deployModal">
<div class="modal-box wide">
<h3>物资调配处 · 舰队配置</h3>
<div id="deployBody"></div>
</div>
</div>
<div class="modal" id="carrierModal">
<div class="modal-box">
<h3 id="carrierTitle">舰载机配置</h3>
<div id="carrierBody"></div>
</div>
</div>
<div class="modal" id="upgradeModal">
<div class="modal-box">
<h3>回合强化</h3>
<div id="upgradeOptions"></div>
</div>
</div>
<div class="modal" id="blueModal">
<div class="modal-box wide">
<h3>本局蓝图数据库</h3>
<div id="blueBody"></div>
</div>
</div>
<div class="modal" id="resultModal">
<div class="modal-box">
<h3 id="resultTitle">战斗结束</h3>
<div id="resultContent"></div>
</div>
</div>
<div class="modal" id="confirmModal">
<div class="modal-box">
<h3 id="confirmTitle">确认</h3>
<div id="confirmBody"></div>
<div class="confirm-actions">
<button class="btn-action" id="confirmOk">确认</button>
<button class="btn-action" id="confirmCancel">取消</button>
</div>
</div>
</div>
<script src="player_ships.js"></script>
<script src="city_fleets.js"></script>
<script src="city_defense.js"></script>
<script src="../supabase-client.js"></script>
<script src="weishu.js"></script>
</body>
</html>
